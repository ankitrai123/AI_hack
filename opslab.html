<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsLab Simulator</title>
<meta name="description" content="OpsLab: AI-Powered Operations Management Simulator for MBA Operations Management / Operations Analytics courses.">
<style>
:root{
  color-scheme: light;
  --bg:#f3f5f9; --panel:#ffffff; --panel-2:#f8f9fc; --ink:#141b2d; --muted:#5a6377; --faint:#8a93a6;
  --line:#e2e6ee; --grid:#eceff4;
  --accent:#4338ca; --accent-ink:#ffffff; --accent-soft:#eef0ff;
  --you:#2a78d6; --ai:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#6250d6;
  --good:#127a3a; --good-soft:#e7f5ec; --bad:#b42318; --bad-soft:#fdeceb; --warn:#9a5b00; --warn-soft:#fff4e0;
  --shade:#f1e8ff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11141b; --panel:#1a1e27; --panel-2:#20252f; --ink:#eef0f4; --muted:#aab2c2; --faint:#7d869a;
    --line:#2d3340; --grid:#262b36;
    --accent:#8b83f0; --accent-ink:#0f1020; --accent-soft:#272a45;
    --you:#3987e5; --ai:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9085e9;
    --good:#4cc27a; --good-soft:#16301f; --bad:#f07a6e; --bad-soft:#3a1d1b; --warn:#f0b54a; --warn-soft:#352914;
    --shade:#2b2340;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11141b; --panel:#1a1e27; --panel-2:#20252f; --ink:#eef0f4; --muted:#aab2c2; --faint:#7d869a;
  --line:#2d3340; --grid:#262b36;
  --accent:#8b83f0; --accent-ink:#0f1020; --accent-soft:#272a45;
  --you:#3987e5; --ai:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9085e9;
  --good:#4cc27a; --good-soft:#16301f; --bad:#f07a6e; --bad-soft:#3a1d1b; --warn:#f0b54a; --warn-soft:#352914;
  --shade:#2b2340;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25}
button{font:inherit;cursor:pointer}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
a{color:var(--accent)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand h1{font-size:17px}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.pill[hidden]{display:none!important}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2);border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 380px;gap:18px;padding:18px 20px;max-width:1680px;margin:0 auto;align-items:start}
.nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:4px}
.nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:10px 8px 4px;font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:500}
.nav button:hover{background:var(--panel)}
.nav button.active{background:var(--panel);box-shadow:var(--shadow);font-weight:700;color:var(--accent)}
.nav .num{width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.nav .runs{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.card h3{font-size:14.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:500;color:var(--muted);font-size:12px;margin-left:auto}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------- topic header ---------- */
.thead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.thead .t{flex:1;min-width:260px}
.thead h2{font-size:21px}
.thead .role{margin:6px 0 0;color:var(--muted)}
details.learn{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.learn summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none}
details.learn summary::-webkit-details-marker{display:none}
details.learn summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.learn[open] summary::before{content:"▾ "}
.learn-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.formula{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.formula div{padding:3px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.formula div b{font-family:system-ui,sans-serif;font-weight:600;color:var(--muted);font-size:12px;display:block}

/* ---------- inputs ---------- */
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.ingroup{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted);margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.ingroup .tag{font-size:10.5px;padding:1px 7px;border-radius:99px;letter-spacing:.02em;text-transform:none;font-weight:700}
.tag.dec{background:var(--accent-soft);color:var(--accent)}
.tag.scn{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.field{padding:4px 0}
.field label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600}
.field label .u{color:var(--faint);font-weight:500}
.field .row{display:flex;align-items:center;gap:10px}
.field input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.field input[type=number],.field select,.field input[type=text]{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:7px;padding:5px 7px;font:inherit;font-size:13px}
.field input[type=number]{width:84px}
.field select,.field input[type=text]{width:100%}
.field .help{font-size:11.5px;color:var(--faint);margin-top:1px}
.field.decision label{color:var(--accent)}
.field.off{opacity:.45}
.checkrow{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding-top:6px}
.checkrow input{width:16px;height:16px;accent-color:var(--accent)}
table.jobs{border-collapse:collapse;width:100%;font-size:12.5px}
table.jobs th,table.jobs td{padding:3px 6px;text-align:left;border-bottom:1px solid var(--line)}
table.jobs input{width:64px}
.scen-agent{border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;margin:8px 0 4px;background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
.scen-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.case-brief{margin:8px 0;max-width:95ch}
.case-sum{cursor:pointer;list-style:none}
.case-sum::-webkit-details-marker{display:none}
details.exhibit{border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin:6px 0;background:var(--panel-2)}
details.exhibit summary{cursor:pointer;font-weight:700;font-size:13px}
.tbl.ex{font-size:12px;margin-top:4px}
.tbl.ex th{text-transform:none;letter-spacing:0;font-size:11.5px}
.ex-sum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin:6px 0 2px}
.tsa-opts{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.tsa-opt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--panel-2);cursor:pointer;font-size:13px}
.tsa-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tsa-opt input{accent-color:var(--accent)}
.tsa-sel{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:7px;padding:4px 6px;font:inherit;font-size:13px}
.tsa-q{margin:14px 0 4px;font-size:13.5px}
.tsa-step{border-top:1px solid var(--line);margin-top:12px;padding-top:6px}
.tsa-table{max-height:280px;overflow:auto}
pre.adf{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.45;overflow-x:auto;margin:8px 0}
.rchip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--line);border-radius:12px;padding:20px;margin-top:12px;cursor:pointer;background:var(--panel-2);text-align:center}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.slide-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel-2);min-width:0}
.slide-imgs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.slide-imgs img{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);background:#fff}
.notes{max-width:90ch}.notes p,.notes li{font-size:13.5px}.notes .note-h{margin:16px 0 4px;color:var(--accent)}
.notes code,.msg code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12px}
ol.quiz{padding-left:20px}ol.quiz>li{margin:12px 0}ol.quiz p{margin:0 0 6px}
.tsa-opt.right{border-color:var(--good);background:var(--good-soft)}.tsa-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.seg{display:inline-flex;margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);padding:7px 14px;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
.rchip.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.rchip.now{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.field.locked input,.field.locked select{opacity:.75}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.err{color:var(--bad);font-weight:600;font-size:12.5px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi.primary{border-color:var(--accent);background:var(--accent-soft)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v.txt{font-size:14px;word-break:break-word;padding-top:5px}
.kpi .d{font-size:11.5px;font-weight:700;margin-top:2px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--faint)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:var(--panel-2)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tr.best td{background:var(--good-soft)}
.tbl tr.user td{background:var(--accent-soft)}
.scroll-x,.chartwrap{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ---------- charts ---------- */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.line{height:3px;border-radius:2px}
.legend i.dash{height:0;border-top:2px dashed var(--faint);border-radius:0;width:16px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px;font-family:system-ui,sans-serif}
svg.chart .gridl{stroke:var(--grid);stroke-width:1}
svg.chart .axis{stroke:var(--line);stroke-width:1}
svg.chart .hit{fill:transparent}
svg.chart [data-tip]{cursor:default}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:6px 9px;border-radius:7px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transition:opacity .08s;white-space:pre-line}

/* ---------- AI panel ---------- */
.ai-head{display:flex;align-items:center;gap:10px}
.ai-badge{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--ai));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.ai-head h3{margin:0}
.ai-head p{margin:0;font-size:11.5px;color:var(--muted)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:4px}
.ai-section{margin-top:12px}
.ai-section h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.score{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.score .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.meter{height:7px;border-radius:99px;background:var(--grid);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.issue{display:flex;gap:8px;padding:8px 10px;border-radius:9px;margin-bottom:6px;font-size:12.5px;border:1px solid var(--line)}
.issue .ic{font-weight:800;flex:none;width:18px;text-align:center}
.issue.high{background:var(--bad-soft);border-color:transparent}
.issue.high .ic{color:var(--bad)}
.issue.med{background:var(--warn-soft);border-color:transparent}
.issue.med .ic{color:var(--warn)}
.issue.ok{background:var(--good-soft);border-color:transparent}
.issue.ok .ic{color:var(--good)}
.issue b{display:block}
.rec{border:1px solid var(--ai);border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--ai) 7%,var(--panel))}
.rec .name{font-weight:800}
ul.clean{margin:4px 0 0;padding-left:18px}
ul.clean li{margin:2px 0}
.log{font-size:11.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.log div{padding:1px 0}
.chg{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 2px 0;font-size:11.5px}

/* ---------- live LLM chat ---------- */
.chat-log{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;margin:8px 0;padding-right:2px}
.msg{font-size:12.8px;padding:8px 10px;border-radius:10px;max-width:92%;line-height:1.45;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.assistant{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line)}
.msg.assistant ul{margin:4px 0;padding-left:18px}
.msg.assistant p{margin:0 0 6px}.msg.assistant p:last-child{margin:0}
.msg.tool{align-self:flex-start;font-size:11.5px;color:var(--muted);padding:2px 4px}
.msg.error{align-self:stretch;background:var(--bad-soft);color:var(--bad)}
.msg .who{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:2px}
.chat-in{display:flex;gap:6px}
.chat-in textarea{flex:1;resize:vertical;min-height:38px;max-height:140px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:7px 9px;font:inherit;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:11.5px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.llm-set{margin-top:8px;font-size:12px}
.llm-set summary{cursor:pointer;color:var(--accent);font-weight:600}
.llm-set .row2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.llm-set input[type=password],.llm-set select{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:7px;padding:5px 7px;font:inherit;font-size:12.5px;flex:1;min-width:150px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.live.on{background:var(--good-soft);color:var(--good)}.live.off{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* ---------- report / guide ---------- */
.doc h2{font-size:20px;margin-bottom:6px}
.doc h3{font-size:16px;margin:18px 0 6px}
.doc p,.doc li{max-width:78ch}
.rep-topic{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.callout{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}

@media (max-width:1280px){
  .app{grid-template-columns:210px minmax(0,1fr)}
  .side{grid-column:2;position:static;max-height:none}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);padding:12px 16px;gap:12px}
  .nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav .group{display:none}
  .nav button{white-space:nowrap;flex:none;background:var(--panel)}
  .nav .runs{display:none}
  .side{grid-column:1}
  .inputs,.learn-grid,.two{grid-template-columns:1fr}
  .top{padding:10px 16px;flex-wrap:wrap;position:static}
  .chartwrap svg.chart{min-width:540px}
  .top .pill{display:none}
}
@media print{
  .top,.nav,.side,.noprint{display:none!important}
  .app{display:block;padding:0}
  .card{box-shadow:none;border:0}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">OL</div>
  <div class="brand">
    <h1>OpsLab</h1>
    <p>AI-Powered Operations Management Simulator</p>
  </div>
  <div class="spacer"></div>
  <button class="pill" id="roomPill" hidden style="border:0;cursor:pointer" title="Open the class room page"></button>
  <span class="pill" id="modePill" title="Simulation results and the built-in agent are deterministic and rule-based. The optional chat agent uses a live LLM (Claude) only if you add your own API key.">Rule-based agent · optional live LLM chat</span>
  <button class="btn small" id="themeBtn" title="Toggle light/dark theme">◐ Theme</button>
  <button class="btn small" id="resetAllBtn" title="Clear all runs in all topics and restore defaults">Reset all</button>
</header>

<div class="app">

<script>
'use strict';
/* =====================================================================
   OpsLab — single-file simulator.
   Sections: 1) utilities  2) topic models (simulation engines)
             3) AI agent   4) charts  5) UI / state  6) report & guide
   All results are computed deterministically from the inputs.
   ===================================================================== */

/* ---------------- 1. Utilities ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = a => a.reduce((s, x) => s + x, 0);
const round = (v, d = 2) => Math.round(v * 10 ** d) / 10 ** d;
const F = {
  money: v => (v < 0 ? '−$' : '$') + Math.abs(Math.round(v)).toLocaleString('en-US'),
  money2: v => (v < 0 ? '−$' : '$') + Math.abs(v).toFixed(2),
  int: v => Math.round(v).toLocaleString('en-US'),
  n1: v => (Math.round(v * 10) / 10).toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1}),
  n2: v => v.toFixed(2),
  pct: v => (v * 100).toFixed(1) + '%',
  text: v => String(v)
};
function fmtV(fmt, v) {
  if (fmt === 'text') return esc(v);
  if (v === null || v === undefined || Number.isNaN(v)) return 'n/a';
  if (!isFinite(v)) return '∞';
  return F[fmt](v);
}
// Seeded PRNG (mulberry32) — same seed gives the same demand stream every time.
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function stdNormals(seed, n) {
  const r = rng(seed), out = [];
  while (out.length < n) {
    const u = r() || 1e-12, v = r();
    const R = Math.sqrt(-2 * Math.log(u));
    out.push(R * Math.cos(2 * Math.PI * v), R * Math.sin(2 * Math.PI * v));
  }
  return out.slice(0, n);
}
// Inverse standard normal CDF (Acklam's approximation, |error| < 1.2e-9)
function normInv(p) {
  if (p <= 0) return -Infinity; if (p >= 1) return Infinity;
  const a = [-3.969683028665376e1, 2.209460984245205e2, -2.759285104469687e2, 1.383577518672690e2, -3.066479806614716e1, 2.506628277459239];
  const b = [-5.447609879822406e1, 1.615858368580409e2, -1.556989798598866e2, 6.680131188771972e1, -1.328068155288572e1];
  const c = [-7.784894002430293e-3, -3.223964580411365e-1, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
  const d = [7.784695709041462e-3, 3.224671290700398e-1, 2.445134137142996, 3.754408661907416];
  const pl = 0.02425; let q, r;
  if (p < pl) { q = Math.sqrt(-2 * Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if (p > 1 - pl) { q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q = p - 0.5; r = q * q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function range(a, b, step) { const out = []; for (let x = a; x <= b + 1e-9; x += step) out.push(round(x, 6)); return out; }

/* ---------------- 2. Topic models ---------------- */
const STATIONS = ['A · Cutting', 'B · Assembly', 'C · Packing'];

const TOPICS = [
/* ===== 1. Bottleneck & Capacity ===== */
{
  id: 'bottleneck', num: 1, name: 'Bottleneck & Capacity', short: 'Bottleneck',
  role: 'You run a three-station line (Cutting → Assembly → Packing) for one shift. Decide how many parallel machines to staff at each station. Every machine costs money; every unit you cannot make is lost contribution.',
  concept: `<p>A process can only go as fast as its slowest step, the <b>bottleneck</b>. Adding capacity anywhere else adds cost but no output. Once the bottleneck is relieved, the constraint <i>moves</i> to the next-slowest station, or to market demand.</p>
  <p>The goal is not to max out every station. It is to buy capacity where it raises throughput by more than it costs.</p>`,
  formulas: [
    ['Station capacity', 'Capᵢ = machinesᵢ × shift ÷ timeᵢ'],
    ['Throughput', 'TH = min( min Capᵢ , Demand )'],
    ['Utilization', 'Uᵢ = TH ÷ Capᵢ'],
    ['Cycle time (line pace)', 'CT = max( timeᵢ ÷ machinesᵢ )'],
    ['Line efficiency', 'Σ timeᵢ ÷ ( Σ machinesᵢ × CT )'],
    ['Shift profit', 'TH × margin − Σ machines × machine cost']
  ],
  params: [
    {id: 'mA', label: 'Machines at A (Cutting)', role: 'decision', min: 1, max: 4, step: 1, def: 1},
    {id: 'mB', label: 'Machines at B (Assembly)', role: 'decision', min: 1, max: 4, step: 1, def: 1},
    {id: 'mC', label: 'Machines at C (Packing)', role: 'decision', min: 1, max: 4, step: 1, def: 1},
    {id: 'tA', label: 'Process time A', unit: 'min/unit', role: 'scenario', min: 1, max: 15, step: 0.5, def: 4},
    {id: 'tB', label: 'Process time B', unit: 'min/unit', role: 'scenario', min: 1, max: 15, step: 0.5, def: 7},
    {id: 'tC', label: 'Process time C', unit: 'min/unit', role: 'scenario', min: 1, max: 15, step: 0.5, def: 5},
    {id: 'demand', label: 'Demand per shift', unit: 'units', role: 'scenario', min: 20, max: 300, step: 5, def: 100},
    {id: 'shift', label: 'Shift length', unit: 'min', role: 'scenario', min: 240, max: 720, step: 30, def: 480},
    {id: 'margin', label: 'Contribution margin', unit: '$/unit', role: 'scenario', min: 5, max: 100, step: 1, def: 25},
    {id: 'mcost', label: 'Cost per machine', unit: '$/shift', role: 'scenario', min: 0, max: 500, step: 10, def: 120}
  ],
  objective: {key: 'profit', dir: 'max'},
  kpis: [
    {key: 'profit', label: 'Shift profit', fmt: 'money', better: 'high', primary: true},
    {key: 'throughput', label: 'Throughput (units)', fmt: 'int', better: 'high'},
    {key: 'lost', label: 'Unmet demand (units)', fmt: 'int', better: 'low'},
    {key: 'bottleneck', label: 'Constraint', fmt: 'text'},
    {key: 'cycle', label: 'Cycle time (min/unit)', fmt: 'n2', better: 'low'},
    {key: 'balance', label: 'Line efficiency', fmt: 'pct', better: 'high'},
    {key: 'machines', label: 'Machines used', fmt: 'int', better: null},
    {key: 'idleCost', label: 'Idle capacity cost', fmt: 'money', better: 'low'}
  ],
  simulate(p) {
    const m = [p.mA, p.mB, p.mC], t = [p.tA, p.tB, p.tC];
    const cap = m.map((mi, i) => mi * p.shift / t[i]);
    const minCap = Math.min(...cap);
    const bIdx = cap.indexOf(minCap);
    const throughput = Math.floor(Math.min(minCap, p.demand) + 1e-9);
    const util = cap.map(c => throughput / c);
    const cycle = Math.max(...t.map((ti, i) => ti / m[i]));
    const machines = sum(m);
    const balance = sum(t) / (machines * cycle);
    const machineCost = machines * p.mcost;
    const contribution = throughput * p.margin;
    const idleCost = sum(util.map((u, i) => (1 - u) * m[i] * p.mcost));
    const demandBound = p.demand <= minCap;
    return {
      cap, util, m, t, throughput, lost: Math.max(0, p.demand - throughput), cycle, balance, machines,
      machineCost, contribution, profit: contribution - machineCost, idleCost, bIdx, demandBound,
      bottleneck: demandBound ? 'Market demand' : STATIONS[bIdx], flowTime: sum(t)
    };
  },
  alternatives(p) {
    const r = this.simulate(p), out = [];
    const key = ['mA', 'mB', 'mC'][r.bIdx];
    if (!r.demandBound && p[key] < 4) out.push({name: 'Add 1 machine at the bottleneck', why: `Relieve ${STATIONS[r.bIdx]}`, p: {...p, [key]: p[key] + 1}});
    // Minimum machines that meet demand at every station
    const need = ['A', 'B', 'C'].map(s => clamp(Math.ceil(p.demand * p['t' + s] / p.shift - 1e-9), 1, 4));
    out.push({name: 'Staff every station to meet demand', why: 'Minimum machines so no station limits demand', p: {...p, mA: need[0], mB: need[1], mC: need[2]}});
    out.push({name: 'Lean: one machine everywhere', why: 'Lowest fixed cost', p: {...p, mA: 1, mB: 1, mC: 1}});
    return out;
  },
  search(p) {
    let best = null, n = 0;
    for (let a = 1; a <= 4; a++) for (let b = 1; b <= 4; b++) for (let c = 1; c <= 4; c++) {
      n++; const q = {...p, mA: a, mB: b, mC: c}; const r = this.simulate(q);
      if (!best || r.profit > best.r.profit + 1e-9 || (Math.abs(r.profit - best.r.profit) < 1e-9 && r.machines < best.r.machines)) best = {p: q, r};
    }
    return {name: 'Optimizer: best staffing plan', why: `Exhaustive search of all ${n} staffing plans (1–4 machines per station)`, p: best.p, n};
  },
  describe: p => `A/B/C = ${p.mA}/${p.mB}/${p.mC} machines`,
  diagnose(p, r) {
    const out = [];
    if (r.demandBound) out.push({sev: 'ok', code: 'demandmet', title: 'Demand fully met', text: `Market demand (${p.demand}/shift) is now the constraint. More machines would only add cost.`});
    else out.push({sev: 'high', code: 'bottleneck', title: `Bottleneck: ${STATIONS[r.bIdx]}`, text: `It can make only ${F.n1(r.cap[r.bIdx])} units/shift against demand of ${p.demand}. ${F.int(r.lost)} units of demand go unmet, losing ${F.money(r.lost * p.margin)} of contribution.`});
    r.util.forEach((u, i) => {
      if (u < 0.6 && r.m[i] > 1) out.push({sev: 'med', code: 'overcap', title: `Excess capacity at ${STATIONS[i]}`, text: `Utilization is only ${F.pct(u)} with ${r.m[i]} machines. One fewer machine saves ${F.money(p.mcost)} per shift.`});
    });
    if (!r.demandBound) {
      const second = r.cap.map((c, i) => ({c, i})).filter(x => x.i !== r.bIdx).sort((a, b) => a.c - b.c)[0];
      out.push({sev: 'med', code: 'shift', title: 'Watch the next constraint', text: `If you relieve ${STATIONS[r.bIdx]}, the constraint moves to ${second.c < p.demand ? STATIONS[second.i] + ` (${F.n1(second.c)} units)` : 'market demand'}.`});
    }
    if (r.balance < 0.7) out.push({sev: 'med', code: 'balance', title: 'Line is poorly balanced', text: `Line efficiency is ${F.pct(r.balance)}: ${F.pct(1 - r.balance)} of paid machine time is idle.`});
    if (r.profit < 0) out.push({sev: 'high', code: 'loss', title: 'The shift loses money', text: 'Machine cost exceeds contribution. Cut machines that do not raise throughput.'});
    return out;
  },
  lessons: {
    bottleneck: 'An hour lost at the bottleneck is an hour lost for the whole system. Add capacity at the constraint first.',
    overcap: 'An hour saved at a non-bottleneck saves nothing. Capacity there is only cost.',
    shift: 'Bottlenecks move. After each improvement, find the new constraint (Theory of Constraints: identify, exploit, elevate, repeat).',
    balance: 'Line balancing matters because idle machine time is paid for whether or not it is used.',
    demandmet: 'When demand is the constraint, the operations job turns to cost: remove capacity that is not needed.',
    loss: 'Capacity decisions must be justified by contribution: Δ throughput × margin > Δ cost.'
  },
  explain(p, r, b) {
    return `The recommended plan uses <b>${b.r.machines}</b> machines versus your <b>${r.machines}</b>. Throughput goes from ${F.int(r.throughput)} to ${F.int(b.r.throughput)} units. Each extra unit is worth ${F.money(p.margin)} and each machine costs ${F.money(p.mcost)}, so a machine pays for itself only if it adds at least ${F.n1(p.mcost / p.margin)} units of throughput.`;
  },
  chart(r, b) {
    const ref = {value: lastParams('bottleneck').demand, label: 'Demand'};
    return legend([['You', 'var(--you)'], ['AI recommendation', 'var(--ai)'], ['Demand', null, 'dash']]) +
      barGroups({categories: STATIONS, series: [{name: 'You', color: 'var(--you)', values: r.cap}, {name: 'AI', color: 'var(--ai)', values: b.cap}],
        ref, yLabel: 'Capacity (units/shift)', fmt: F.n1, sub: r.util.map((u, i) => `util ${F.pct(u)}`)});
  },
  chartTitle: 'Capacity per station vs demand'
},

/* ===== 2. Inventory Management ===== */
{
  id: 'inventory', num: 2, name: 'Inventory Management', short: 'Inventory',
  role: 'You manage a stocked component with uncertain daily demand. Choose a reorder point (ROP) and order quantity (Q). Holding stock costs money, each order has a fixed cost, and every unit you cannot supply is a lost sale.',
  concept: `<p>A <b>continuous-review (ROP, Q)</b> policy places an order of Q units whenever inventory position (on hand + on order) falls to the reorder point. Q sets the trade-off between <b>ordering cost</b> and <b>holding cost</b> (EOQ). The ROP must cover demand during the supplier lead time plus <b>safety stock</b> for demand variability.</p>
  <p>The simulation runs ${'90'} days of daily demand drawn from a seeded random stream, so every run with the same scenario sees exactly the same demand.</p>`,
  formulas: [
    ['Economic order quantity', 'EOQ = √( 2 · D · S ÷ H )'],
    ['Lead-time demand', 'μ_L = d̄ × L'],
    ['Safety stock', 'SS = z × σ_d × √L'],
    ['Reorder point', 'ROP = d̄ × L + SS'],
    ['Total cost', 'Σ holding (H × on-hand) + orders × S + short units × p'],
    ['Fill rate', 'units sold ÷ units demanded']
  ],
  params: [
    {id: 'rop', label: 'Reorder point (ROP)', unit: 'units', role: 'decision', min: 0, max: 400, step: 5, def: 80},
    {id: 'q', label: 'Order quantity (Q)', unit: 'units', role: 'decision', min: 10, max: 800, step: 10, def: 100},
    {id: 'mu', label: 'Average daily demand', unit: 'units/day', role: 'scenario', min: 5, max: 60, step: 1, def: 20},
    {id: 'sigma', label: 'Demand std. deviation', unit: 'units/day', role: 'scenario', min: 0, max: 20, step: 1, def: 6},
    {id: 'lt', label: 'Supplier lead time', unit: 'days', role: 'scenario', min: 1, max: 15, step: 1, def: 5},
    {id: 'h', label: 'Holding cost', unit: '$/unit/day', role: 'scenario', min: 0.01, max: 1, step: 0.01, def: 0.1},
    {id: 'S', label: 'Ordering cost', unit: '$/order', role: 'scenario', min: 10, max: 500, step: 10, def: 120},
    {id: 'pen', label: 'Stockout cost', unit: '$/unit short', role: 'scenario', min: 1, max: 50, step: 1, def: 12},
    {id: 'start', label: 'Starting inventory', unit: 'units', role: 'scenario', min: 0, max: 500, step: 10, def: 120},
    {id: 'days', label: 'Simulation horizon', unit: 'days', role: 'scenario', min: 30, max: 180, step: 30, def: 90},
    {id: 'seed', label: 'Demand scenario', role: 'scenario', type: 'select', def: 1, options: [[1, 'Scenario 1'], [2, 'Scenario 2'], [3, 'Scenario 3'], [4, 'Scenario 4'], [5, 'Scenario 5']], help: 'Each scenario is a different fixed random demand stream.'}
  ],
  objective: {key: 'total', dir: 'min'},
  kpis: [
    {key: 'total', label: 'Total cost', fmt: 'money', better: 'low', primary: true},
    {key: 'fill', label: 'Fill rate', fmt: 'pct', better: 'high'},
    {key: 'stockoutDays', label: 'Stockout days', fmt: 'int', better: 'low'},
    {key: 'avgInv', label: 'Avg on-hand inventory', fmt: 'n1', better: null},
    {key: 'orders', label: 'Orders placed', fmt: 'int', better: null},
    {key: 'holding', label: 'Holding cost', fmt: 'money', better: 'low'},
    {key: 'ordering', label: 'Ordering cost', fmt: 'money', better: 'low'},
    {key: 'shortCost', label: 'Stockout cost', fmt: 'money', better: 'low'}
  ],
  refs(p) {
    const eoq = Math.sqrt(2 * p.mu * p.S / p.h);
    const sdL = p.sigma * Math.sqrt(p.lt);
    return {eoq, ltd: p.mu * p.lt, sdL, rop95: p.mu * p.lt + 1.645 * sdL, rop99: p.mu * p.lt + 2.326 * sdL};
  },
  simulate(p) {
    const T = p.days, z = stdNormals(1000 + p.seed * 7919, T);
    const demand = z.map(x => Math.max(0, Math.round(p.mu + p.sigma * x)));
    let onHand = p.start; const arrivals = new Array(T + p.lt + 2).fill(0);
    let onOrder = 0, orders = 0, holding = 0, short = 0, sold = 0, stockoutDays = 0;
    const inv = [], orderDays = [];
    for (let t = 0; t < T; t++) {
      if (arrivals[t]) { onHand += arrivals[t]; onOrder -= arrivals[t]; }
      const d = demand[t], s = Math.min(onHand, d);
      onHand -= s; sold += s;
      if (d > s) { short += d - s; stockoutDays++; }
      let ip = onHand + onOrder, n = 0;
      while (ip <= p.rop && n < 50) { arrivals[t + p.lt] += p.q; onOrder += p.q; ip += p.q; orders++; n++; }
      if (n) orderDays.push(t);
      holding += p.h * onHand;
      inv.push(onHand);
    }
    const dem = sum(demand), ordering = orders * p.S, shortCost = short * p.pen;
    return {inv, demand, orderDays, orders, holding, ordering, shortCost, total: holding + ordering + shortCost,
      fill: dem ? sold / dem : 1, stockoutDays, short, avgInv: sum(inv) / T, refs: this.refs(p)};
  },
  alternatives(p) {
    const R = this.refs(p), q = Math.max(10, Math.round(R.eoq / 10) * 10);
    return [
      {name: 'Textbook: EOQ + 95% service ROP', why: `Q = EOQ ≈ ${Math.round(R.eoq)}, ROP = d̄L + 1.645σ√L ≈ ${Math.round(R.rop95)}`, p: {...p, q, rop: Math.round(R.rop95)}},
      {name: 'Textbook: EOQ + 99% service ROP', why: `Higher safety stock (z = 2.326), ROP ≈ ${Math.round(R.rop99)}`, p: {...p, q, rop: Math.round(R.rop99)}},
      {name: 'Keep your Q, fix ROP to 95% level', why: 'Change only the reorder point', p: {...p, rop: Math.round(R.rop95)}},
      {name: 'Keep your ROP, use EOQ', why: 'Change only the order size', p: {...p, q}}
    ];
  },
  search(p) {
    const R = this.refs(p);
    const ropMax = Math.ceil(R.ltd + 4 * R.sdL + p.mu);
    const ropStep = Math.max(1, Math.round(ropMax / 40));
    const qMax = Math.max(60, Math.round(R.eoq * 2.5)), qStep = Math.max(5, Math.round(qMax / 40 / 5) * 5);
    let best = null, n = 0;
    for (let rop = 0; rop <= ropMax; rop += ropStep) for (let q = qStep; q <= qMax; q += qStep) {
      n++; const cand = {...p, rop, q}; const r = this.simulate(cand);
      if (!best || r.total < best.r.total - 1e-9) best = {p: cand, r};
    }
    return {name: 'Optimizer: simulated grid search', why: `${n} (ROP, Q) policies simulated on the same demand stream`, p: best.p, n};
  },
  describe: p => `ROP ${p.rop}, Q ${p.q}`,
  diagnose(p, r) {
    const R = r.refs, out = [];
    if (p.rop < R.ltd) out.push({sev: 'high', code: 'lowrop', title: 'Reorder point below lead-time demand', text: `ROP ${p.rop} is less than expected demand during the ${p.lt}-day lead time (${F.n1(R.ltd)}). On average you run out before every delivery: ${r.stockoutDays} stockout days, ${F.int(r.short)} units lost.`});
    else if (r.fill < 0.95) out.push({sev: 'med', code: 'lowss', title: 'Safety stock too thin', text: `Fill rate is ${F.pct(r.fill)}. A 95% service ROP would be about ${Math.round(R.rop95)} (SS = 1.645 × ${F.n1(R.sdL)}).`});
    if (p.rop > R.rop99 + R.sdL) out.push({sev: 'med', code: 'highrop', title: 'Excess safety stock', text: `ROP ${p.rop} is well above the 99% level (${Math.round(R.rop99)}). Extra stock adds holding cost and buys almost no extra service.`});
    const ratio = p.q / R.eoq;
    if (ratio < 0.6) out.push({sev: 'med', code: 'smallq', title: 'Orders too small and too frequent', text: `Q is ${F.pct(ratio)} of EOQ (${Math.round(R.eoq)}). ${r.orders} orders cost ${F.money(r.ordering)} in ordering cost.`});
    if (ratio > 1.6) out.push({sev: 'med', code: 'bigq', title: 'Orders too large', text: `Q is ${F.n1(ratio)}× EOQ (${Math.round(R.eoq)}). Large batches inflate cycle stock and holding cost (${F.money(r.holding)}).`});
    const share = r.shortCost / (r.total || 1);
    if (share > 0.3) out.push({sev: 'high', code: 'shortshare', title: 'Stockouts dominate cost', text: `${F.pct(share)} of total cost comes from lost sales.`});
    if (!out.length) out.push({sev: 'ok', code: 'balanced', title: 'Policy is well balanced', text: `Fill rate ${F.pct(r.fill)} with holding, ordering and stockout costs in proportion.`});
    return out;
  },
  lessons: {
    lowrop: 'The reorder point must at least cover expected demand during the lead time. Otherwise stockouts are built into the policy.',
    lowss: 'Safety stock is how you buy service level: SS = z·σ·√L. Uncertainty and longer lead times both need more of it.',
    highrop: 'Service level has diminishing returns. Going from 99% to 99.9% needs far more stock than going from 90% to 95%.',
    smallq: 'Small frequent orders keep cycle stock low but multiply fixed ordering costs. EOQ balances the two.',
    bigq: 'Large orders cut ordering cost but tie up cash in cycle stock (average ≈ Q/2).',
    shortshare: 'When stockouts are expensive, holding a little more inventory is usually the cheapest insurance.',
    balanced: 'A good policy balances holding, ordering and shortage costs. The EOQ cost curve is flat near its minimum, so being close is enough.'
  },
  explain(p, r, b) {
    const R = r.refs;
    return `The recommended policy is <b>ROP ${b.p.rop}, Q ${b.p.q}</b>. For reference, EOQ ≈ ${Math.round(R.eoq)} and a 95% service ROP ≈ ${Math.round(R.rop95)} (lead-time demand ${F.n1(R.ltd)} + safety stock ${F.n1(1.645 * R.sdL)}). The optimizer tested the policies on the <i>same</i> demand stream, so the differences come from the policy, not from luck. Its policy may differ from the formula because the stockout cost of ${F.money(p.pen)}/unit sets the best service level, not an assumed 95%.`;
  },
  chart(r, b) {
    const x = r.inv.map((_, i) => i + 1);
