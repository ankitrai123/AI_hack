    <li>Explain and reduce the bullwhip effect with forecasting, order smoothing, point-of-sale data sharing and shorter lead times.</li>
    <li>Build an aggregate production plan and compare level, chase and hybrid strategies (workforce, overtime, subcontracting, inventory).</li>
    <li>Design a distribution network that trades DC fixed costs against inbound and outbound transport and a service radius.</li>
    <li>Build a forecast step by step (Box–Jenkins): visual check, ADF test, regular and seasonal differencing, ACF/PACF identification of ARIMA and SARIMA orders, and model selection across ARIMA, SARIMA, naïve, moving-average and exponential-smoothing models with AIC/BIC and out-of-sample MAPE.</li>
    <li>Use analytics (what-if testing, optimization, diagnosis) to evaluate operational decisions.</li></ol>
  <h3>Suggested 75-minute session</h3><table class="tbl"><thead><tr><th>Time</th><th>Activity</th></tr></thead><tbody>
    <tr><td>0–10</td><td>Introduce the role: students are operations managers. Show the layout: decisions (blue) vs scenario inputs.</td></tr>
    <tr><td>10–55</td><td>Pick 3–4 topics, about 10 minutes each. For each: (1) open <i>Concept &amp; formulas</i>; (2) ask the class to predict the best decision; (3) run with defaults; (4) let teams change one decision at a time and run again; (5) open <b>Get AI advice</b> and discuss the trade-offs.</td></tr>
    <tr><td>55–70</td><td>Stress-test: change a scenario input (e.g. demand +30%, longer disruption) and ask whether the recommended decision is still best.</td></tr>
    <tr><td>70–75</td><td>Open the <b>Session report</b> and discuss the lessons. Print or save it as PDF for the course record.</td></tr></tbody></table>
  <h3>Discussion prompts</h3><ul>
    <li><b>Bottleneck:</b> Why does adding a machine at Cutting change nothing? Where does the bottleneck move after you fix Assembly?</li>
    <li><b>Inventory:</b> Why is the agent's ROP different from the 95% textbook ROP? What service level do the cost inputs imply?</li>
    <li><b>Scheduling:</b> Which rule minimizes average flow time, and which minimizes lateness? Why is the makespan always the same?</li>
    <li><b>Quality:</b> At what external failure cost does 100% inspection become worthwhile? Why does prevention beat inspection here?</li>
    <li><b>Queues:</b> Why does going from 4 to 5 servers cut waiting so much more than going from 5 to 6?</li>
    <li><b>Disruption:</b> Set duration to 0. Which strategy wastes the most money? How do you price resilience?</li>
    <li><b>Process time:</b> Why does halving the batch size first cut lead time and then suddenly make it explode? What does SMED change? What share of the lead time is value-added?</li></ul>
  <h3>Topic 12: Time Series Analysis lab</h3>
  <p>A stepwise lab that follows the forecasting sessions: (1) visualise and judge stationarity (trend, weekly seasonality, variance), (2) run the ADF test and conclude, (3) choose a transformation: regular difference, seasonal difference Δ₇, both, or a log, (4) re-test with the ADF test and a weekly-pattern check (or difference again), (5) read the ACF and (6) the PACF, at the short lags and, after seasonal differencing, at lags 7, 14 and 21, (7) fit up to four candidates from any family: ARIMA, SARIMA(p,d,q)(P,D,Q)₇, naïve, seasonal naïve, moving average, SES, Holt, Holt-Winters additive or multiplicative (trained on 335 days, tested on the last 30), and (8) choose the model to forecast with. Seven datasets cover AR, MA, ARMA, ARIMA and two weekly-seasonal SARIMA processes. The Analytics Agent runs only the analyses students request and checks every decision against the evidence; it waits for the student and never advances on its own. The debrief reveals the true generating process, an automatic AIC search, a <b>model tournament</b> of every family on the same test set, a scorecard and a 14-day forecast. ADF, ACF and PACF match Python statsmodels and SARIMA estimates agree with SARIMAX, so students can repeat the analysis in Colab using the CSV. Use “Mystery dataset” for an exam-style exercise and “New sample” to give each student different data.</p>
  <h3>Discussion prompts for topics 8–11</h3><ul>
    <li><b>Contracts:</b> Why does the retailer order less under the wholesale contract than the supply chain would like? Find a buyback refund that makes the retailer order the chain optimum.</li>
    <li><b>Bullwhip:</b> Which single remedy cuts the factory's order swings most: sharing POS data, smoothing orders or a shorter lead time? Why does safety stock make it worse?</li>
    <li><b>Aggregate planning:</b> At what layoff cost does the chase plan stop being competitive? What happens to the level plan when seasonality doubles?</li>
    <li><b>Network design:</b> Raise the service target to 90% within 500 km. How many DCs do you need, and what does responsiveness cost per unit?</li></ul>
  <h3>Study Room</h3>
  <p>Students upload your session .pptx in <b>Study Room</b> and get study notes, a slide viewer with visual explanations, quiz practice and slide-grounded Q&amp;A, plus buttons that open the matching OpsLab simulation. Files are read in the browser. Slide text goes only to the AI model the student connects (Ollama keeps it on their laptop). Without an AI model connected, the agent still builds notes, quizzes and answers directly from the slides. A good routine is to share the deck after class, ask students to score 80% or more on a quiz, and then play the linked simulation.</p>
  <h3>Scenario Agent and Ollama</h3>
  <p>Every topic has a <b>Scenario Agent</b>: type a brief (or leave it empty) and it writes a new case (title, story and scenario values), or a whole campaign when you pick “Rounds: written by the Scenario Agent”. Values are checked against each input's range and decisions are never changed. Without an AI model connected, <b>Random case</b> lets the agent generate variations itself. For a free model, click <b>Use Ollama</b>. When students use the class server, your laptop's Ollama serves everyone. Use it to give each team a different case, or to localise cases to your students' industries.</p>
  <h3>Campaign mode (quarters or years)</h3>
  <p>Each topic has a <b>Campaign</b> switch. Pick quarterly (4 or 8 quarters) or yearly (3 or 5 years). Every round brings a briefing with new conditions (growth, seasonality, cost changes, a launch, a recall, a supplier shutdown revealed only after the plan is committed). Students set decisions once per round. Results are scaled to the period and summed, and compared with the AI's best plan for each round (a hindsight benchmark). It works well as homework or a team competition: "Who runs the plant best over two years?" In the class room, official campaign rounds count for the leaderboard.</p>
  <h3>How the AI agent works</h3>
  <p>The <b>OpsLab Agent</b> runs in the browser and works directly on the simulation engine, so every number it reports is computed, never guessed. After every run it:</p>
  <ol><li><b>Tracks</b> the decisions you changed and the resulting KPI movement.</li>
    <li><b>Diagnoses</b> issues using operations rules (e.g. ROP &lt; lead-time demand, utilization &gt; 85%, external failure share &gt; 40%).</li>
    <li><b>Generates alternatives</b>: textbook heuristics (EOQ, SPT/EDD, Moore–Hodgson…) plus an exhaustive or grid search over the decision space.</li>
    <li><b>Simulates</b> every alternative with the <i>same</i> engine and scenario (same random demand stream), so differences come only from the decision.</li>
    <li><b>Ranks</b> on the topic objective (profit, total cost, penalty), respecting constraints such as the service-level target, and lists what the best option gains and gives up.</li>
    <li><b>Reports</b> after the run, never during. Detailed advice appears only when you press <i>Get AI advice</i>.</li></ol>
  <h3>Optional: live AI agent chat</h3>
  <p>The <b>Ask the AI agent</b> box (right panel) lets students ask free-form questions such as “Should I add a machine at B?” or “What if demand rises 30%?”. Connect any AI model under <i>AI model settings</i>: Anthropic Claude, NVIDIA NIM, OpenAI, Groq, OpenRouter, Google Gemini, a local Ollama model, or any OpenAI-compatible endpoint. The OpsLab Agent then answers through that model. For providers that block browser calls (e.g. NVIDIA), run <code>node tools/llm-proxy.mjs</code> and tick <i>Use local proxy</i>. Models without tool calling still work: OpsLab sends them pre-computed simulator data. It has four tools: read the current state, run the simulation as a sandbox, run the optimizer, and propose settings. It must quote only numbers those tools return. Suggestions appear as an <i>Apply suggested settings</i> button; nothing changes until the student applies and runs. Without a key, the OpsLab Agent answers from its own analysis, so the demo works without internet and at no cost.</p>
  <p class="small muted">Classroom tip: run the live agent from the instructor's machine with a spending-limited key. Don't save keys on shared computers.</p>
  <h3>Optional: run it as a class room</h3>

function applyChanges(t, base, changes, onlyRole) {
  const p = JSON.parse(JSON.stringify(base)), errors = [];
  Object.entries(changes || {}).forEach(([id, v]) => {
    const x = t.params.find(q => q.id === id);
    if (!x) { errors.push(`Unknown input "${id}". Valid ids: ${t.params.map(q => q.id).join(', ')}`); return; }
    if (onlyRole && x.role !== onlyRole) { errors.push(`"${id}" is a ${x.role} input, not a ${onlyRole}`); return; }
    if (x.type === 'checkbox') p[id] = v === true || v === 'true' || v === 1;
    else if (x.type === 'text') p[id] = String(v);
    else if (x.type === 'select') { const o = x.options.find(o => String(o[0]).toUpperCase() === String(v).toUpperCase()); if (!o) errors.push(`"${id}" must be one of ${x.options.map(o => o[0]).join(', ')}`); else p[id] = o[0]; }
    else if (x.type === 'jobs') {
      if (!Array.isArray(v) || v.some(j => !p.jobs.find(k => k.id === j.id))) errors.push('jobs must be an array of {id, p, d} using existing job ids');
      else v.forEach(j => { const k = p.jobs.find(k => k.id === j.id); if (j.p != null) k.p = clamp(Math.round(+j.p), 1, 30); if (j.d != null) k.d = clamp(Math.round(+j.d), 1, 120); });
    } else {
      const n = +v; if (!isFinite(n)) { errors.push(`"${id}" must be a number`); return; }
      const c = round(clamp(Math.round(n / x.step) * x.step, x.min, x.max), 4);
      if (Math.abs(c - n) > 1e-9) errors.push(`Note: ${id}=${n} adjusted to ${c} (allowed ${x.min}–${x.max}, step ${x.step})`);
      p[id] = c;
    }
  });
  if (!errors.some(e => !e.startsWith('Note')) && t.validate) { const e = t.validate(p); if (e) errors.push(e); }
  return {p, errors};
}
function kpiDump(t, r, p) {

  if (t.feasible) o['Meets service target'] = t.feasible(r, p);

}
function paramDump(t, p) {
  return t.params.map(x => {
    const d = {id: x.id, label: x.label, role: x.role, value: p[x.id]};
    if (x.unit) d.unit = x.unit;
    if (x.type === 'select') d.options = x.options.map(o => o[0]);
    else if (x.type === 'checkbox') d.type = 'boolean';
    else if (x.type === 'text') d.type = 'text (used when rule = CUSTOM)';
    else if (x.type !== 'jobs') Object.assign(d, {min: x.min, max: x.max, step: x.step});
    if (x.help) d.note = x.help;
    return d;
  });
}
function runTool(t, name, input) {

  for (const k of ['changes', 'scenario_changes']) if (input[k] != null && (typeof input[k] !== 'object' || Array.isArray(input[k]))) return {error: `"${k}" must be an object mapping input ids to values`};

      inputs_differ_from_latest_run: run ? JSON.stringify(run.p) !== JSON.stringify(cur) : null,

      campaign: state.mode[t.id] === 'campaign' && state.camp[t.id] ? (() => { const c = state.camp[t.id]; const nr = c.rounds.length < c.n ? roundFor(t, c, c.rounds.length) : null;

    return {note: `Ran simulation: ${label} → ${obj.label} ${fmtV(obj.fmt, r[obj.key])}`,
      out: {tested: label, decisions: t.describe(p), objective: objText, kpis: kpiDump(t, r, p), diagnosis: t.diagnose(p, r).map(i => i.title), notes: errors}};
  }
  if (name === 'optimize') {
    const {p, errors} = applyChanges(t, cur, input.scenario_changes || {}, 'scenario');
    const hard = errors.filter(e => !e.startsWith('Note'));
    if (hard.length) return {error: hard.join('; '), note: 'Optimizer input rejected'};
    const a = Agent.analyze(t, p, t.simulate(p));
    return {note: `Ran optimizer: ${F.int(a.evaluated)} options tested → best ${t.describe(a.best.p)}`,
      out: {objective: objText, options_evaluated: a.evaluated, ranked: a.ranked.slice(0, 5).map(c => ({rank: c.rank, option: c.isUser ? 'Student\'s current inputs' : c.name, decisions: t.describe(c.p), kpis: kpiDump(t, c.r, c.p)}))}};

  }

}

// --- provider adapters -------------------------------------------------------
function endpoint(a, path) {
  const url = a.base.replace(/\/+$/, '') + path;
  if (!a.proxy) return url;
  const m = url.match(/^(https?):\/\/(.+)$/);
  return LLM.proxyUrl.replace(/\/+$/, '') + '/' + m[1] + '/' + m[2];
}
async function postJSON(a, url, headers, body) {
  let res;
  try { res = await fetch(url, body === undefined ? {method: 'GET', headers} : {method: 'POST', headers, body: JSON.stringify(body)}); }
  catch (e) {
    if (a.proxy) throw new Error(`Could not reach the local proxy at ${LLM.proxyUrl}. Start it with: node tools/llm-proxy.mjs`);
    if (a.id === 'ollama') throw new Error('Could not reach Ollama. Start it with OLLAMA_ORIGINS="*" ollama serve, and pull the model first (ollama pull ' + a.model + ').');
    throw new Error(`The browser could not reach ${a.label}. Either there is no internet connection, or the provider blocks direct browser calls (CORS). Tick "Use local proxy" and run: node tools/llm-proxy.mjs`);
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const raw = (data.error && (data.error.message || data.error)) || data.detail || data.message || res.statusText;
    const msg = typeof raw === 'string' ? raw : JSON.stringify(raw);
    const err = new Error(
      res.status === 401 || res.status === 403 ? `${a.label} rejected the API key (${res.status}). Check it in AI model settings.` :
      res.status === 404 ? `${a.label} returned 404: check the model id "${a.model}" and the base URL. Click “Load models” to see what is available. (${msg})` :
      res.status === 410 ? `The model "${a.model}" has been retired by ${a.label}. Click “Load models” in AI model settings and pick a current one. (${msg})` :
      res.status === 429 ? 'Rate limit or quota reached (429). Wait a moment and ask again.' :
      res.status >= 500 ? `${a.label} is busy or unavailable (${res.status}). Try again shortly.` :
      `${a.label} error ${res.status}: ${msg}`);
    err.status = res.status; err.detail = msg;
    throw err;
  }
  return data;
}

async function stepAnthropic(a, messages) {

  const headers = {'content-type': 'application/json', 'x-api-key': a.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'};
  if (/^claude-(opus|sonnet)-5|^claude-fable/.test(a.model)) { body.output_config = {effort: 'medium'}; body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }
  const res = await postJSON(a, endpoint(a, '/messages'), headers, body);

  }
  LLM.busy = true; refreshAI(t);
  const startLen = chat.api.length;
  let retryNext = false;
  const userText = `[Topic: ${t.name}]\n${question}`;
  try {
    for (let step = 0; step < LLM.maxSteps; step++) {
      if (step === 0) chat.api.push(a.format === 'anthropic' ? {role: 'user', content: [{type: 'text', text: userText}]} : {role: 'user', content: userText + (chat.grounded ? groundedContext(t) : '')});
      let res;
      try { res = a.format === 'anthropic' ? await stepAnthropic(a, chat.api) : await stepOpenAI(a, chat.api, chat.grounded); }
      catch (e) {
        // Model does not support tool calling: switch this chat to grounded mode and retry once.
        if (a.format === 'openai' && !chat.grounded && step === 0 && e.status && e.status >= 400 && e.status < 500 && /tool|function/i.test(e.detail || e.message)) {
          chat.grounded = true; chat.api.length = startLen;
          chat.view.push({role: 'tool', text: 'This model does not support tool calling, so the agent pre-computed the simulator data instead.'});
          chat.api.push({role: 'user', content: userText + groundedContext(t)});
          res = await stepOpenAI(a, chat.api, true);
        } else throw e;
      }
      if (res.stop === 'refusal') { chat.view.push({role: 'error', text: 'The model declined this request. Try rephrasing it as an operations question.'}); break; }
      chat.api.push(res.assistant);
      if (res.texts.length) chat.view.push({role: 'assistant', text: res.texts.join('\n')});
      if (!res.calls.length) { if (res.stop === 'max_tokens') chat.view.push({role: 'error', text: 'The answer was cut off (length limit).'}); break; }
      const results = res.calls.map(c => {
        let r;
        if (c.bad) r = {error: c.bad};
        else { try { r = runTool(t, c.name, c.input); } catch (e) { r = {error: 'Tool failed: ' + e.message}; } }
        if (r.note) chat.view.push({role: 'tool', text: r.note});
        if (r.proposal) chat.view.push({role: 'proposal', text: r.proposal.summary, p: r.proposal.p});
        return {id: c.id, content: r.error ? r.error : JSON.stringify(r.out), isError: !!r.error};
      });
      if (a.format === 'anthropic') chat.api.push(anthropicResults(results)); else chat.api.push(...openaiResults(results));
      refreshAI(t);
      if (step === LLM.maxSteps - 1) chat.view.push({role: 'error', text: 'The agent used its step limit for this question. Ask a narrower follow-up.'});
    }
    if (!chat.view.length || chat.view[chat.view.length - 1].role === 'user') chat.view.push({role: 'error', text: 'The model returned an empty answer. Try again or pick another model.'});
    logActivity(t, `Live agent answered (${a.label} · ${a.model})`);
  } catch (e) {
    if (chat.api.length === startLen + 1) chat.api.length = startLen; // the question never got an answer
    // Model retired or unknown: fetch the provider's current models, switch to a good one, retry once.
    if ((e.status === 404 || e.status === 410) && !retried) {
      try {
        const c = LLM.cfg[LLM.provider]; c.liveModels = await loadModels();
        const next = pickModel(c.liveModels, a.model);
        if (next) {
          chat.view.push({role: 'tool', text: `“${a.model}” is not available on ${a.label}. Switched automatically to “${next}” (one of ${c.liveModels.length} current models) and asked again. You can change it in AI model settings.`});
          c.model = next; saveLLM(); chat.sig = a.id + '|' + next; LLM.modelMsg = null;
          logActivity(t, `Model ${a.model} unavailable; switched to ${next}`);
          retryNext = true;
        } else chat.view.push({role: 'error', text: e.message + ' No other models were found for this key.'});
      } catch (e2) { chat.view.push({role: 'error', text: e.message}); chat.view.push({role: 'tool', text: 'Could not load the model list automatically: ' + e2.message}); LLM.settingsOpen = true; }
    } else chat.view.push({role: 'error', text: e.message});
  } finally { LLM.busy = false; refreshAI(t); }
  if (retryNext) return askLLM(t, question, true);
}

function agentReply(t) {
  const run = lastRun(t.id);
  if (!run) return `Run the simulation first. I can then diagnose your decisions and compare them with tested alternatives. Connect an AI model under *AI model settings* to chat with a live agent.`;
  const a = run.analysis, k = t.kpis.find(k => k.key === t.objective.key), top = a.issues[0];
  const lines = [];
  if (a.isOptimal) lines.push(`Your latest run (${t.describe(run.p)}) is the best of the ${F.int(a.evaluated)} options I tested: **${fmtV(k.fmt, run.r[k.key])}**.`);
  else lines.push(`Try **${t.describe(a.best.p)}**: ${k.label.toLowerCase()} **${fmtV(k.fmt, a.best.r[k.key])}** vs your ${fmtV(k.fmt, run.r[k.key])} (best of ${F.int(a.evaluated)} tested options).`);
  if (top) lines.push('', `Main finding: **${top.title}**. ${top.text}`);
  const l = uniqueLessons(t, a.issues)[0]; if (l) lines.push('', `Lesson: ${l}`);
  lines.push('', 'Connect an AI model under *AI model settings* (Claude, NVIDIA, OpenAI, Groq, Gemini, Ollama…) to ask free-form questions and what-ifs.');
  return lines.join('\n');
}

function mdLite(s) {
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let list = null;
  s.split('\n').forEach(line => {
    const m = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (m) { if (!list) { list = []; out.push(list); } list.push(inline(m[1])); return; }
    list = null;
    if (line.trim()) out.push('<p>' + inline(line.replace(/^#+\s*/, '')) + '</p>');
  });
  return out.map(x => Array.isArray(x) ? '<ul>' + x.map(i => `<li>${i}</li>`).join('') + '</ul>' : x).join('');
}

// Fetch the provider's live model list (GET /models), so model names never go stale.
const NON_CHAT = /embed|rerank|retriev|guard|safety|reward|clip|ocr|parse|asr|tts|speech|whisper|dall-e|image|moderation|audio|transcrib|nv-yolox|paddle|deplot|kosmos|fuyu|neva|vila|cosmos|flux|sdxl|stable-diffusion|bge|e5-|arctic-embed|riva/i;
async function loadModels() {
  const a = activeLLM();
  if (!a.base) throw new Error('Enter the base URL first.');
  const headers = a.format === 'anthropic'
    ? {'x-api-key': a.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'}
    : (a.key ? {authorization: 'Bearer ' + a.key} : {});
  const data = await postJSON(a, endpoint(a, a.format === 'anthropic' ? '/models?limit=100' : '/models'), headers);
  const ids = (data.data || data.models || []).map(m => m.id || m.name).filter(Boolean).map(id => id.replace(/^models\//, ''));
  const chat = ids.filter(id => !NON_CHAT.test(id)).sort();
  return chat.length ? chat : ids.sort();
}

function bindLLMSettings(t, rerender) {
  const set = $('#llmSet'); if (!set) return;
  set.addEventListener('toggle', e => { LLM.settingsOpen = e.target.open; });
  const readForm = () => { const c = LLM.cfg[LLM.provider]; c.model = $('#llmModel').value.trim(); c.key = $('#llmKey').value.trim(); c.base = $('#llmBase').value.trim(); c.proxy = $('#llmProxy').checked; LLM.remember = $('#llmRemember').checked; };
  $('#llmProvider').onchange = e => { readForm(); LLM.provider = e.target.value; LLM.modelMsg = null; LLM.settingsOpen = true; rerender(); };
  $('#llmSave').onclick = () => {
    readForm(); saveLLM();
    logActivity(t, llmLive() ? `AI model connected (${activeLLM().label} · ${activeLLM().model})` : 'AI model settings saved (not connected)');
    LLM.settingsOpen = !llmLive(); rerender();
  };
  $('#llmOllama').onclick = async () => { LLM.ollamaMsg = {text: 'Connecting…'}; LLM.settingsOpen = true; rerender(); LLM.ollamaMsg = await useOllama(); rerender(); if (t && state.view === t.id) renderMain(); };
  $('#llmLoad').onclick = async () => {
    readForm(); const c = LLM.cfg[LLM.provider];
    LLM.modelMsg = {text: 'Loading models…'}; LLM.settingsOpen = true; rerender();
    try {
      c.liveModels = await loadModels();
      LLM.modelMsg = {text: `Loaded ${c.liveModels.length} models. Pick one, then Save. Larger instruct/chat models handle tool calling best.`};
      if (c.liveModels.length && !c.liveModels.includes(c.model)) LLM.modelMsg.text += ` Your current model “${c.model}” is not in the list.`;
    } catch (e) { LLM.modelMsg = {text: e.message, err: true}; }
    rerender();
  };
  const pick = $('#llmPick'); if (pick) pick.onchange = () => { if (pick.value) $('#llmModel').value = pick.value; };
  const fg = $('#llmForget'); if (fg) fg.onclick = () => { LLM.cfg[LLM.provider].key = ''; saveLLM(); logActivity(t, 'API key removed'); rerender(); };
}
function bindChat(t) {
  const input = $('#chatInput'); if (!input) return;
  const log = $('#chatLog'); if (log) log.scrollTop = log.scrollHeight;
  const send = () => { const q = input.value.trim(); if (!q || LLM.busy) return; LLM.drafts[t.id] = ''; askLLM(t, q); };
  input.addEventListener('input', () => { LLM.drafts[t.id] = input.value; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('#chatSend').onclick = send;
  $$('#chatCard .chip').forEach(c => c.onclick = () => { if (!LLM.busy) askLLM(t, c.dataset.q); });
  const clr = $('#chatClear'); if (clr) clr.onclick = () => { LLM.chats[t.id] = {view: [], api: [], sig: null, grounded: false}; renderAI(t); };
  $$('#chatCard [data-apply]').forEach(b => b.onclick = () => {
    const m = getChat(t.id).view[+b.dataset.apply], p = state.inputs[t.id];
    t.params.filter(x => x.role === 'decision').forEach(x => { p[x.id] = JSON.parse(JSON.stringify(m.p[x.id])); });
    logActivity(t, 'Live agent suggestion applied: ' + t.describe(p));
    renderMain(); renderAI(t);
    const rb = $('#runBtn'); if (rb) { rb.focus(); rb.scrollIntoView({block: 'center', behavior: 'smooth'}); }
  });
  bindLLMSettings(t, () => renderAI(t));
}

/* ---------------- 8. Class room (optional; needs tools/opslab-server.mjs) ----------------
   The professor creates a room; students join with the room code and their roll number.
   Each run's inputs are sent to the server, which re-computes the result with the same engine. */
const ROOM = {student: null, prof: null, dash: null, timer: null, msg: {}, health: null, form: {}};
try { ROOM.student = JSON.parse(localStorage.getItem('opslab-room-student') || 'null'); ROOM.prof = JSON.parse(localStorage.getItem('opslab-room-prof') || 'null'); } catch (e) {}
const defaultServer = () => (location.protocol.startsWith('http') ? location.origin : '');
function saveRoom() { try { localStorage.setItem('opslab-room-student', JSON.stringify(ROOM.student)); localStorage.setItem('opslab-room-prof', JSON.stringify(ROOM.prof)); } catch (e) {} }
async function roomApi(server, path, {method = 'GET', body, key} = {}) {
  if (!server) throw new Error('Enter the class-room server address (shown in the professor’s server window).');
  const url = server.trim().replace(/\/+$/, '') + path;
  let res;
  const signal = typeof AbortSignal !== 'undefined' && AbortSignal.timeout ? AbortSignal.timeout(12000) : undefined; // never hang on flaky Wi-Fi
  try { res = await fetch(url, {method, signal, headers: {...(body ? {'content-type': 'application/json'} : {}), ...(key ? {'x-admin-key': key} : {})}, body: body ? JSON.stringify(body) : undefined}); }
  catch (e) { throw new Error(e && e.name === 'TimeoutError' ? `The class-room server at ${server} did not answer within 12 seconds. Check the Wi-Fi and try again.` : `Cannot reach the class-room server at ${server}. Check the address, and that this device is on the same network as the professor’s laptop.`); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || `Server error ${res.status}`); err.status = res.status; throw err; }
  return data;
}
const normServer = v => { v = String(v || '').trim(); if (v && !/^https?:\/\//i.test(v)) v = 'http://' + v; return v.replace(/\/+$/, ''); };

// ---- student: submit runs ----
async function submitRun(t, run) {
  const s = ROOM.student; if (!s) return;
  run.sync = 'pending'; updateSyncCell(t, run);
  try {
    const out = await roomApi(s.server, `/api/rooms/${s.code}/runs`, {method: 'POST', body: {roll: s.roll, token: s.token, topic: t.id, p: run.p, n: run.n, round: run.round && !run.round.custom ? {period: run.round.period, k: run.round.k} : undefined}});
    run.sync = out.recorded && !out.recorded.fair ? 'custom' : 'ok';
    s.standing = {rank: out.rank, of: out.of, score: out.score, perTopic: out.perTopic};
    await flushPending();
  } catch (e) {
    run.sync = 'fail'; run.syncErr = e.message;
    if (!e.status || e.status >= 500) { s.pending = s.pending || []; s.pending.push({topic: t.id, p: run.p, n: run.n, round: run.round && !run.round.custom ? {period: run.round.period, k: run.round.k} : undefined}); }
    if (e.status === 401) s.needsRejoin = true;
  }
  saveRoom(); updateSyncCell(t, run); renderRoomPill();
  if (state.view === 'room') renderMain();
}
async function flushPending() {
  const s = ROOM.student; if (!s || !s.pending || !s.pending.length) return 0;
  let sent = 0;
  while (s.pending.length) {
    const it = s.pending[0];
    try { const out = await roomApi(s.server, `/api/rooms/${s.code}/runs`, {method: 'POST', body: {roll: s.roll, token: s.token, ...it}}); s.standing = {rank: out.rank, of: out.of, score: out.score, perTopic: out.perTopic}; s.pending.shift(); sent++; }
    catch (e) { if (e.status && e.status < 500) s.pending.shift(); else break; }
  }
  saveRoom(); return sent;
}
function syncBadge(run) {
  if (!run.sync) return '<span class="flat" title="Not sent: you were not in a class room for this run">–</span>';
  if (run.sync === 'ok') return '<span class="up" title="Recorded in the class room">✓ sent</span>';
  if (run.sync === 'custom') return '<span class="flat" title="Recorded, but the scenario was changed, so it does not count for the class leaderboard">✓ practice</span>';
  if (run.sync === 'pending') return '<span class="flat">sending…</span>';
  return `<span class="down" title="${esc(run.syncErr || '')}">✗ not sent</span>`;
}
function updateSyncCell(t, run) { const el = document.getElementById(`sync-${t.id}-${run.n}`); if (el) el.innerHTML = syncBadge(run); }
function renderRoomPill() {
  const el = $('#roomPill'); if (!el) return;
  const s = ROOM.student;
  if (!s) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent = `Class ${s.code} · ${s.roll}${s.standing ? ` · rank ${s.standing.rank}/${s.standing.of}` : ''}${s.pending && s.pending.length ? ` · ${s.pending.length} unsent` : ''}`;
}

// ---- professor: dashboard ----

function startDashTimer() { stopDashTimer(); ROOM.timer = setInterval(() => { if (state.view === 'room' && ROOM.prof && !document.hidden) loadDashboard(); }, 10000); }
function stopDashTimer() { if (ROOM.timer) clearInterval(ROOM.timer); ROOM.timer = null; }
const ago = ms => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`; };
const effCell = v => v === null || v === undefined ? '<span class="flat">–</span>' : `<span class="${v >= 0.999 ? 'up' : v < 0.6 ? 'down' : ''}">${(v * 100).toFixed(0)}%</span>`;
function dashHTML() {

  const kp = (l, v) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`;

// Repairs the JSON slips small models make: missing or trailing commas, unescaped quotes or line breaks
// inside strings, comments, smart quotes, Python literals, and output cut off before the closing brackets.
function repairJSON(src) {
  let out = '', inStr = false, prev = '', gap = false;
  const stack = [];
  const valEnd = c => c === '"' || c === '}' || c === ']' || /[0-9a-zA-Z.]/.test(c);
  for (let i = 0; i < src.length; i++) {
    let c = src[i];
    if (inStr) {
      if (c === '\\') { out += c + (src[i + 1] ?? ''); i++; continue; }
      if (c === '\n') { out += '\\n'; continue; }
      if (c === '\r') continue;
      if (c === '\t') { out += '\\t'; continue; }
      if (c === '"' || c === '”') {
        let j = i + 1; while (j < src.length && /\s/.test(src[j])) j++;
        const nx = src[j];
        if (nx === undefined || ',:}]'.includes(nx) || (nx === '"' && j > i + 1)) { inStr = false; out += '"'; prev = '"'; gap = false; continue; }
        out += '\\"'; continue;
      }
      out += c; continue;
    }
    if (c === '/' && src[i + 1] === '/') { while (i < src.length && src[i] !== '\n') i++; gap = true; continue; }
    if (c === '/' && src[i + 1] === '*') { const e = src.indexOf('*/', i + 2); if (e < 0) break; i = e + 1; gap = true; continue; }
    if (/\s/.test(c)) { out += c; gap = true; continue; }
    if (c === '“' || c === '”') c = '"';
    for (const [py, js] of [['True', 'true'], ['False', 'false'], ['None', 'null']]) if (src.startsWith(py, i) && !/[A-Za-z0-9_]/.test(src[i + py.length] || '')) { c = js; i += py.length - 1; break; }
    const valStart = c[0] === '"' || c[0] === '{' || c[0] === '[' || /[-0-9tfn]/.test(c[0]);
    if (valStart && prev && (('"}]'.includes(prev)) || (gap && /[0-9a-zA-Z.]/.test(prev))) && valEnd(prev)) out = out.replace(/\s*$/, m => ',' + m);
    if (c === '}' || c === ']') { out = out.replace(/,(\s*)$/, '$1'); stack.pop(); }
    if (c === '{' || c === '[') stack.push(c === '{' ? '}' : ']');
    if (c === '"') inStr = true;
    out += c; prev = c[c.length - 1]; gap = false;
  }
  if (inStr) out += '"';
  out = out.replace(/,(\s*)$/, '$1').replace(/:\s*$/, ': null');
  while (stack.length) out += stack.pop();
  return out;
}
// Extracts the first JSON object from a model reply and parses it, repairing it if needed.
function parseJSONLoose(txt) {

  const i = s.indexOf('{');
  if (i < 0) throw new Error('no JSON object found');
  const j = s.lastIndexOf('}');
  if (j > i) { try { return JSON.parse(s.slice(i, j + 1)); } catch (e) {} }
  const fixed = repairJSON(s.slice(i));
  // keep only the first complete object (models sometimes add notes after it)
  let depth = 0, inStr = false, end = fixed.length;
  for (let k = 0; k < fixed.length; k++) {
    const c = fixed[k];
    if (inStr) { if (c === '\\') k++; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true; else if (c === '{' || c === '[') depth++; else if (c === '}' || c === ']') { depth--; if (depth === 0) { end = k + 1; break; } }
  }
  const first = fixed.slice(0, end);
  try { return JSON.parse(first); } catch (err) {
    // Output was probably cut off: drop the last incomplete item and close the brackets again.
    let cut = s.slice(i);

      if (pos < 0) break;

      try { return JSON.parse(repairJSON(cut)); } catch (e) {}
    }
    throw err;
  }
}
// Validate a proposed set of scenario changes: unknown ids and decision inputs are dropped, numbers fitted to range.
function validScenario(t, changes) {
  const clean = {}, notes = [];
  Object.entries(changes && typeof changes === 'object' ? changes : {}).forEach(([id, v]) => {
    const x = t.params.find(q => q.id === id);
    if (!x) { notes.push(`ignored unknown input "${id}"`); return; }
    if (x.role !== 'scenario') { notes.push(`ignored decision input "${id}"`); return; }
    clean[id] = v;
  });
  const {p, errors} = applyChanges(t, defaults(t), clean, 'scenario');
  errors.forEach(e => notes.push(e.replace(/^Note: /, '')));

  return {scen, notes};
}

    if (x.type === 'select') return `${x.id}: ${x.label}. One of ${x.options.map(o => o[0]).join(', ')}. Default ${x.def}`;
    if (x.type === 'checkbox') return `${x.id}: ${x.label}. true or false. Default ${x.def}`;
    return `${x.id}: ${x.label}${u}. ${x.min} to ${x.max}, step ${x.step}. Default ${x.def}`;

}
async function askScenarioAgent(t, task, extra, check) {

  const sel = $('#studySlide'); if (sel) sel.onchange = () => { STUDY.slide = +sel.value; renderMain(); };
  on('studyVisual', () => run('studyVisual', async () => { const s = d.slides[STUDY.slide]; d.visual[s.n] = await aiVisual(d, s); }));
  const range = () => { const n = +$('#quizN').value; let a = clamp(Math.round(+$('#quizFrom').value) || 1, 1, d.slides.length), b = clamp(Math.round(+$('#quizTo').value) || d.slides.length, 1, d.slides.length); if (b < a) [a, b] = [b, a]; return [n, a, b]; };
  on('studyAIQuiz', () => run('studyAIQuiz', async () => { const [n, a, b] = range(); const items = await aiQuiz(d, n, a, b); d.quiz = {items, picks: [], checked: false, source: `AI quiz by ${activeLLM().label} · ${activeLLM().model}`}; }));
  on('studyRuleQuiz', () => { const [n, a, b] = range(); const items = ruleQuiz(d, n, a, b); if (!items.length) { STUDY.msg = {err: true, text: 'Not enough text in these slides for a quick quiz. Widen the slide range or use the AI quiz.'}; return render(); } d.quiz = {items, picks: [], checked: false, source: 'Quick quiz: fill in the key term'}; STUDY.msg = null; renderMain(); });
  $$('.quiz input[type=radio]').forEach(r => r.onchange = () => { d.quiz.picks[+r.name.slice(1)] = +r.value; });
  on('quizCheck', () => { const q = d.quiz; q.checked = true; const pct = Math.round(q.items.filter((x, i) => q.picks[i] === x.answer).length / q.items.length * 100); d.bestQuiz = Math.max(d.bestQuiz || 0, pct); logActivity({short: 'Study'}, `Quiz on ${d.name}: ${pct}%`); renderMain(); });
  on('quizRetry', () => { const q = d.quiz, wrong = q.items.filter((x, i) => q.picks[i] !== x.answer); d.quiz = {items: wrong.length ? wrong : q.items, picks: [], checked: false, source: q.source + ' · retry'}; renderMain(); });
  const qa = $('#studyQ'); if (qa) { qa.addEventListener('input', () => { STUDY.qDraft = qa.value; }); qa.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#studyAsk').click(); } }); }
  on('studyAsk', () => { const q = (STUDY.qDraft || '').trim(); if (!q) return; STUDY.qDraft = ''; run('studyAsk', async () => {
    const top = relevantSlides(d, q, 4);
    if (llmLive()) { const md = await llmText(HELP_SYSTEM, `QUESTION: ${q}\n\nMOST RELEVANT SLIDES from "${d.name}":\n${deckContext(top.map(x => x.s), 5000) || '(no matching slides)'}`); d.help.push({q, ai: true, html: mdBlock(md, d)}); }
    else d.help.push({q, ai: false, html: top.length ? top.map(x => { const qs = new Set(words(q)); const best = [...x.s.paras, x.s.notes].filter(Boolean).sort((a, b) => words(b).filter(w => qs.has(w)).length - words(a).filter(w => qs.has(w)).length).slice(0, 2); return `<p><span class="chg">Slide ${x.s.n}</span> <b>${esc(x.s.title)}</b></p>${best.length ? `<ul>${best.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}`; }).join('') : '<p>No slide matches these words. Try different keywords, or connect an AI model for a general explanation.</p>'});
    logActivity({short: 'Study'}, 'Question asked about ' + d.name); }); });
}
function renderStudySide() {
  const live = llmLive(), a = activeLLM(), d = studyDeck();
  $('#side').innerHTML = `<div class="card" id="chatCard"><div class="ai-head"><div class="ai-badge">AI</div><div><h3>Study assistant</h3><p><span class="status-dot" style="background:${live ? 'var(--good)' : 'var(--faint)'}"></span>${live ? `${esc(a.label)} · ${esc(a.model)}` : 'Study tools ready · connect an AI model for richer help'}</p></div></div>
    ${d ? `<div class="ai-section"><h4>${esc(d.name)}</h4><div class="small">${d.slides.length} slides · ${d.slides.reduce((n, s) => n + s.images.length, 0)} images · ${d.terms.length} key terms${d.bestQuiz !== null ? ` · best quiz ${d.bestQuiz}%` : ''}</div>${d.terms.length ? `<div style="margin-top:6px">${d.terms.slice(0, 10).map(t => `<span class="chg">${esc(t.term)}</span>`).join('')}</div>` : ''}</div>` : ''}
    <div class="ai-section"><h4>Suggested routine</h4><ol class="small" style="padding-left:18px;margin:0"><li>Read the notes (download them for revision)</li><li>Step through the slides with visual explanations</li><li>Take a quiz and retry the ones you missed</li><li>Ask about anything unclear</li><li>Practise the concept in the linked simulation</li></ol></div>
    <p class="small muted" style="margin:8px 0 0">${live ? 'Slide text is sent to this provider only when you press an AI button.' : 'Connect an AI model below for explained notes, diagrams, AI quizzes and answers. Ollama is free and keeps your slides on your computer.'}</p>
    ${llmSettingsHTML()}</div>` + activityCard();
  bindLLMSettings(null, () => { renderStudySide(); if (state.view === 'study') { renderMain(); bindStudy(); } });
}

/* ---------------- boot ---------------- */
$('#resetAllBtn').onclick = () => { resetState(); state.errors = {}; logActivity(null, 'Session reset'); render(); };
$('#themeBtn').onclick = () => {
  const root = document.documentElement, cur = root.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem('opslab-theme', dark ? 'light' : 'dark'); } catch (e) {}
};
try { const th = localStorage.getItem('opslab-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
// shared tooltip for charts
(() => {
  const tip = $('#tip');
  document.addEventListener('mousemove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { tip.style.opacity = 0; return; }
    tip.textContent = el.getAttribute('data-tip'); tip.style.opacity = 1;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 14) + 'px';
    tip.style.top = Math.max(8, e.clientY - h - 10) + 'px';
  });
})();
$('#roomPill').onclick = () => { state.view = 'room'; render(); };
renderRoomPill();
render();
// Exposed for automated testing
window.OpsLab = {TOPICS, TOPIC, Agent, state, defaults, render, LLM, runTool, PROVIDERS, ROOM, SCEN};
</script>
</body>
