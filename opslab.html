/* ===== 3. Production Scheduling ===== */
{
  id: 'scheduling', num: 3, name: 'Production Scheduling', short: 'Scheduling',
  role: 'Six jobs are waiting at a single bottleneck machine. Pick the sequencing rule, or type your own sequence. Every day a job finishes after its due date incurs a late penalty.',
  concept: `<p>On a single machine every sequence has the same makespan. What changes is <b>when each job finishes</b>, and so its flow time and lateness. Simple <b>dispatching rules</b> give good sequences fast:</p>
  <ul class="clean"><li><b>FCFS</b>: first come, first served. Fair, but ignores time and urgency.</li><li><b>SPT</b>: shortest processing time first. Minimizes average flow time and WIP.</li><li><b>EDD</b>: earliest due date first. Minimizes maximum lateness.</li><li><b>CR</b>: critical ratio (due ÷ processing time), lowest first.</li><li><b>Slack</b>: (due − processing time), lowest first.</li></ul>`,
  formulas: [
    ['Completion time', 'Cⱼ = Σ processing times up to and including job j'],
    ['Flow time', 'Fⱼ = Cⱼ − release (all released at t = 0)'],
    ['Tardiness', 'Tⱼ = max(0, Cⱼ − dueⱼ)'],
    ['Avg. jobs in system', 'Σ Fⱼ ÷ makespan'],
    ['Late penalty', 'Σ Tⱼ × penalty per day']
  ],
  params: [
    {id: 'rule', label: 'Sequencing rule', role: 'decision', type: 'select', def: 'FCFS', options: [['FCFS', 'FCFS: first come, first served'], ['SPT', 'SPT: shortest processing time'], ['EDD', 'EDD: earliest due date'], ['CR', 'CR: critical ratio'], ['SLACK', 'Slack: least slack first'], ['LPT', 'LPT: longest processing time'], ['CUSTOM', 'Custom sequence…']]},
    {id: 'custom', label: 'Custom sequence', role: 'decision', type: 'text', def: 'A,B,C,D,E,F', help: 'Used only when the rule is "Custom". Example: B,D,A,F,E,C', showIf: p => p.rule === 'CUSTOM'},
    {id: 'jobs', label: 'Jobs (processing days, due day)', role: 'scenario', type: 'jobs', def: [
      {id: 'A', p: 8, d: 12}, {id: 'B', p: 3, d: 6}, {id: 'C', p: 10, d: 30}, {id: 'D', p: 4, d: 10}, {id: 'E', p: 6, d: 26}, {id: 'F', p: 2, d: 14}]},
    {id: 'pen', label: 'Late penalty', unit: '$/job-day', role: 'scenario', min: 50, max: 2000, step: 50, def: 500}
  ],
  objective: {key: 'penalty', dir: 'min', tie: 'avgFlow'},
  kpis: [
    {key: 'penalty', label: 'Late penalty', fmt: 'money', better: 'low', primary: true},
    {key: 'totalTard', label: 'Total tardiness (days)', fmt: 'int', better: 'low'},
    {key: 'late', label: 'Late jobs', fmt: 'int', better: 'low'},
    {key: 'maxTard', label: 'Max tardiness (days)', fmt: 'int', better: 'low'},
    {key: 'avgFlow', label: 'Avg flow time (days)', fmt: 'n1', better: 'low'},
    {key: 'wip', label: 'Avg jobs in system', fmt: 'n2', better: 'low'},
    {key: 'makespan', label: 'Makespan (days)', fmt: 'int', better: null},
    {key: 'seqText', label: 'Sequence', fmt: 'text'}
  ],
  order(p) {
    const J = p.jobs.slice();
    const by = f => J.slice().sort((a, b) => f(a) - f(b) || a.id.localeCompare(b.id));
    switch (p.rule) {
      case 'SPT': return by(j => j.p);
      case 'LPT': return by(j => -j.p);
      case 'EDD': return by(j => j.d);
      case 'CR': return by(j => j.d / j.p);
      case 'SLACK': return by(j => j.d - j.p);
      case 'CUSTOM': { const ids = String(p.custom).toUpperCase().split(/[\s,;>-]+/).filter(Boolean); return ids.map(id => J.find(j => j.id === id)); }
      case 'SEQ': return p.seq.map(id => J.find(j => j.id === id));
      default: return J;
    }
  },
  validate(p) {
    if (p.rule !== 'CUSTOM') return null;
    const ids = String(p.custom).toUpperCase().split(/[\s,;>-]+/).filter(Boolean);
    const all = p.jobs.map(j => j.id);
    if (ids.length !== all.length || new Set(ids).size !== ids.length || ids.some(i => !all.includes(i)))
      return `Custom sequence must list each job exactly once (${all.join(', ')}).`;
    return null;
  },
  simulate(p) {
    const seq = this.order(p); let t = 0;
    const rows = seq.map(j => { const start = t; t += j.p; const tard = Math.max(0, t - j.d); return {id: j.id, p: j.p, d: j.d, start, end: t, tard, late: tard > 0}; });
    const flows = rows.map(r => r.end), makespan = t;
    const totalTard = sum(rows.map(r => r.tard));
    return {rows, makespan, totalTard, late: rows.filter(r => r.late).length, maxTard: Math.max(0, ...rows.map(r => r.tard)),
      avgFlow: sum(flows) / rows.length, wip: sum(flows) / (makespan || 1), penalty: totalTard * p.pen, seqText: rows.map(r => r.id).join('→')};
  },
  alternatives(p) {
    const rules = [['SPT', 'Minimizes average flow time'], ['EDD', 'Minimizes maximum lateness'], ['CR', 'Balances urgency and size'], ['SLACK', 'Least slack first'], ['FCFS', 'Arrival order']];
    const out = rules.map(([r, why]) => ({name: 'Rule: ' + r, why, p: {...p, rule: r}}));
    // Moore–Hodgson: minimizes number of late jobs
    const edd = this.order({...p, rule: 'EDD'}).slice(); let kept = [], t = 0; const rejected = [];
    for (const j of edd) { kept.push(j); t += j.p; if (t > j.d) { const big = kept.reduce((a, b) => (b.p > a.p ? b : a)); kept = kept.filter(x => x !== big); t -= big.p; rejected.push(big); } }
    out.push({name: 'Moore–Hodgson', why: 'Minimizes the number of late jobs', p: {...p, rule: 'SEQ', seq: [...kept, ...rejected].map(j => j.id)}});
    return out;
  },
  search(p) {
    const ids = p.jobs.map(j => j.id); let best = null, n = 0;
    const perm = (arr, cur) => {
      if (!arr.length) { n++; const q = {...p, rule: 'SEQ', seq: cur.slice()}; const r = this.simulate(q);
        if (!best || r.penalty < best.r.penalty - 1e-9 || (Math.abs(r.penalty - best.r.penalty) < 1e-9 && r.avgFlow < best.r.avgFlow - 1e-9)) best = {p: q, r}; return; }
      for (let i = 0; i < arr.length; i++) { cur.push(arr[i]); perm(arr.slice(0, i).concat(arr.slice(i + 1)), cur); cur.pop(); }
    };
    perm(ids, []);
    return {name: 'Optimizer: exhaustive search', why: `All ${n} possible sequences evaluated`, p: best.p, n};
  },
  describe(p) { return p.rule === 'SEQ' ? 'Sequence ' + p.seq.join('→') : p.rule === 'CUSTOM' ? 'Custom ' + String(p.custom).toUpperCase().replace(/\s/g, '') : 'Rule ' + p.rule; },
  decisionKey(p) { return this.order(p).map(j => j.id).join(''); },
  diagnose(p, r) {
    const out = [];
    if (r.late) {
      const worst = r.rows.reduce((a, b) => (b.tard > a.tard ? b : a));
      out.push({sev: 'high', code: 'late', title: `${r.late} of ${r.rows.length} jobs are late`, text: `Total tardiness ${r.totalTard} days (${F.money(r.penalty)}). Worst: job ${worst.id}, due day ${worst.d}, finishes day ${worst.end} (${worst.tard} days late).`});
    } else out.push({sev: 'ok', code: 'ontime', title: 'All jobs on time', text: 'No late penalties.'});
    if (p.rule === 'FCFS') out.push({sev: 'med', code: 'fcfs', title: 'FCFS ignores due dates and job size', text: 'Arrival order is rarely a good sequence for a bottleneck machine.'});
    if (p.rule === 'LPT') out.push({sev: 'med', code: 'lpt', title: 'LPT front-loads long jobs', text: 'Long jobs first push every short job back, which raises flow time and WIP.'});
    const spt = this.simulate({...p, rule: 'SPT'});
    if (r.avgFlow > spt.avgFlow + 0.05) out.push({sev: 'med', code: 'flow', title: 'Flow time can be lower', text: `SPT would give an average flow time of ${F.n1(spt.avgFlow)} days vs your ${F.n1(r.avgFlow)} (fewer jobs waiting = less WIP).`});
    // a long job scheduled before an urgent short one
    for (let i = 0; i < r.rows.length - 1; i++) {
      const a = r.rows[i], b = r.rows[i + 1];
      if (a.p > b.p && a.d > b.d && b.late) { out.push({sev: 'med', code: 'swap', title: `Job ${a.id} blocks urgent job ${b.id}`, text: `${a.id} is longer and due later, yet runs first. Swapping them helps ${b.id} without hurting ${a.id}'s due date as much.`}); break; }
    }
    return out;
  },
  lessons: {
    late: 'Tardiness is a sequencing problem, not a capacity problem, when total work fits before the latest due dates.',
    fcfs: 'FCFS feels fair but is almost never optimal at a bottleneck. Use rules that look at due dates and processing times.',
    lpt: 'Doing big jobs first maximizes WIP. SPT minimizes average flow time and the number of jobs waiting.',
    flow: 'SPT minimizes average flow time (and WIP, by Little\'s Law) but can leave a long job very late.',
    swap: 'An adjacent-pair swap test (is the earlier job longer and due later?) quickly finds improvements.',
    ontime: 'When every job is on time, compare rules on flow time and WIP next.'
  },
  explain(p, r, b) {
    return `The recommended sequence is <b>${b.r.seqText}</b>, with ${b.r.late} late job(s) and ${b.r.totalTard} days of total tardiness, against your ${r.late} late job(s) and ${r.totalTard} days. Makespan is ${r.makespan} days in every sequence: sequencing moves lateness between jobs, it does not create capacity.`;
  },
  chart(r, b) {
    return legend([['On time', 'var(--you)'], ['Late', 'var(--bad)']]).replace('</div>', '<span>▲ Due date</span></div>') +
      gantt([{label: 'Your sequence', rows: r.rows}, {label: 'AI sequence', rows: b.rows}]);
  },
  chartTitle: 'Gantt chart: when each job runs (marker = due date)'
},

/* ===== 4. Quality Management ===== */
{
  id: 'quality', num: 4, name: 'Quality Management', short: 'Quality',
  role: 'You are the plant quality manager for a 5,000-unit batch. Decide how much to spend on prevention (training, poka-yoke, better fixtures) and what share of output to inspect. Defects that escape reach customers as warranty claims.',
  concept: `<p>The <b>Cost of Quality</b> (COQ) has four buckets: <b>prevention</b> (stop defects from being made), <b>appraisal</b> (inspection), <b>internal failure</b> (rework and scrap of defects caught), and <b>external failure</b> (defects that reach customers). Inspection only <i>sorts</i> defects. Prevention <i>removes</i> them, with diminishing returns down to a process floor.</p>
  <p>Model: each $1,000 of prevention removes about 63% of the defects above the floor (exponential decay). Inspection finds a fixed share of the defects it examines.</p>`,
  formulas: [
    ['Effective defect rate', 'p = p_min + (p₀ − p_min) · e^(−Prevention / 1000)'],
    ['Defects made', 'D = N × p'],
    ['Defects caught', 'D × coverage × detection rate'],
    ['Escaped defects', 'D − caught'],
    ['Rework → good / scrap', 'caught × success  /  caught × (1 − success)'],
    ['COQ', 'prevention + N·coverage·c_insp + caught·c_rework + scrap·c_scrap + escaped·c_external'],
    ['Sigma level', 'z(1 − DPMO/10⁶) + 1.5']
  ],
  params: [
    {id: 'cov', label: 'Inspection coverage', unit: '% of units', role: 'decision', min: 0, max: 100, step: 5, def: 100},
    {id: 'prev', label: 'Prevention spend', unit: '$ per batch', role: 'decision', min: 0, max: 8000, step: 250, def: 0},
    {id: 'N', label: 'Batch size', unit: 'units', role: 'scenario', min: 500, max: 20000, step: 500, def: 5000},
    {id: 'p0', label: 'Base defect rate', unit: '%', role: 'scenario', min: 0.5, max: 20, step: 0.5, def: 6},
    {id: 'pmin', label: 'Best achievable defect rate', unit: '%', role: 'scenario', min: 0, max: 5, step: 0.1, def: 0.5, help: 'Process floor that prevention cannot go below. Matters once prevention > $0.'},
    {id: 'det', label: 'Inspection detection rate', unit: '%', role: 'scenario', min: 50, max: 100, step: 1, def: 90},
    {id: 'ci', label: 'Inspection cost', unit: '$/unit', role: 'scenario', min: 0.1, max: 5, step: 0.1, def: 1},
    {id: 'cr', label: 'Rework cost', unit: '$/defect', role: 'scenario', min: 0, max: 30, step: 1, def: 4},
    {id: 'rs', label: 'Rework success rate', unit: '%', role: 'scenario', min: 0, max: 100, step: 5, def: 80},
    {id: 'cs', label: 'Scrap cost', unit: '$/unit', role: 'scenario', min: 0, max: 50, step: 1, def: 10},
    {id: 'ce', label: 'External failure cost', unit: '$/escaped defect', role: 'scenario', min: 10, max: 500, step: 10, def: 120}
  ],
  objective: {key: 'coq', dir: 'min'},
  kpis: [
    {key: 'coq', label: 'Cost of quality', fmt: 'money', better: 'low', primary: true},
    {key: 'escaped', label: 'Defects shipped', fmt: 'n1', better: 'low'},
    {key: 'dpmo', label: 'DPMO shipped', fmt: 'int', better: 'low'},
    {key: 'sigma', label: 'Sigma level (shipped)', fmt: 'n2', better: 'high'},
    {key: 'fpy', label: 'First-pass yield', fmt: 'pct', better: 'high'},
    {key: 'finalYield', label: 'Good units shipped', fmt: 'pct', better: 'high'},
    {key: 'external', label: 'External failure cost', fmt: 'money', better: 'low'},
    {key: 'perUnit', label: 'COQ per unit', fmt: 'money2', better: 'low'}
  ],
  simulate(p) {
    const p0 = p.p0 / 100, pmin = Math.min(p.pmin / 100, p0);
    const rate = pmin + (p0 - pmin) * Math.exp(-p.prev / 1000);
    const D = p.N * rate, cov = p.cov / 100;
    const caught = D * cov * (p.det / 100), escaped = D - caught;
    const reworked = caught * (p.rs / 100), scrap = caught - reworked;
    const prevention = p.prev, appraisal = p.N * cov * p.ci, internal = caught * p.cr + scrap * p.cs, external = escaped * p.ce;
    const coq = prevention + appraisal + internal + external;
    const shipped = p.N - scrap;
    const dpmo = shipped > 0 ? escaped / shipped * 1e6 : 0;
    const sigma = dpmo <= 0.0034 ? 6 + 1.5 : normInv(1 - dpmo / 1e6) + 1.5;
    return {rate, defects: D, caught, escaped, reworked, scrap, prevention, appraisal, internal, external, coq, dpmo,
      sigma: Math.min(sigma, 7.5), fpy: 1 - rate, finalYield: (p.N - D + reworked) / p.N, perUnit: coq / p.N};
  },
  alternatives(p) {
    return [
      {name: 'No inspection, no prevention', why: 'Ship everything as made', p: {...p, cov: 0, prev: 0}},
      {name: '100% inspection only', why: 'Sort quality in at the end of the line', p: {...p, cov: 100, prev: 0}},
      {name: 'Prevention $2,000 + 50% inspection', why: 'Balanced prevention and appraisal', p: {...p, cov: 50, prev: 2000}},
      {name: 'Prevention-led ($4,000, no inspection)', why: 'Build quality in at the source', p: {...p, cov: 0, prev: 4000}}
    ];
  },
  search(p) {
    let best = null, n = 0;
    for (let cov = 0; cov <= 100; cov += 5) for (let prev = 0; prev <= 8000; prev += 250) {
      n++; const q = {...p, cov, prev}; const r = this.simulate(q);
      if (!best || r.coq < best.r.coq - 1e-9) best = {p: q, r};
    }
    return {name: 'Optimizer: COQ grid search', why: `${n} combinations of coverage (0–100%) and prevention ($0–8,000) evaluated`, p: best.p, n};
  },
  describe: p => `Inspect ${p.cov}%, prevention ${F.money(p.prev)}`,
  diagnose(p, r) {
    const out = [], ext = r.external / (r.coq || 1);
    if (ext > 0.4) out.push({sev: 'high', code: 'escape', title: 'Defects are reaching customers', text: `${F.n1(r.escaped)} defects ship, at ${F.money(p.ce)} each: ${F.pct(ext)} of your COQ is external failure.`});
    if (p.prev === 0) out.push({sev: 'med', code: 'noprev', title: 'No investment in prevention', text: `The process makes ${F.n1(r.defects)} defects (${F.pct(r.rate)}). Inspection can only sort them, at ${F.money(p.ci)} for every unit checked.`});
    const costPerCatch = r.caught ? r.appraisal / r.caught : Infinity;
    if (p.cov > 0 && costPerCatch > p.ce) out.push({sev: 'med', code: 'overinspect', title: 'Inspection costs more than it saves', text: `Each defect caught costs ${F.money(costPerCatch)} of inspection, more than the ${F.money(p.ce)} it would cost to let it escape.`});
    else if (p.cov >= 80 && r.appraisal > 0.35 * r.coq) out.push({sev: 'med', code: 'appraisal', title: 'Appraisal-heavy quality system', text: `Inspection is ${F.pct(r.appraisal / r.coq)} of COQ. Reducing defects at the source would cut both appraisal and failure costs.`});
    if (p.prev > 0 && r.rate - p.pmin / 100 < 0.0005 && p.prev > 3000) out.push({sev: 'med', code: 'overprev', title: 'Prevention near its limit', text: `The defect rate is already close to the process floor (${p.pmin}%). Extra prevention spend buys very little.`});
    if (!out.length) out.push({sev: 'ok', code: 'goodcoq', title: 'Balanced cost of quality', text: 'Prevention, appraisal and failure costs are in reasonable proportion.'});
    return out;
  },
  lessons: {
    escape: 'External failures are the most expensive defects: warranty, returns and lost reputation. Catch or prevent them early.',
    noprev: '“Quality is free” (Crosby): money spent on prevention usually returns several times over in lower failure costs.',
    overinspect: 'Inspection pays only when the defect rate × failure cost is greater than the cost per unit inspected.',
    appraisal: 'You cannot inspect quality into a product. Inspection sorts defects; prevention removes them.',
    overprev: 'Prevention has diminishing returns. Stop when the next $1 of prevention saves less than $1 of failure cost.',
    goodcoq: 'The optimal COQ mix depends on how cheap prevention is relative to failure costs.'
  },
  explain(p, r, b) {
    return `The recommended mix is <b>${this.describe(b.p)}</b>. It cuts the defect rate from ${F.pct(r.rate)} to ${F.pct(b.r.rate)} and shipped defects from ${F.n1(r.escaped)} to ${F.n1(b.r.escaped)}. It shifts spending between the COQ buckets: prevention ${F.money(r.prevention)} → ${F.money(b.r.prevention)}, appraisal ${F.money(r.appraisal)} → ${F.money(b.r.appraisal)}, failure ${F.money(r.internal + r.external)} → ${F.money(b.r.internal + b.r.external)}.`;
  },
  chart(r, b) {
    const stacks = [['Prevention', 'var(--s3)', 'prevention'], ['Appraisal', 'var(--you)', 'appraisal'], ['Internal failure', 'var(--s4)', 'internal'], ['External failure', 'var(--ai)', 'external']];
    return legend(stacks.map(s => [s[0], s[1]])) + stackedBars({categories: ['You', 'AI recommendation'], stacks: stacks.map(s => ({name: s[0], color: s[1], values: [r[s[2]], b[s[2]]]}))});
  },
  chartTitle: 'Cost of quality breakdown'
},

/* ===== 5. Queue Management ===== */
{
  id: 'queue', num: 5, name: 'Queue Management', short: 'Queues',
  role: 'You staff the customer service desk. Customers arrive at random, and service times vary. Choose the number of servers. Each server costs wages, and each hour a customer waits costs goodwill. The service-level target must be met.',
  concept: `<p>With random arrivals and service, queues form even when capacity is above average demand. Waiting time grows <b>non-linearly</b> as utilization approaches 100%. This desk is an <b>M/M/c</b> queue (Poisson arrivals, exponential service, c servers), solved exactly with the <b>Erlang C</b> formula.</p>
  <p>The manager trades staffing cost against waiting cost, subject to a service-level target (e.g. 80% of customers wait less than 2 minutes).</p>`,
  formulas: [
    ['Service rate', 'μ = 60 ÷ service time (per hour)'],
    ['Utilization', 'ρ = λ ÷ (c · μ)   (must be < 1)'],
    ['Prob. of waiting (Erlang C)', 'P_w = [aᶜ/c! · 1/(1−ρ)] ÷ [Σₖ₌₀^{c−1} aᵏ/k! + aᶜ/c! · 1/(1−ρ)],  a = λ/μ'],
    ['Avg. queue length', 'L_q = P_w · ρ ÷ (1 − ρ)'],
    ["Avg. wait (Little's Law)", 'W_q = L_q ÷ λ'],
    ['Service level', 'P(wait ≤ T) = 1 − P_w · e^(−(cμ − λ)·T)'],
    ['Total cost / hour', 'c · wage + L_q · waiting cost']
  ],
  params: [
    {id: 'c', label: 'Number of servers', role: 'decision', min: 1, max: 15, step: 1, def: 4},
    {id: 'lam', label: 'Arrival rate λ', unit: 'customers/hour', role: 'scenario', min: 5, max: 200, step: 1, def: 50},
    {id: 'svc', label: 'Average service time', unit: 'min', role: 'scenario', min: 0.5, max: 30, step: 0.5, def: 4},
    {id: 'wage', label: 'Server cost', unit: '$/hour', role: 'scenario', min: 5, max: 150, step: 1, def: 30},
    {id: 'wcost', label: 'Waiting cost', unit: '$/customer-hour', role: 'scenario', min: 0, max: 200, step: 5, def: 40},
    {id: 'T', label: 'Target wait', unit: 'min', role: 'scenario', min: 0.5, max: 30, step: 0.5, def: 2},
    {id: 'SLt', label: 'Service-level target', unit: '% within target wait', role: 'scenario', min: 50, max: 99, step: 1, def: 80, help: 'The agent only recommends staffing that meets this target.'}
  ],
  objective: {key: 'cost', dir: 'min'},
  feasible: (r, p) => r.stable && r.SL >= p.SLt / 100 - 1e-9,
  kpis: [
    {key: 'cost', label: 'Total cost / hour', fmt: 'money', better: 'low', primary: true},
    {key: 'Wq', label: 'Avg wait in queue (min)', fmt: 'n2', better: 'low'},
    {key: 'SL', label: 'Service level', fmt: 'pct', better: 'high'},
    {key: 'slGap', label: 'Service level vs target', fmt: 'pct', better: 'high'},
    {key: 'rho', label: 'Server utilization', fmt: 'pct', better: null},
    {key: 'Lq', label: 'Avg queue length', fmt: 'n2', better: 'low'},
    {key: 'Pw', label: 'Prob. customer waits', fmt: 'pct', better: 'low'},
    {key: 'W', label: 'Avg time in system (min)', fmt: 'n2', better: 'low'},
  ],
  simulate(p) {
    const mu = 60 / p.svc, a = p.lam / mu, c = p.c, rho = a / c, staff = c * p.wage;
    if (rho >= 1) return {stable: false, slGap: -p.SLt / 100, mu, a, rho, Pw: 1, Lq: Infinity, Wq: Infinity, W: Infinity, L: Infinity, SL: 0, staff, waitCost: Infinity, cost: Infinity};
    let s = 0, term = 1;
    for (let k = 0; k < c; k++) { if (k > 0) term *= a / k; s += term; }
    const last = term * a / c / (1 - rho); // a^c/c! /(1-rho)
    const Pw = last / (s + last);
    const Lq = Pw * rho / (1 - rho), WqH = Lq / p.lam;
    const SL = 1 - Pw * Math.exp(-(c * mu - p.lam) * p.T / 60);
    const waitCost = Lq * p.wcost;
    return {stable: true, slGap: SL - p.SLt / 100, mu, a, rho, Pw, Lq, Wq: WqH * 60, W: (WqH + 1 / mu) * 60, L: p.lam * (WqH + 1 / mu), SL, staff, waitCost, cost: staff + waitCost};
  },
  alternatives(p) {
    const cmin = Math.max(1, Math.floor(p.lam * p.svc / 60) + 1), out = [];
    for (let c = cmin; c <= Math.min(cmin + 5, 25); c++) if (c !== p.c) out.push({name: `${c} servers`, why: c === cmin ? 'Fewest servers that keep the queue stable' : '', p: {...p, c}});
    return out;
  },
  search(p) {
    let best = null, n = 0;
    for (let c = 1; c <= 25; c++) {
      n++; const q = {...p, c}; const r = this.simulate(q); const f = this.feasible(r, q);
      if (!f) continue;
      if (!best || r.cost < best.r.cost - 1e-9) best = {p: q, r};
    }
    if (!best) { const q = {...p, c: 25}; best = {p: q, r: this.simulate(q)}; }
    return {name: 'Optimizer: cheapest staffing that meets target', why: `Erlang C evaluated for 1–25 servers (${n} options)`, p: best.p, n};
  },
  describe: p => `${p.c} servers`,
  diagnose(p, r) {
    const out = [];
    if (!r.stable) { out.push({sev: 'high', code: 'unstable', title: 'Queue is unstable', text: `Demand (${p.lam}/h) is at or above capacity (${F.n1(p.c * r.mu)}/h). The line grows without limit. You need at least ${Math.floor(r.a) + 1} servers.`}); return out; }
    if (r.SL < p.SLt / 100) out.push({sev: 'high', code: 'sl', title: 'Service-level target missed', text: `Only ${F.pct(r.SL)} of customers wait less than ${p.T} min (target ${p.SLt}%).`});
    if (r.rho > 0.85) out.push({sev: 'med', code: 'highutil', title: 'Servers run too hot', text: `Utilization is ${F.pct(r.rho)}. Near 100%, small surges create long queues: average wait is ${F.n2(r.Wq)} min.`});
    if (r.rho < 0.5 && p.c > 1 && this.feasible(this.simulate({...p, c: p.c - 1}), p)) out.push({sev: 'med', code: 'overstaff', title: 'Overstaffed', text: `Servers are busy only ${F.pct(r.rho)} of the time. Staffing cost is ${F.money(r.staff)}/h.`});
    if (r.waitCost > r.staff) out.push({sev: 'med', code: 'waitcost', title: 'Waiting cost exceeds wages', text: `Customers' waiting time costs ${F.money(r.waitCost)}/h vs ${F.money(r.staff)}/h of wages. One more server would likely pay for itself.`});
    if (!out.length) out.push({sev: 'ok', code: 'goodq', title: 'Staffing is well balanced', text: `Target met (${F.pct(r.SL)}) at ${F.pct(r.rho)} utilization.`});
    return out;
  },
  lessons: {
    unstable: 'Average capacity must exceed average demand (ρ < 1), or the queue never clears.',
    sl: 'Service-level targets are set on the wait distribution, not the average. Variability is what makes customers wait.',
    highutil: 'Wait time grows like ρ/(1−ρ): going from 80% to 95% utilization roughly quadruples waiting.',
    overstaff: 'Idle servers are the price of low waits. Make sure that price is worth it.',
    waitcost: 'Choosing staffing is a cost trade-off: wages rise linearly, waiting cost falls steeply. The optimum is where they balance.',
    goodq: "Little's Law (L = λW) links queue length and waiting time for any stable system."
  },
  explain(p, r, b) {
    return `The recommendation is <b>${b.p.c} servers</b>. Utilization is ${F.pct(b.r.rho)}, average wait ${F.n2(b.r.Wq)} min, and ${F.pct(b.r.SL)} of customers are served within ${p.T} min. Total cost is ${fmtV('money', b.r.cost)}/h (wages ${F.money(b.r.staff)} + waiting ${F.money(b.r.waitCost)}), against ${fmtV('money', r.cost)}/h for your choice.`;
  },
  chart(r, b) {
    const p = lastParams('queue'), xs = [], tot = [], st = [], wt = [];
    const cmin = Math.max(1, Math.floor(p.lam * p.svc / 60) + 1);
    for (let c = cmin; c <= Math.max(cmin + 7, p.c + 1, b.c || 0); c++) { const rr = this.simulate({...p, c}); xs.push(c); tot.push(rr.cost); st.push(rr.staff); wt.push(rr.waitCost); }
    const cap = Math.max(...st) * 1.6;
    return legend([['Total cost', 'var(--you)', 'line'], ['Staffing cost', 'var(--s3)', 'line'], ['Waiting cost', 'var(--ai)', 'line']]) +
      lineChart({x: xs, series: [{name: 'Total', color: 'var(--you)', values: tot.map(v => Math.min(v, cap)), dots: true}, {name: 'Staffing', color: 'var(--s3)', values: st}, {name: 'Waiting', color: 'var(--ai)', values: wt.map(v => Math.min(v, cap))}],
        xLabel: 'Number of servers', yLabel: '$ per hour', yFmt: F.money, discrete: true,
        callouts: [{x: p.c, label: 'You'}, {x: lastAI('queue').c, label: 'AI'}]});
  },
  chartTitle: 'Cost per hour vs number of servers'
},

/* ===== 6. Supply Chain Disruption ===== */
{
  id: 'supply', num: 6, name: 'Supply Chain Disruption', short: 'Disruption',
  role: 'Your primary supplier will shut down for a period (fire, strike, port closure). Before it happens, choose a resilience strategy: share of volume contracted to a pricier backup supplier, buffer stock, and whether and how fast you switch to emergency sourcing.',
  concept: `<p>Resilience levers trade a <b>steady cost</b> (paid every day) against <b>disruption losses</b> (paid only if the disruption hits):</p>
  <ul class="clean"><li><b>Safety/buffer stock</b>: holding cost every day, but it covers the gap until supply resumes.</li><li><b>Dual sourcing</b>: a price premium on the backup share, plus a qualified relationship and guaranteed capacity.</li><li><b>Contingency plan</b>: switch orders to the backup once the disruption is detected. Spare backup capacity is limited, and stock already ordered from the primary stays stuck until it reopens.</li></ul>
  <p>The model is a 60-day daily simulation with a base-stock (order-up-to) replenishment policy.</p>`,
  formulas: [
    ['Order-up-to level', 'S = d × L_eff + SS,   L_eff = β·L₂ + (1−β)·L₁'],
    ['Daily order', 'q = max(0, S − inventory position)'],
    ['Primary orders in outage', 'arrive at (end of outage + L₁)'],
    ['Emergency supply limit', 'β·d + spare backup capacity per day'],
    ['Disruption cost', 'premium × backup units + holding + lost units × margin'],
    ['Fill rate', 'units sold ÷ units demanded']
  ],
  params: [
    {id: 'beta', label: 'Backup supplier share (dual sourcing)', unit: '%', role: 'decision', min: 0, max: 100, step: 10, def: 0},
    {id: 'ss', label: 'Buffer stock', unit: 'days of demand', role: 'decision', min: 0, max: 25, step: 1, def: 3},
    {id: 'cont', label: 'Contingency plan: switch to backup when disruption is detected', role: 'decision', type: 'checkbox', def: false},
    {id: 'R', label: 'Response time to switch', unit: 'days', role: 'decision', min: 1, max: 15, step: 1, def: 5, showIf: p => p.cont},
    {id: 'd', label: 'Daily demand', unit: 'units/day', role: 'scenario', min: 10, max: 100, step: 5, def: 40},
    {id: 's', label: 'Disruption starts on day', role: 'scenario', min: 5, max: 30, step: 1, def: 10},
    {id: 'dur', label: 'Disruption duration', unit: 'days', role: 'scenario', min: 0, max: 30, step: 1, def: 15},
    {id: 'L1', label: 'Primary lead time', unit: 'days', role: 'scenario', min: 1, max: 15, step: 1, def: 5},
    {id: 'L2', label: 'Backup lead time', unit: 'days', role: 'scenario', min: 1, max: 15, step: 1, def: 3, help: 'Backup settings matter once you use dual sourcing or a contingency plan.'},
    {id: 'spare', label: 'Backup spare capacity', unit: 'units/day', role: 'scenario', min: 0, max: 100, step: 5, def: 25},
    {id: 'prem', label: 'Backup price premium', unit: '$/unit', role: 'scenario', min: 0, max: 30, step: 1, def: 4},
    {id: 'margin', label: 'Lost margin per unit short', unit: '$/unit', role: 'scenario', min: 5, max: 150, step: 5, def: 40},
    {id: 'h', label: 'Holding cost', unit: '$/unit/day', role: 'scenario', min: 0.01, max: 1, step: 0.01, def: 0.3}
  ],
  objective: {key: 'total', dir: 'min'},
  kpis: [
    {key: 'total', label: 'Total disruption cost', fmt: 'money', better: 'low', primary: true},
    {key: 'fill', label: 'Fill rate', fmt: 'pct', better: 'high'},
    {key: 'lostUnits', label: 'Lost sales (units)', fmt: 'int', better: 'low'},
    {key: 'stockoutDays', label: 'Stockout days', fmt: 'int', better: 'low'},
    {key: 'lostMargin', label: 'Lost margin', fmt: 'money', better: 'low'},
    {key: 'premCost', label: 'Backup premium paid', fmt: 'money', better: 'low'},
    {key: 'holding', label: 'Holding cost', fmt: 'money', better: 'low'},
    {key: 'peak', label: 'Peak inventory (units)', fmt: 'int', better: null}
  ],
  simulate(p) {
    const T = 60, b = p.beta / 100, d = p.d, SS = p.ss * d, s = p.s, e = p.s + p.dur;
    const H = T + e + p.L1 + p.L2 + 5;
    const arrP = new Array(H).fill(0), arrB = new Array(H).fill(0);
    // steady-state pipeline from orders placed before day 0
    for (let k = 0; k < p.L1; k++) arrP[k] += (1 - b) * d;
    for (let k = 0; k < p.L2; k++) arrB[k] += b * d;
    let onHand = SS, stuck = 0, lost = 0, sold = 0, holding = 0, backupUnits = 0, stockoutDays = 0, peak = 0;
    const inv = [], service = [];
    for (let t = 0; t < T; t++) {
      onHand += arrP[t] + arrB[t];
      backupUnits += arrB[t];
      if (t === e + p.L1) stuck = 0; // stuck primary orders have now arrived (included in arrP)
      const sl = Math.min(onHand, d); onHand -= sl; sold += sl;
      if (d - sl > 1e-6) { lost += d - sl; stockoutDays++; }
      const disrupted = t >= s && t < e;
      const active = p.cont && t >= s + p.R && t < e;
      let pipe = 0; for (let k = t + 1; k < H; k++) pipe += arrP[k] + arrB[k];
      const ip = onHand + pipe - (active ? stuck : 0);
      const Leff = active ? p.L2 : b * p.L2 + (1 - b) * p.L1;
      const q = Math.max(0, d * Leff + SS - ip);
      if (active) {
        arrB[t + p.L2] += Math.min(q, b * d + p.spare);
      } else {
        arrB[t + p.L2] += b * q;
        if (disrupted) { arrP[e + p.L1] += (1 - b) * q; stuck += (1 - b) * q; }
        else arrP[t + p.L1] += (1 - b) * q;
      }
      holding += p.h * onHand; peak = Math.max(peak, onHand);
      inv.push(onHand); service.push(sl / d);
    }
    const lostMargin = lost * p.margin, premCost = backupUnits * p.prem;
    return {inv, service, lostUnits: lost, sold, fill: sold / (d * T), stockoutDays, holding, premCost, lostMargin, total: holding + premCost + lostMargin, peak, s, e};
  },
  alternatives(p) {
    return [
      {name: 'Fast contingency (switch in 2 days)', why: 'Detect early and move orders to the backup', p: {...p, cont: true, R: 2}},
      {name: 'Buffer stock to cover the outage', why: `Hold ${Math.min(25, p.dur)} days of buffer stock`, p: {...p, ss: Math.min(25, p.dur), cont: false}},
      {name: 'Dual sourcing 30% + contingency in 3 days', why: 'Qualified backup with guaranteed volume', p: {...p, beta: 30, cont: true, R: 3}},
      {name: 'Do nothing special', why: 'Lean: minimal buffer, single source', p: {...p, beta: 0, ss: 0, cont: false}}
    ];
  },
  search(p) {
    let best = null, n = 0;
    const Rs = [null, 1, 2, 3, 5, 8];
    for (let beta = 0; beta <= 100; beta += 10) for (let ss = 0; ss <= 25; ss++) for (const R of Rs) {
      n++; const q = {...p, beta, ss, cont: R !== null, R: R === null ? p.R : R}; const r = this.simulate(q);
      if (!best || r.total < best.r.total - 1e-9) best = {p: q, r};
    }
    return {name: 'Optimizer: resilience grid search', why: `${n} combinations of backup share, buffer stock and contingency response simulated`, p: best.p, n};
  },
  describe: p => `Backup ${p.beta}%, buffer ${p.ss} d, ${p.cont ? 'contingency in ' + p.R + ' d' : 'no contingency'}`,
  decisionKey: p => `${p.beta}|${p.ss}|${p.cont ? p.R : 'off'}`,
  diagnose(p, r) {
    const out = [];
    if (p.dur === 0) { out.push({sev: 'ok', code: 'nodisrupt', title: 'No disruption in this scenario', text: 'Any resilience spending is pure insurance cost here.'}); }
    if (r.lostUnits > 1) out.push({sev: 'high', code: 'stockout', title: `Stockouts for ${r.stockoutDays} days`, text: `${F.int(r.lostUnits)} units of demand lost (${F.money(r.lostMargin)} margin). Fill rate ${F.pct(r.fill)}.`});
    if (!p.cont && p.dur > 0) out.push({sev: 'high', code: 'nocont', title: 'No contingency plan', text: 'Orders keep flowing to the closed supplier and sit stuck until it reopens. Only buffer stock protects you.'});
    if (p.cont && p.R > Math.max(1, p.L1 - p.L2) && r.lostUnits > 1) out.push({sev: 'med', code: 'slow', title: 'Response is too slow', text: `Switching after ${p.R} days, plus the ${p.L2}-day backup lead time, leaves a gap once pipeline stock runs out (primary lead time ${p.L1} days).`});
    if (p.cont && p.beta * p.d / 100 + p.spare < p.d && r.lostUnits > 1) out.push({sev: 'med', code: 'capacity', title: 'Backup cannot cover full demand', text: `In an emergency the backup ships only ${F.int(p.beta * p.d / 100 + p.spare)} of ${p.d} units/day (contracted ${p.beta}% + ${p.spare} spare). A contracted share guarantees capacity.`});
    const cheaper = q => this.simulate(q).total < r.total - 1e-6;
    if (p.beta > 0 && r.premCost > 0.4 * r.total && cheaper({...p, beta: p.beta - 10})) out.push({sev: 'med', code: 'premium', title: 'Dual sourcing premium is large', text: `You pay ${F.money(r.premCost)} in backup premiums, most of it on normal days.`});
    if (p.ss > 0 && r.holding > 0.4 * r.total && r.lostUnits < 1 && cheaper({...p, ss: p.ss - 1})) out.push({sev: 'med', code: 'overbuffer', title: 'Buffer may be larger than needed', text: `Holding cost is ${F.money(r.holding)} (${F.pct(r.holding / r.total)} of total) with no stockouts. A smaller buffer may suffice.`});
    if (r.peak > (p.ss + 2) * p.d * 1.8 && p.cont) out.push({sev: 'med', code: 'overhang', title: 'Post-disruption inventory overhang', text: `Stuck primary orders arrive all at once after the outage. Inventory peaks at ${F.int(r.peak)} units.`});
    if (!out.length) out.push({sev: 'ok', code: 'resilient', title: 'Resilient plan', text: `Fill rate ${F.pct(r.fill)} at a disruption cost of ${F.money(r.total)}.`});
    return out;
  },
  lessons: {
    stockout: 'Time-to-survive (how long buffers last) must exceed time-to-recover (how long until supply returns), or sales are lost.',
    nocont: 'A contingency plan is cheap until it is used. Its value is in cutting the response time.',
    slow: 'Detection and decision speed matter as much as the backup itself. Every day of delay is a day of lost sales.',
    capacity: 'Spot capacity from a backup is scarce in a crisis. Contracted volume (dual sourcing) buys guaranteed access.',
    premium: 'Dual sourcing is insurance with a premium paid every day. Size it to the risk.',
    overbuffer: 'Buffer stock is the simplest hedge but ties up capital. It works best for short, predictable outages.',
    overhang: 'Disruptions create a bullwhip effect: delayed orders land together and cause excess inventory afterwards.',
    nodisrupt: 'Stress-test the plan: change the disruption duration and see which strategy is robust.',
    resilient: 'The best resilience mix depends on margin, holding cost and the backup premium. High-margin products justify more protection.'
  },
  explain(p, r, b) {
    return `The recommended strategy is <b>${this.describe(b.p)}</b>. Fill rate goes from ${F.pct(r.fill)} to ${F.pct(b.r.fill)}, and lost sales fall from ${F.int(r.lostUnits)} to ${F.int(b.r.lostUnits)} units. It costs ${F.money(b.r.premCost)} in premiums and ${F.money(b.r.holding)} in holding, against your ${F.money(r.premCost)} and ${F.money(r.holding)}. Each lost unit costs ${F.money(p.margin)}, so protection pays when it saves enough units.`;
  },
  chart(r, b) {
    const x = r.inv.map((_, i) => i);
    return legend([['You: on-hand', 'var(--you)', 'line'], ['AI: on-hand', 'var(--ai)', 'line'], ['Supplier outage', 'var(--shade)']]) +
      lineChart({x, series: [{name: 'You', color: 'var(--you)', values: r.inv}, {name: 'AI', color: 'var(--ai)', values: b.inv}],
        shade: r.e > r.s ? [{from: r.s, to: r.e, label: 'Primary supplier down'}] : [], xLabel: 'Day', yLabel: 'Units on hand',
        marks: r.service.map((v, i) => (v < 0.999 ? i : -1)).filter(i => i >= 0)});
  },
  chartTitle: 'Inventory on hand by day (red ticks = your stockout days)'
},

/* ===== 7. Process Time Analytics ===== */
{
  id: 'leadtime', num: 7, name: 'Process Time Analytics', short: 'Lead time',
  role: 'You run an order-to-ship process: order entry → cutting → transport → assembly → inspection → packing. Customers pay for speed, so every hour an order spends in the system has a cost. Choose the batch size and which lean improvements to fund. Assembly time comes from a time study.',
  concept: `<p><b>Lead time</b> is how long a unit takes from order to shipment. Usually only a tiny share of it is <b>value-added</b> work. The rest is waiting: for the rest of the batch, for a setup, in a queue, or in transport. <b>Process cycle efficiency</b> (PCE = value-added time ÷ lead time) is often below 5%.</p>
  <p>Big batches spread setup time but make every unit wait for its whole batch. Small batches cut that wait, but more setups eat capacity. Near 100% utilization, queues explode (Kingman's formula). <b>SMED</b> shortens setups so small batches become feasible. <b>Little's Law</b> links it all: WIP = throughput × lead time. A <b>time study</b> sets the standard time used for planning.</p>`,
  formulas: [
    ['Standard time (time study)', 'observed time × rating × (1 + allowance)'],
    ['Takt time', 'available time ÷ demand'],
    ['Utilization at a station', 'u = demand × (t + S/Q) ÷ available time'],
    ['Queue time (Kingman / VUT)', '((ca² + ce²)/2) × (u/(1−u)) × (S + Q·t)'],
    ['Batch formation wait', '(Q − 1)/2 × takt'],
    ['Lead time', 'order delay + batch wait + Σ(queue + S + Q·t) + transport'],
    ['Process cycle efficiency', 'value-added time ÷ lead time'],
    ["Little's Law", 'WIP = throughput × lead time'],
    ['Daily cost', 'TH × lead time (h) × delay cost + unmet units × margin + improvement costs']
  ],
  params: [
    {id: 'Q', label: 'Batch size (units per batch)', role: 'decision', min: 1, max: 100, step: 1, def: 40},
    {id: 'smed', label: 'SMED: cut all setup times by 60%', role: 'decision', type: 'checkbox', def: false},
    {id: 'cell', label: 'Cellular layout: cut transport time by 80%', role: 'decision', type: 'checkbox', def: false},
    {id: 'poka', label: 'Poka-yoke at source: remove the final inspection step', role: 'decision', type: 'checkbox', def: false},
    {id: 'D', label: 'Demand', unit: 'units/day', role: 'scenario', min: 10, max: 120, step: 5, def: 60},
    {id: 'T', label: 'Available time', unit: 'min/day', role: 'scenario', min: 240, max: 960, step: 30, def: 480},
    {id: 'obs', label: 'Assembly: observed time (time study)', unit: 'min/unit', role: 'scenario', min: 1, max: 12, step: 0.1, def: 5},
    {id: 'rating', label: 'Assembly: performance rating', unit: '%', role: 'scenario', min: 70, max: 130, step: 5, def: 110},
    {id: 'allow', label: 'Assembly: PF&D allowance', unit: '%', role: 'scenario', min: 0, max: 30, step: 1, def: 15},
    {id: 'Sa', label: 'Assembly setup time', unit: 'min/batch', role: 'scenario', min: 0, max: 90, step: 5, def: 20},
    {id: 'tc', label: 'Cutting time', unit: 'min/unit', role: 'scenario', min: 0.5, max: 10, step: 0.5, def: 3},
    {id: 'Sc', label: 'Cutting setup time', unit: 'min/batch', role: 'scenario', min: 0, max: 90, step: 5, def: 30},
    {id: 'tp', label: 'Packing time', unit: 'min/unit', role: 'scenario', min: 0.5, max: 10, step: 0.5, def: 2},
    {id: 'Sp', label: 'Packing setup time', unit: 'min/batch', role: 'scenario', min: 0, max: 60, step: 5, def: 10},
    {id: 'ti', label: 'Inspection time', unit: 'min/unit', role: 'scenario', min: 0, max: 5, step: 0.5, def: 1.5},
    {id: 'move', label: 'Transport time per batch move', unit: 'min', role: 'scenario', min: 0, max: 240, step: 5, def: 45},
    {id: 'od', label: 'Order entry delay', unit: 'min', role: 'scenario', min: 0, max: 480, step: 10, def: 60},
    {id: 'cv', label: 'Variability (ca² = ce²)', role: 'scenario', min: 0, max: 2, step: 0.1, def: 1, help: '0 = perfectly regular, 1 = random (exponential-like), 2 = very erratic.'},
    {id: 'dc', label: 'Delay cost', unit: '$/unit-hour of lead time', role: 'scenario', min: 0, max: 5, step: 0.05, def: 1},
    {id: 'margin', label: 'Margin lost per unit not made', unit: '$/unit', role: 'scenario', min: 0, max: 300, step: 5, def: 120, help: 'Matters only when batches are so small that the line cannot meet demand.'},
    {id: 'cSmed', label: 'SMED cost', unit: '$/day', role: 'scenario', min: 0, max: 1000, step: 10, def: 150},
    {id: 'cCell', label: 'Cellular layout cost', unit: '$/day', role: 'scenario', min: 0, max: 1000, step: 10, def: 30},
    {id: 'cPoka', label: 'Poka-yoke cost', unit: '$/day', role: 'scenario', min: 0, max: 1000, step: 5, def: 10}
  ],
  objective: {key: 'total', dir: 'min'},
  kpis: [
    {key: 'total', label: 'Total daily cost', fmt: 'money', better: 'low', primary: true},
    {key: 'leadH', label: 'Lead time (hours)', fmt: 'n1', better: 'low'},
    {key: 'pce', label: 'Process cycle efficiency', fmt: 'pct', better: 'high'},
    {key: 'wip', label: "WIP (units, Little's Law)", fmt: 'n1', better: 'low'},
    {key: 'th', label: 'Throughput (units/day)', fmt: 'n1', better: 'high'},
    {key: 'bnU', label: 'Bottleneck utilization', fmt: 'pct', better: null},
    {key: 'takt', label: 'Takt time (min/unit)', fmt: 'n2', better: null},
    {key: 'std', label: 'Assembly standard time (min)', fmt: 'n2', better: null}
  ],
  simulate(p) {
    const std = p.obs * p.rating / 100 * (1 + p.allow / 100);
    const sf = p.smed ? 0.4 : 1, Q = p.Q, c2 = p.cv;
    const st = [
      {name: 'Cutting', t: p.tc, S: p.Sc * sf, va: true},
      {name: 'Assembly', t: std, S: p.Sa * sf, va: true},
      ...(p.poka ? [] : [{name: 'Inspection', t: p.ti, S: 0, va: false}]),
      {name: 'Packing', t: p.tp, S: p.Sp * sf, va: true}
    ];
    st.forEach(s => { s.e = s.t + s.S / Q; });
    const maxE = Math.max(...st.map(s => s.e)), bn = st.find(s => s.e === maxE);
    const capacity = p.T / maxE;
    const overloaded = p.D * maxE / p.T >= 0.98;
    const th = overloaded ? 0.98 * capacity : p.D; // release is throttled when the line is overloaded
    const takt = p.T / p.D, releaseGap = p.T / th;
    let queue = 0, setup = 0, batchProc = 0, nvaProc = 0;

  marks.forEach(i => { g += `<line x1="${X(x[i])}" x2="${X(x[i])}" y1="${Tp + ph}" y2="${Tp + ph - 7}" stroke="var(--bad)" stroke-width="2"/>`; });
  series.forEach(s => {
    const pts = s.values.map((v, i) => isFinite(v) ? `${X(x[i])},${Y(v)}` : null).filter(Boolean);

    if (s.dots) s.values.forEach((v, i) => { if (isFinite(v)) g += `<circle cx="${X(x[i])}" cy="${Y(v)}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`; });
  });
  callouts.forEach((c, k) => { if (c.x == null || c.x < x0 || c.x > x1) return; g += `<line x1="${X(c.x)}" x2="${X(c.x)}" y1="${Tp}" y2="${Tp + ph}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/><text x="${X(c.x) + 4}" y="${Tp + 12 + k * 14}" style="fill:var(--ink);font-weight:700">${esc(c.label)}</text>`; });

  const step = pw / Math.max(1, x.length - 1);
  x.forEach((xv, i) => {

}
function gantt(groups) {
  const maxT = Math.max(...groups.flatMap(g => g.rows.map(r => Math.max(r.end, r.d)))) + 1;
  const W = 640, L = 100, R = 12, rowH = 34, gap = 30, Tp = 6, ph = groups.length * (rowH + gap), Hh = Tp + ph + 24, pw = W - L - R;
  const X = v => L + v / maxT * pw;
  let g = '';
  range(0, maxT, Math.max(1, Math.ceil(maxT / 10))).forEach(tt => { g += `<line class="gridl" x1="${X(tt)}" x2="${X(tt)}" y1="${Tp}" y2="${Tp + ph - gap + 10}"/><text x="${X(tt)}" y="${Hh - 6}" text-anchor="middle">${tt}</text>`; });
  groups.forEach((grp, gi) => {
    const y0 = Tp + gi * (rowH + gap);
    g += `<text x="${L - 8}" y="${y0 + rowH / 2 + 4}" text-anchor="end" style="fill:var(--ink);font-weight:600">${esc(grp.label)}</text>`;
    grp.rows.forEach(r => {
      const x = X(r.start) + 1, w = Math.max(2, X(r.end) - X(r.start) - 2), col = r.late ? 'var(--bad)' : 'var(--you)';
      g += `<rect x="${x}" y="${y0}" width="${w}" height="${rowH}" rx="4" fill="${col}" data-tip="Job ${r.id}: day ${r.start}–${r.end}\nDue day ${r.d}${r.late ? ' · ' + r.tard + ' days late' : ' · on time'}"/>`;
      g += `<text x="${x + w / 2}" y="${y0 + rowH / 2 + 4}" text-anchor="middle" style="fill:#fff;font-weight:700;pointer-events:none">${esc(r.id)}</text>`;
      g += `<path d="M${X(r.d)},${y0 + rowH + 2} l-4,7 h8 z" fill="var(--ink)" opacity=".75" data-tip="Job ${r.id} due day ${r.d}"/><text x="${X(r.d)}" y="${y0 + rowH + 19}" text-anchor="middle" style="font-size:9.5px">${esc(r.id)}</text>`;
    });
  });
  g += `<text x="${L + pw / 2}" y="${Hh + 10}" text-anchor="middle">Day</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh + 14}" role="img" aria-label="Gantt chart">${g}</svg>`;
}
function stackedBars({categories, stacks, fmt = F.money, axis = v => '$' + shortNum(v), label = 'Cost of quality breakdown'}) {
  const W = 640, Hh = 250, L = 140, R = 70, Tp = 10, B = 26, pw = W - L - R;
  const totals = categories.map((_, i) => sum(stacks.map(s => s.values[i])));
  const max = niceMax(Math.max(...totals) * 1.02), X = v => L + v / max * pw;
  const bh = 52, gap = (Hh - Tp - B - bh * categories.length) / Math.max(1, categories.length);
  let g = '';
  ticks(max).forEach(t => { g += `<line class="gridl" x1="${X(t)}" x2="${X(t)}" y1="${Tp}" y2="${Hh - B}"/><text x="${X(t)}" y="${Hh - B + 16}" text-anchor="middle">${axis(t)}</text>`; });
  categories.forEach((c, i) => {
    const y = Tp + gap / 2 + i * (bh + gap); let acc = 0;
    g += `<text x="${L - 10}" y="${y + bh / 2 + 4}" text-anchor="end" style="fill:var(--ink);font-weight:600">${esc(c)}</text>`;
    stacks.forEach(s => {
      const v = s.values[i]; if (v <= 0) return;
      const x = X(acc), w = X(acc + v) - x; acc += v;
      g += `<rect x="${x}" y="${y}" width="${Math.max(0, w - 2)}" height="${bh}" rx="3" fill="${s.color}" data-tip="${esc(c)} · ${esc(s.name)}\n${fmt(v)} (${F.pct(v / totals[i])})"/>`;
    });

  });

}

function readInputs(t) {
  const p = state.inputs[t.id];
  t.params.forEach(x => {
    if (x.type === 'jobs') {
      $$('input[data-job]').forEach(inp => { const j = +inp.dataset.job, f = inp.dataset.f; const lo = f === 'p' ? 1 : 1, hi = f === 'p' ? 30 : 120; let val = Math.round(+inp.value); if (!isFinite(val)) val = p.jobs[j][f]; p.jobs[j][f] = clamp(val, lo, hi); inp.value = p.jobs[j][f]; });
      return;

    const el = $('#in-' + x.id); if (!el) return;

}

function demandHistory(p, days = 90) { return stdNormals(500000 + p.seed * 7919, days).map(x => Math.max(0, Math.round(p.mu + p.sigma * x))); }

    summary: [['Mean', n2(mean(values))], ['Std. deviation', n2(stdev(values))], ['Min', Math.min(...values)], ['Max', Math.max(...values)], ['Total', sum(values)]]};
}

  const snap = JSON.parse(JSON.stringify(p));
  const r = t.simulate(snap);
  const runs = state.runs[t.id];
  const prevRun = runs[runs.length - 1];
  const base = defaults(t);
  const prev = prevRun ? {label: prevRun.round ? 'previous round (' + prevRun.round.label + ')' : 'previous run (#' + prevRun.n + ')', p: prevRun.p, r: prevRun.r} : {label: 'default baseline', p: base, r: t.simulate(base)};
  const analysis = Agent.analyze(t, snap, r);
  const run = {n: runs.length + 1, p: snap, r, prev, analysis, changes: changesText(t, prev.p, snap), time: new Date()};
  runs.push(run);
  if (rd) {
    run.round = {period: camp.period, k: rd.k, label: rd.label, custom: !!camp.custom};
    camp.rounds.push({k: rd.k, label: rd.label, events: [...rd.events, ...rd.reveal], p: snap, r, bestP: analysis.best.p, bestR: analysis.best.r,
      value: campaignValue(t, r, snap, camp.period), bestValue: campaignValue(t, analysis.best.r, analysis.best.p, camp.period), eff: analysis.eff});
    applyRoundScenario(t);
  }
  const k = t.kpis.find(k => k.key === t.objective.key);
  logActivity(t, `Run #${run.n}: ${t.describe(snap)} → ${k.label} ${fmtV(k.fmt, r[k.key])}; tested ${analysis.evaluated} alternatives (${F.pct(analysis.eff)} of best)`);
  if (ROOM.student) setTimeout(() => submitRun(t, run), 0);
  return run;
}

  let html = `<section class="card doc"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1"><h2>End-of-run report</h2><p class="muted" style="margin:0">Prepared by the rule-based AI Operations Agent from your logged runs · ${new Date().toLocaleString()}</p></div><button class="btn primary noprint" id="printBtn">Print / save as PDF</button></div>`;

  if (!used.length) return html + (ts || `<div class="empty" style="margin-top:14px">No runs yet. Run at least one simulation and the report fills in automatically.</div>`) + '</section>';

  html += `<div class="callout"><b>Summary:</b> ${used.length} of ${TOPICS.length} topics attempted, ${sum(used.map(t => state.runs[t.id].length))} runs in total. Averaging your best run per topic, you reached <b>${F.pct(overall)}</b> of the agent's best option.</div>`;

      <div style="margin-top:8px"><b class="small">Lessons learned</b><ul class="clean small">${[...lessons].map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>

  <p>A stepwise lab that follows the ARIMA sessions: (1) visualise and judge stationarity, (2) run the ADF test and conclude, (3) choose a transformation, (4) re-test and confirm (or difference again), (5) read the ACF, (6) read the PACF, (7) specify and fit up to three ARIMA models (trained on 335 days, tested on the last 30), and (8) choose the model to forecast with. The Analytics Agent runs only the analyses students request and checks every decision against the evidence. It waits for the student and never advances on its own. Wrong choices are allowed and their consequences show up later, so students learn from the path they took. The debrief reveals the true generating process, an automatic AIC search, a scorecard and a 14-day forecast. The ADF, ACF and PACF numbers match Python statsmodels, so students can repeat the analysis in Colab using the CSV. Use “Mystery dataset” for an exam-style exercise and “New sample” to give each student different data.</p>
  <h3>Study Room</h3>
  <p>Students upload your session .pptx in <b>Study Room</b> and get study notes, a slide viewer with visual explanations, quiz practice and slide-grounded Q&amp;A, plus buttons that open the matching OpsLab simulation. Files are read in the browser. Slide text goes only to the LLM the student connects (Ollama keeps it on their laptop). It works offline in a simpler, slide-based form. A good routine is to share the deck after class, ask students to score 80% or more on a quiz, and then play the linked simulation.</p>
  <h3>Scenario Agent and Ollama</h3>
  <p>Every topic has a <b>Scenario Agent</b>: type a brief (or leave it empty) and it writes a new case (title, story and scenario values), or a whole campaign when you pick “Rounds: written by the Scenario Agent”. Values are checked against each input's range and decisions are never changed. Without an LLM, <b>Random case</b> generates rule-based variations. For a free model, click <b>Use Ollama</b>. When students use the class server, your laptop's Ollama serves everyone. Use it to give each team a different case, or to localise cases to your students' industries.</p>
  <h3>Campaign mode (quarters or years)</h3>
  <p>Each topic has a <b>Campaign</b> switch. Pick quarterly (4 or 8 quarters) or yearly (3 or 5 years). Every round brings a briefing with new conditions (growth, seasonality, cost changes, a launch, a recall, a supplier shutdown revealed only after the plan is committed). Students set decisions once per round. Results are scaled to the period and summed, and compared with the AI's best plan for each round (a hindsight benchmark). It works well as homework or a team competition: "Who runs the plant best over two years?" In the class room, official campaign rounds count for the leaderboard.</p>
  <h3>How the AI agent works</h3>
  <p>The agent is a <b>rule-based, deterministic</b> expert system that runs in the browser. No LLM is used, and the label in the header says so. After every run it:</p>
  <ol><li><b>Tracks</b> the decisions you changed and the resulting KPI movement.</li>
    <li><b>Diagnoses</b> issues using operations rules (e.g. ROP &lt; lead-time demand, utilization &gt; 85%, external failure share &gt; 40%).</li>
    <li><b>Generates alternatives</b>: textbook heuristics (EOQ, SPT/EDD, Moore–Hodgson…) plus an exhaustive or grid search over the decision space.</li>
    <li><b>Simulates</b> every alternative with the <i>same</i> engine and scenario (same random demand stream), so differences come only from the decision.</li>
    <li><b>Ranks</b> on the topic objective (profit, total cost, penalty), respecting constraints such as the service-level target, and lists what the best option gains and gives up.</li>
    <li><b>Reports</b> after the run, never during. Detailed advice appears only when you press <i>Get AI advice</i>.</li></ol>
  <h3>Optional: live AI agent chat</h3>
  <p>The <b>Ask the AI agent</b> box (right panel) lets students ask free-form questions such as “Should I add a machine at B?” or “What if demand rises 30%?”. Connect any LLM under <i>Live LLM settings</i>: Anthropic Claude, NVIDIA NIM, OpenAI, Groq, OpenRouter, Google Gemini, a local Ollama model, or any OpenAI-compatible endpoint. A live LLM agent then answers. For providers that block browser calls (e.g. NVIDIA), run <code>node tools/llm-proxy.mjs</code> and tick <i>Use local proxy</i>. Models without tool calling still work: OpsLab sends them pre-computed simulator data. It has four tools: read the current state, run the simulation as a sandbox, run the optimizer, and propose settings. It must quote only numbers those tools return. Suggestions appear as an <i>Apply suggested settings</i> button; nothing changes until the student applies and runs. Without a key, the rule-based agent answers, so the demo still works offline and at no cost.</p>
  <p class="small muted">Classroom tip: run the live agent from the instructor's machine with a spending-limited key. Don't save keys on shared computers.</p>
  <h3>Optional: run it as a class room</h3>
  <ol><li>On your laptop, run <code>node tools/opslab-server.mjs</code> (Node 18+). It prints a <b>Students open</b> address, e.g. <code>http://192.168.1.20:8787</code>.</li>
    <li>Open that address yourself, go to <b>Class room</b>, and create a room. You can paste the class roll-number list so only listed students can join. Note the 6-character room code (and keep the professor key to reopen the dashboard later).</li>
    <li>Students open the same address on their laptops or phones (same Wi-Fi or hotspot), go to <b>Class room</b>, and enter the code and their roll number.</li>
    <li>Every run is submitted automatically. The server re-computes each run from the student's decisions, so results can't be faked. Runs with a changed scenario count as practice only.</li>
    <li>The live dashboard shows each student's best % of optimum per topic, a leaderboard, the most common mistakes per topic, and who hasn't joined. Export it to CSV for grading.</li></ol>
  <p class="small muted">One roll number works on one device. Use <i>Reset device</i> if a student switches laptop. If campus Wi-Fi blocks device-to-device traffic, use a phone hotspot.</p>
  <div class="callout"><b>Tips.</b> Change one decision at a time so cause and effect are clear. Scenario changes are marked ⚑ in the history. All results are reproducible: the same inputs always give the same numbers, which suits live demos. <b>Reset topic</b> restores defaults; <b>Reset all</b> clears the whole session.</div>
  </section>`;
}

const LLM_TOOLS = [
  {name: 'get_current_state', description: "Returns the current topic, every input (id, label, unit, role 'decision' or 'scenario', allowed range or options, current value), the objective, the KPIs and diagnosis of the student's latest run (null if none yet), and the rule-based agent's best alternative.",

    input_schema: {type: 'object', properties: {
      changes: {type: 'object', description: 'Map of input id to new value, e.g. {"mB": 2}, {"rule": "EDD"}, {"cont": true, "R": 2}. Use ids from get_current_state. Scenario inputs may be changed too, for what-if questions. Use {} to run the current inputs.'},
      label: {type: 'string', description: 'Short name for this test, shown to the student.'}}, required: ['changes']}},

    input_schema: {type: 'object', properties: {scenario_changes: {type: 'object', description: 'Optional map of scenario input id to value, e.g. {"demand": 130}.'}}}},
  {name: 'propose_settings', description: 'Shows the student an "Apply suggested settings" button in the chat for decision inputs you recommend. The student decides whether to apply and run. Only include decision inputs whose values you have tested with run_simulation.',

function applyChanges(t, base, changes, onlyRole) {
  const p = JSON.parse(JSON.stringify(base)), errors = [];
  Object.entries(changes || {}).forEach(([id, v]) => {
    const x = t.params.find(q => q.id === id);
    if (!x) { errors.push(`Unknown input "${id}". Valid ids: ${t.params.map(q => q.id).join(', ')}`); return; }
    if (onlyRole && x.role !== onlyRole) { errors.push(`"${id}" is a ${x.role} input, not a ${onlyRole}`); return; }
    if (x.type === 'checkbox') p[id] = v === true || v === 'true' || v === 1;
    else if (x.type === 'text') p[id] = String(v);
    else if (x.type === 'select') { const o = x.options.find(o => String(o[0]).toUpperCase() === String(v).toUpperCase()); if (!o) errors.push(`"${id}" must be one of ${x.options.map(o => o[0]).join(', ')}`); else p[id] = o[0]; }
    else if (x.type === 'jobs') {
      if (!Array.isArray(v) || v.some(j => !p.jobs.find(k => k.id === j.id))) errors.push('jobs must be an array of {id, p, d} using existing job ids');
      else v.forEach(j => { const k = p.jobs.find(k => k.id === j.id); if (j.p != null) k.p = clamp(Math.round(+j.p), 1, 30); if (j.d != null) k.d = clamp(Math.round(+j.d), 1, 120); });
    } else {
      const n = +v; if (!isFinite(n)) { errors.push(`"${id}" must be a number`); return; }
      const c = round(clamp(Math.round(n / x.step) * x.step, x.min, x.max), 4);
      if (Math.abs(c - n) > 1e-9) errors.push(`Note: ${id}=${n} adjusted to ${c} (allowed ${x.min}–${x.max}, step ${x.step})`);
      p[id] = c;
    }
  });
  if (!errors.some(e => !e.startsWith('Note')) && t.validate) { const e = t.validate(p); if (e) errors.push(e); }
  return {p, errors};
}
function kpiDump(t, r, p) {
  const o = {};
  t.kpis.forEach(k => { o[k.label] = fmtV(k.fmt, r[k.key]).replace(/&[a-z]+;/g, ''); });
  if (t.feasible) o['Meets service target'] = t.feasible(r, p);
  return o;
}
function paramDump(t, p) {
  return t.params.map(x => {
    const d = {id: x.id, label: x.label, role: x.role, value: p[x.id]};
    if (x.unit) d.unit = x.unit;
    if (x.type === 'select') d.options = x.options.map(o => o[0]);
    else if (x.type === 'checkbox') d.type = 'boolean';
    else if (x.type === 'text') d.type = 'text (used when rule = CUSTOM)';
    else if (x.type !== 'jobs') Object.assign(d, {min: x.min, max: x.max, step: x.step});
    if (x.help) d.note = x.help;
    return d;
  });
}
function runTool(t, name, input) {
  input = {...input};
  for (const k of ['changes', 'scenario_changes']) if (typeof input[k] === 'string') { try { input[k] = input[k].trim() ? JSON.parse(input[k]) : {}; } catch (e) { return {error: `"${k}" must be a JSON object, e.g. {"mB": 2}`}; } }
  for (const k of ['changes', 'scenario_changes']) if (input[k] != null && (typeof input[k] !== 'object' || Array.isArray(input[k]))) return {error: `"${k}" must be an object mapping input ids to values`};
  const cur = state.inputs[t.id], obj = t.kpis.find(k => k.key === t.objective.key);
  const objText = `${t.objective.dir === 'max' ? 'maximize' : 'minimize'} ${obj.label}`;
  if (name === 'get_current_state') {
    const run = lastRun(t.id);
    return {note: 'Read the current state', out: {topic: t.name, role: t.role, objective: objText, inputs: paramDump(t, cur),
      runs_so_far: state.runs[t.id].length,
      latest_run: run ? {decisions: t.describe(run.p), kpis: kpiDump(t, run.r, run.p), diagnosis: run.analysis.issues.map(i => `${i.title}: ${i.text}`),
        share_of_best_option: F.pct(run.analysis.eff),
        rule_based_best: {option: run.analysis.best.name, decisions: t.describe(run.analysis.best.p), kpis: kpiDump(t, run.analysis.best.r, run.analysis.best.p)}} : null,
      inputs_differ_from_latest_run: run ? JSON.stringify(run.p) !== JSON.stringify(cur) : null,
      case_brief: caseDataFor(t).brief,
      current_case: state.cases[t.id] ? {title: state.cases[t.id].title, story: state.cases[t.id].story, source: state.cases[t.id].source} : null,
      campaign: state.mode[t.id] === 'campaign' && state.camp[t.id] ? (() => { const c = state.camp[t.id]; const nr = c.rounds.length < c.n ? roundFor(t, c, c.rounds.length) : null;
        return {period: c.period, rounds: c.n, played: c.rounds.map(r => ({round: r.label, decisions: t.describe(r.p), value: fmtV(obj.fmt, r.value), ai_best: fmtV(obj.fmt, r.bestValue), share_of_best: F.pct(r.eff)})),
          next_round: nr ? {round: nr.label, events: nr.events, note: 'Scenario inputs are already set to this round. run_simulation uses them.'} : null,
          value_per_period: `${obj.label} per ${CAMPAIGN[t.id].unit} × ${CAMPAIGN[t.id].mult[c.period]}`}; })() : null}};
  }
  if (name === 'run_simulation') {
    const {p, errors} = applyChanges(t, cur, input.changes);
    const hard = errors.filter(e => !e.startsWith('Note'));
    if (hard.length) return {error: hard.join('; '), note: 'Simulation input rejected'};
    const r = t.simulate(p);
    const label = input.label || t.describe(p);
    return {note: `Ran simulation: ${label} → ${obj.label} ${fmtV(obj.fmt, r[obj.key])}`,
      out: {tested: label, decisions: t.describe(p), objective: objText, kpis: kpiDump(t, r, p), diagnosis: t.diagnose(p, r).map(i => i.title), notes: errors}};
  }
  if (name === 'optimize') {
    const {p, errors} = applyChanges(t, cur, input.scenario_changes || {}, 'scenario');
    const hard = errors.filter(e => !e.startsWith('Note'));
    if (hard.length) return {error: hard.join('; '), note: 'Optimizer input rejected'};
    const a = Agent.analyze(t, p, t.simulate(p));
    return {note: `Ran optimizer: ${F.int(a.evaluated)} options tested → best ${t.describe(a.best.p)}`,
      out: {objective: objText, options_evaluated: a.evaluated, ranked: a.ranked.slice(0, 5).map(c => ({rank: c.rank, option: c.isUser ? 'Student\'s current inputs' : c.name, decisions: t.describe(c.p), kpis: kpiDump(t, c.r, c.p)}))}};
  }
  if (name === 'propose_settings') {
    const {p, errors} = applyChanges(t, cur, input.changes, 'decision');
    const hard = errors.filter(e => !e.startsWith('Note'));
    if (hard.length) return {error: hard.join('; '), note: 'Proposal rejected'};
    return {note: null, proposal: {p, summary: input.summary || t.describe(p)}, out: {shown_to_student: true, decisions: t.describe(p)}};
  }
  return {error: `Unknown tool ${name}`};
}

// --- provider adapters -------------------------------------------------------
function endpoint(a, path) {
  const url = a.base.replace(/\/+$/, '') + path;
  if (!a.proxy) return url;
  const m = url.match(/^(https?):\/\/(.+)$/);
  return LLM.proxyUrl.replace(/\/+$/, '') + '/' + m[1] + '/' + m[2];
}
async function postJSON(a, url, headers, body) {
  let res;
  try { res = await fetch(url, body === undefined ? {method: 'GET', headers} : {method: 'POST', headers, body: JSON.stringify(body)}); }
  catch (e) {
    if (a.proxy) throw new Error(`Could not reach the local proxy at ${LLM.proxyUrl}. Start it with: node tools/llm-proxy.mjs`);
    if (a.id === 'ollama') throw new Error('Could not reach Ollama. Start it with OLLAMA_ORIGINS="*" ollama serve, and pull the model first (ollama pull ' + a.model + ').');
    throw new Error(`The browser could not reach ${a.label}. Either there is no internet connection, or the provider blocks direct browser calls (CORS). Tick "Use local proxy" and run: node tools/llm-proxy.mjs`);
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const raw = (data.error && (data.error.message || data.error)) || data.detail || data.message || res.statusText;
    const msg = typeof raw === 'string' ? raw : JSON.stringify(raw);
    const err = new Error(
      res.status === 401 || res.status === 403 ? `${a.label} rejected the API key (${res.status}). Check it in Live LLM settings.` :
      res.status === 404 ? `${a.label} returned 404: check the model id "${a.model}" and the base URL. Click “Load models” to see what is available. (${msg})` :
      res.status === 410 ? `The model "${a.model}" has been retired by ${a.label}. Click “Load models” in Live LLM settings and pick a current one. (${msg})` :
      res.status === 429 ? 'Rate limit or quota reached (429). Wait a moment and ask again.' :
      res.status >= 500 ? `${a.label} is busy or unavailable (${res.status}). Try again shortly.` :
      `${a.label} error ${res.status}: ${msg}`);
    err.status = res.status; err.detail = msg;
    throw err;
  }
  return data;
}
// Claude Messages API. Returns {texts, calls, stop, assistant}.
async function stepAnthropic(a, messages) {
  const body = {model: a.model, max_tokens: 16000, system: LLM_SYSTEM, tools: LLM_TOOLS, messages, cache_control: {type: 'ephemeral'}};
  const headers = {'content-type': 'application/json', 'x-api-key': a.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'};
  if (/^claude-(opus|sonnet)-5|^claude-fable/.test(a.model)) { body.output_config = {effort: 'medium'}; body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }
  const res = await postJSON(a, endpoint(a, '/messages'), headers, body);
  return {texts: res.content.filter(b => b.type === 'text').map(b => b.text), stop: res.stop_reason === 'tool_use' ? 'tool' : res.stop_reason,
    calls: res.content.filter(b => b.type === 'tool_use').map(b => ({id: b.id, name: b.name, input: b.input || {}})),
    assistant: {role: 'assistant', content: res.content}};
}
const anthropicResults = results => ({role: 'user', content: results.map(r => ({type: 'tool_result', tool_use_id: r.id, content: r.content, ...(r.isError ? {is_error: true} : {})}))});
// OpenAI-compatible chat completions (NVIDIA NIM, OpenAI, Groq, OpenRouter, Gemini, Ollama...).
// Object-valued arguments are sent as JSON strings, which every provider's schema validator accepts.
const OAI_TOOLS = LLM_TOOLS.map(tl => {
  const props = {}; Object.entries(tl.input_schema.properties || {}).forEach(([k, v]) => { props[k] = v.type === 'object' ? {type: 'string', description: 'JSON object. ' + (v.description || '')} : v; });
  return {type: 'function', function: {name: tl.name, description: tl.description, parameters: {type: 'object', properties: props, required: tl.input_schema.required || []}}};
});
async function stepOpenAI(a, messages, grounded) {
  const body = {model: a.model, messages: [{role: 'system', content: LLM_SYSTEM + (grounded ? GROUNDED_NOTE : '')}, ...messages]};
  body[a.maxField || 'max_tokens'] = 4096;

  if (!ch) throw new Error('The provider returned no answer.');
  const m = ch.message || {};
  const content = typeof m.content === 'string' ? m.content : Array.isArray(m.content) ? m.content.map(p => p.text || '').join('') : '';

const openaiResults = results => results.map(r => ({role: 'tool', tool_call_id: r.id, content: r.content}));
// For models without tool calling: pre-compute the facts and let the model explain them.
const GROUNDED_NOTE = `\n\nThis model is running without tools. Each question comes with SIMULATOR DATA computed by OpsLab. Use only numbers from that data. If a what-if is not covered, say so and suggest the student test it with Run simulation.`;
function groundedContext(t) {
  const st = runTool(t, 'get_current_state', {}).out, opt = runTool(t, 'optimize', {}).out;
  return `\n\nSIMULATOR DATA (computed by OpsLab; quote only these numbers):\n${JSON.stringify({state: st, optimizer: opt})}`;

function refreshAI(t) { if (state.view === t.id) renderAI(t); }
// Pick a sensible replacement when a model is retired: strong chat models with tool calling first.
const MODEL_PREFS = [/nemotron[-.\w]*super/i, /nemotron[-.\w]*ultra/i, /llama-?3\.3-70b/i, /llama-?4/i, /qwen3?[-.\w]*(235b|72b|32b)/i, /gpt-oss-120b/i, /mistral-large/i, /deepseek-v3/i, /gemini-2\.5-flash/i, /gpt-4\.1-mini|gpt-4o-mini/i, /claude-(opus|sonnet)/i, /instruct|chat|versatile/i];
function pickModel(list, current) {

  const pool = c.length ? c : list.filter(m => m !== current);
  for (const re of MODEL_PREFS) { const m = pool.find(x => re.test(x)); if (m) return m; }

}
async function askLLM(t, question, retried = false) {
  const chat = getChat(t.id);
  if (!retried) { chat.view.push({role: 'user', text: question}); logActivity(t, 'Student asked: ' + question.slice(0, 60)); }
  if (!llmLive()) { chat.view.push({role: 'assistant', text: ruleBasedReply(t), offline: true}); refreshAI(t); return; }
  const a = activeLLM(), sig = a.id + '|' + a.model;
  if (chat.sig !== sig) {
    if (chat.api.length) chat.view.splice(chat.view.length - 1, 0, {role: 'tool', text: `Switched to ${a.label} · ${a.model}: starting a fresh conversation context.`});
    chat.api = []; chat.sig = sig; chat.grounded = false;
  }
  LLM.busy = true; refreshAI(t);
  const startLen = chat.api.length;
  let retryNext = false;
  const userText = `[Topic: ${t.name}]\n${question}`;
  try {
    for (let step = 0; step < LLM.maxSteps; step++) {
      if (step === 0) chat.api.push(a.format === 'anthropic' ? {role: 'user', content: [{type: 'text', text: userText}]} : {role: 'user', content: userText + (chat.grounded ? groundedContext(t) : '')});
      let res;
      try { res = a.format === 'anthropic' ? await stepAnthropic(a, chat.api) : await stepOpenAI(a, chat.api, chat.grounded); }
      catch (e) {
        // Model does not support tool calling: switch this chat to grounded mode and retry once.
        if (a.format === 'openai' && !chat.grounded && step === 0 && e.status && e.status >= 400 && e.status < 500 && /tool|function/i.test(e.detail || e.message)) {
          chat.grounded = true; chat.api.length = startLen;
          chat.view.push({role: 'tool', text: 'This model does not support tool calling, so the agent pre-computed the simulator data instead.'});
          chat.api.push({role: 'user', content: userText + groundedContext(t)});
          res = await stepOpenAI(a, chat.api, true);
        } else throw e;
      }
      if (res.stop === 'refusal') { chat.view.push({role: 'error', text: 'The model declined this request. Try rephrasing it as an operations question.'}); break; }
      chat.api.push(res.assistant);
      if (res.texts.length) chat.view.push({role: 'assistant', text: res.texts.join('\n')});
      if (!res.calls.length) { if (res.stop === 'max_tokens') chat.view.push({role: 'error', text: 'The answer was cut off (length limit).'}); break; }
      const results = res.calls.map(c => {
        let r;
        if (c.bad) r = {error: c.bad};
        else { try { r = runTool(t, c.name, c.input); } catch (e) { r = {error: 'Tool failed: ' + e.message}; } }
        if (r.note) chat.view.push({role: 'tool', text: r.note});
        if (r.proposal) chat.view.push({role: 'proposal', text: r.proposal.summary, p: r.proposal.p});
        return {id: c.id, content: r.error ? r.error : JSON.stringify(r.out), isError: !!r.error};
      });
      if (a.format === 'anthropic') chat.api.push(anthropicResults(results)); else chat.api.push(...openaiResults(results));
      refreshAI(t);
      if (step === LLM.maxSteps - 1) chat.view.push({role: 'error', text: 'The agent used its step limit for this question. Ask a narrower follow-up.'});
    }
    if (!chat.view.length || chat.view[chat.view.length - 1].role === 'user') chat.view.push({role: 'error', text: 'The model returned an empty answer. Try again or pick another model.'});
    logActivity(t, `Live agent answered (${a.label} · ${a.model})`);
  } catch (e) {
    if (chat.api.length === startLen + 1) chat.api.length = startLen; // the question never got an answer
    // Model retired or unknown: fetch the provider's current models, switch to a good one, retry once.
    if ((e.status === 404 || e.status === 410) && !retried) {
      try {
        const c = LLM.cfg[LLM.provider]; c.liveModels = await loadModels();
        const next = pickModel(c.liveModels, a.model);
        if (next) {
          chat.view.push({role: 'tool', text: `“${a.model}” is not available on ${a.label}. Switched automatically to “${next}” (one of ${c.liveModels.length} current models) and asked again. You can change it in Live LLM settings.`});

      } catch (e2) { chat.view.push({role: 'error', text: e.message}); chat.view.push({role: 'tool', text: 'Could not load the model list automatically: ' + e2.message}); LLM.settingsOpen = true; }
    } else chat.view.push({role: 'error', text: e.message});
  } finally { LLM.busy = false; refreshAI(t); }

}

function ruleBasedReply(t) {
  const run = lastRun(t.id);
  if (!run) return `**Rule-based reply** (no LLM connected).\n\nRun the simulation first. I can then diagnose your decisions and compare them with tested alternatives. Connect an LLM under *Live LLM settings* to chat with a live agent.`;
  const a = run.analysis, k = t.kpis.find(k => k.key === t.objective.key), top = a.issues[0];
  const lines = [`**Rule-based reply** (no LLM connected).`, ''];
  if (a.isOptimal) lines.push(`Your latest run (${t.describe(run.p)}) is the best of the ${F.int(a.evaluated)} options I tested: **${fmtV(k.fmt, run.r[k.key])}**.`);
  else lines.push(`Try **${t.describe(a.best.p)}**: ${k.label.toLowerCase()} **${fmtV(k.fmt, a.best.r[k.key])}** vs your ${fmtV(k.fmt, run.r[k.key])} (best of ${F.int(a.evaluated)} tested options).`);
  if (top) lines.push('', `Main finding: **${top.title}**. ${top.text}`);
  const l = uniqueLessons(t, a.issues)[0]; if (l) lines.push('', `Lesson: ${l}`);
  lines.push('', 'Connect an LLM under *Live LLM settings* (Claude, NVIDIA, OpenAI, Groq, Gemini, Ollama…) to ask free-form questions and what-ifs.');
  return lines.join('\n');
}

function mdLite(s) {
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let list = null;
  s.split('\n').forEach(line => {
    const m = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (m) { if (!list) { list = []; out.push(list); } list.push(inline(m[1])); return; }
    list = null;
    if (line.trim()) out.push('<p>' + inline(line.replace(/^#+\s*/, '')) + '</p>');
  });
  return out.map(x => Array.isArray(x) ? '<ul>' + x.map(i => `<li>${i}</li>`).join('') + '</ul>' : x).join('');
}

// Fetch the provider's live model list (GET /models), so model names never go stale.
const NON_CHAT = /embed|rerank|retriev|guard|safety|reward|clip|ocr|parse|asr|tts|speech|whisper|dall-e|image|moderation|audio|transcrib|nv-yolox|paddle|deplot|kosmos|fuyu|neva|vila|cosmos|flux|sdxl|stable-diffusion|bge|e5-|arctic-embed|riva/i;
async function loadModels() {

function bindChat(t) {
  const input = $('#chatInput'); if (!input) return;
  const log = $('#chatLog'); if (log) log.scrollTop = log.scrollHeight;
  const send = () => { const q = input.value.trim(); if (!q || LLM.busy) return; LLM.drafts[t.id] = ''; askLLM(t, q); };

/* ---------------- 8. Class room (optional; needs tools/opslab-server.mjs) ----------------
   The professor creates a room; students join with the room code and their roll number.
   Each run's inputs are sent to the server, which re-computes the result with the same engine. */
const ROOM = {student: null, prof: null, dash: null, timer: null, msg: {}, health: null, form: {}};
try { ROOM.student = JSON.parse(localStorage.getItem('opslab-room-student') || 'null'); ROOM.prof = JSON.parse(localStorage.getItem('opslab-room-prof') || 'null'); } catch (e) {}
const defaultServer = () => (location.protocol.startsWith('http') ? location.origin : '');

async function roomApi(server, path, {method = 'GET', body, key} = {}) {

  catch (e) { throw new Error(e && e.name === 'TimeoutError' ? `The class-room server at ${server} did not answer within 12 seconds. Check the Wi-Fi and try again.` : `Cannot reach the class-room server at ${server}. Check the address, and that this device is on the same network as the professor’s laptop.`); }

// ---- student: submit runs ----
async function submitRun(t, run) {
  const s = ROOM.student; if (!s) return;
  run.sync = 'pending'; updateSyncCell(t, run);
  try {
    const out = await roomApi(s.server, `/api/rooms/${s.code}/runs`, {method: 'POST', body: {roll: s.roll, token: s.token, topic: t.id, p: run.p, n: run.n, round: run.round && !run.round.custom ? {period: run.round.period, k: run.round.k} : undefined}});
    run.sync = out.recorded && !out.recorded.fair ? 'custom' : 'ok';
    s.standing = {rank: out.rank, of: out.of, score: out.score, perTopic: out.perTopic};
    await flushPending();
  } catch (e) {
    run.sync = 'fail'; run.syncErr = e.message;
    if (!e.status || e.status >= 500) { s.pending = s.pending || []; s.pending.push({topic: t.id, p: run.p, n: run.n, round: run.round && !run.round.custom ? {period: run.round.period, k: run.round.k} : undefined}); }
    if (e.status === 401) s.needsRejoin = true;
  }
  saveRoom(); updateSyncCell(t, run); renderRoomPill();
  if (state.view === 'room') renderMain();
}
async function flushPending() {

    if (c === '/' && src[i + 1] === '/') { while (i < src.length && src[i] !== '\n') i++; gap = true; continue; }
    if (c === '/' && src[i + 1] === '*') { const e = src.indexOf('*/', i + 2); if (e < 0) break; i = e + 1; gap = true; continue; }
    if (/\s/.test(c)) { out += c; gap = true; continue; }

      else if (/\.(txt|md)$/i.test(f.name)) { const txt = await f.text(); const blocks = txt.split(/\n(?=#{1,3}\s)|\n\s*\n\s*\n/).map(b => b.trim()).filter(Boolean); parsed = {slides: blocks.map((b, i) => { const ls = b.split('\n').map(x => x.replace(/^#+\s*|^[-*•]\s*/, '').trim()).filter(Boolean); return {n: i + 1, title: ls[0].slice(0, 160), paras: ls.slice(1), tables: [], images: [], notes: ''}; }), boiler: []}; }
