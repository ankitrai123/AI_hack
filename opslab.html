function fieldHTML(t, x, p) {
  const v = p[x.id], cls = 'field ' + (x.role === 'decision' ? 'decision' : '') + (x.showIf && !x.showIf(p) ? ' off' : '');
  const lab = `<label for="in-${x.id}"><span>${esc(x.label)}</span>${x.unit ? `<span class="u">${esc(x.unit)}</span>` : ''}</label>`;
  const help = x.help ? `<div class="help">${esc(x.help)}</div>` : '';
  if (x.type === 'select') return `<div class="${cls}">${lab}<select id="in-${x.id}" data-id="${x.id}">${x.options.map(([ov, ol]) => `<option value="${ov}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ol)}</option>`).join('')}</select>${help}</div>`;
  if (x.type === 'text') return `<div class="${cls}">${lab}<input type="text" id="in-${x.id}" data-id="${x.id}" value="${esc(v)}" ${x.showIf && !x.showIf(p) ? 'disabled' : ''}>${help}</div>`;
  if (x.type === 'checkbox') return `<div class="${cls}" style="grid-column:1/-1"><label class="checkrow"><input type="checkbox" id="in-${x.id}" data-id="${x.id}" ${v ? 'checked' : ''}><span>${esc(x.label)}</span></label>${help}</div>`;
  if (x.type === 'jobs') return `<div class="field" style="grid-column:1/-1"><label>${esc(x.label)}</label><table class="jobs"><thead><tr><th>Job</th><th>Processing (days)</th><th>Due day</th></tr></thead><tbody>${v.map((j, i) => `<tr><td><b>${j.id}</b></td><td><input type="number" min="1" max="30" step="1" data-job="${i}" data-f="p" value="${j.p}"></td><td><input type="number" min="1" max="120" step="1" data-job="${i}" data-f="d" value="${j.d}"></td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="${cls}">${lab}<div class="row"><input type="range" id="rg-${x.id}" data-id="${x.id}" min="${x.min}" max="${x.max}" step="${x.step}" value="${v}" ${x.showIf && !x.showIf(p) ? 'disabled' : ''} aria-label="${esc(x.label)}"><input type="number" id="in-${x.id}" data-id="${x.id}" min="${x.min}" max="${x.max}" step="${x.step}" value="${v}" ${x.showIf && !x.showIf(p) ? 'disabled' : ''}></div>${help}</div>`;
}

function readInputs(t) {
  const p = state.inputs[t.id];
  t.params.forEach(x => {
    if (x.type === 'jobs') {
      $$('input[data-job]').forEach(inp => { const j = +inp.dataset.job, f = inp.dataset.f; const lo = f === 'p' ? 1 : 1, hi = f === 'p' ? 30 : 120; let val = Math.round(+inp.value); if (!isFinite(val)) val = p.jobs[j][f]; p.jobs[j][f] = clamp(val, lo, hi); inp.value = p.jobs[j][f]; });
      return;
    }
    const el = $('#in-' + x.id); if (!el) return;
    if (x.type === 'checkbox') p[x.id] = el.checked;
    else if (x.type === 'text') p[x.id] = el.value;
    else if (x.type === 'select') p[x.id] = typeof x.def === 'number' ? +el.value : el.value;
    else { let val = parseFloat(el.value); if (!isFinite(val)) val = p[x.id]; val = clamp(Math.round(val / x.step) * x.step, x.min, x.max); p[x.id] = round(val, 4); el.value = p[x.id]; const rg = $('#rg-' + x.id); if (rg) rg.value = p[x.id]; }
  });
  return p;
}

      <button class="btn primary" id="runBtn">${runs.length ? '▶ Run again' : '▶ Run simulation'}</button>
      <button class="btn" id="resetBtn" title="Restore default inputs and clear this topic's runs">↺ Reset topic</button>
      <span class="err" id="err">${esc(state.errors[t.id] || '')}</span>

  } else {

    <section class="card"><h3>${esc(t.chartTitle)}</h3><div class="chartwrap">${t.chart(run.r, b.r)}</div></section>
    <section class="card"><h3>Before / after comparison<span class="sub">Before = ${esc(prev.label)}</span></h3><div class="scroll-x"><table class="tbl">
      <thead><tr><th>KPI</th><th class="n">Before</th><th class="n">After (this run)</th><th class="n">Change</th><th class="n">AI recommended</th></tr></thead><tbody>
      <tr><td><b>Decisions</b></td><td class="n">${esc(t.describe(prev.p))}</td><td class="n">${esc(t.describe(run.p))}</td><td></td><td class="n">${esc(t.describe(b.p))}</td></tr>
      ${t.kpis.filter(k => k.fmt !== 'text' || true).map(k => `<tr><td>${esc(k.label)}</td><td class="n">${fmtV(k.fmt, prev.r[k.key])}</td><td class="n"><b>${fmtV(k.fmt, run.r[k.key])}</b></td><td class="n">${deltaHTML(k, run.r[k.key], prev.r[k.key])}</td><td class="n">${fmtV(k.fmt, b.r[k.key])}</td></tr>`).join('')}
    </tbody></table></div></section>`;
  }
  html += `<section class="card"><h3>Decision history<span class="sub">${t.objective.dir === 'max' ? 'Higher' : 'Lower'} ${esc(t.kpis.find(k => k.key === t.objective.key).label.toLowerCase())} is better</span></h3>${historyTable(t)}</section>`;

function kpiCard(k, r, pr) {
  return `<div class="kpi ${k.primary ? 'primary' : ''}"><div class="l">${esc(k.label)}</div><div class="v ${k.fmt === 'text' ? 'txt' : ''}">${fmtV(k.fmt, r[k.key])}</div><div class="d">${deltaHTML(k, r[k.key], pr ? pr[k.key] : undefined)}</div></div>`;
}
function deltaHTML(k, v, pv) {
  if (k.fmt === 'text') return v === pv ? '<span class="flat">unchanged</span>' : '<span class="flat">changed</span>';
  if (pv === undefined || !isFinite(v) || !isFinite(pv)) return (isFinite(v) === isFinite(pv)) ? '<span class="flat">—</span>' : `<span class="${isFinite(v) ? 'up' : 'down'}">${isFinite(v) ? 'now finite' : 'now infinite'}</span>`;
  const d = v - pv; if (Math.abs(d) < 1e-9) return '<span class="flat">no change</span>';
  const good = k.better === 'high' ? d > 0 : k.better === 'low' ? d < 0 : null;
  const cls = good === null ? 'flat' : good ? 'up' : 'down';
  const mag = k.fmt === 'pct' ? (Math.abs(d) * 100).toFixed(1) + ' pts' : fmtV(k.fmt, Math.abs(d)).replace('−', '');
  return `<span class="${cls}">${d > 0 ? '▲' : '▼'} ${mag}</span>`;
}
function changesText(t, a, b) {
  if (!a) return [];
  const out = [];
  t.params.forEach(x => {
    if (x.showIf && !x.showIf(b) && !x.showIf(a)) return;
    const va = a[x.id], vb = b[x.id];
    if (JSON.stringify(va) === JSON.stringify(vb)) return;
    if (x.type === 'jobs') { out.push({id: x.id, role: x.role, text: 'Job data edited'}); return; }
    const fmt = v => x.type === 'checkbox' ? (v ? 'on' : 'off') : x.type === 'select' ? (x.options.find(o => String(o[0]) === String(v)) || [v, v])[0] : v;
    out.push({id: x.id, role: x.role, text: `${x.label}: ${fmt(va)} → ${fmt(vb)}`});
  });
  return out;
}
function historyTable(t) {
  const runs = state.runs[t.id];

    runs.slice().reverse().map(r => `<tr><td>${r.n}</td><td>${esc(t.describe(r.p))}</td><td>${r.changes.length ? r.changes.map(c => `<span class="chg" ${c.role === 'scenario' ? 'title="Scenario change"' : ''}>${c.role === 'scenario' ? '⚑ ' : ''}${esc(c.text)}</span>`).join('') : '<span class="muted">' + (r.n === 1 ? 'First run' : 'No changes') + '</span>'}</td><td class="n"><b>${fmtV(k.fmt, r.r[k.key])}</b></td><td class="n">${r.n === 1 ? '<span class="flat">—</span>' : deltaHTML(k, r.r[k.key], runs[r.n - 2].r[k.key])}</td><td class="n">${F.pct(r.analysis.eff)}</td></tr>`).join('')
  }</tbody></table></div><p class="small muted" style="margin:8px 0 0">⚑ = scenario change. Compare decisions under the same scenario for a fair test.</p>`;

function renderAI(t) {
  const side = $('#side');
  const head = `<div class="card"><div class="ai-head"><div class="ai-badge">AI</div><div><h3>AI Operations Agent</h3><p><span class="status-dot"></span>Monitoring silently · rule-based (no LLM)</p></div></div>`;
  if (!t) {
    const tot = sum(TOPICS.map(x => state.runs[x.id].length));
    side.innerHTML = head + `<p class="small muted" style="margin:12px 0 0">The agent has logged <b>${tot}</b> run(s) this session. Choose a topic to see its analysis.</p></div>` + activityCard();
    return;
  }
  const run = lastRun(t.id);
  if (!run) {
    side.innerHTML = head + `<div class="ai-section"><p class="small">I watch every run in this topic, log your decisions and KPIs, and report <b>after</b> each run. I never interrupt.</p>
      <h4>What I do after each run</h4><ol class="small" style="padding-left:18px;margin:0"><li>Log your decisions and KPI changes</li><li>Diagnose inefficiencies and likely causes</li><li>Test feasible alternatives with the same simulation engine</li><li>Compare them on cost, output, delays and service</li><li>Recommend the best option and explain the trade-offs</li></ol>
      <p class="small muted">All my numbers come from the deterministic simulation. Nothing is estimated or invented.</p></div></div>` + chatHTML(t) + activityCard();

  }

  const changes = run.changes;
  const prevK = run.prev.r[k.key];
  let html = head;
  html += `<div class="ai-section"><h4>Run #${run.n} report</h4><div class="score"><div><div class="big">${effPct.toFixed(1)}%</div><div class="small muted">of best option found</div></div><div style="flex:1"><div class="small"><b>You:</b> ${fmtV(k.fmt, run.r[k.key])} · <b>Best:</b> ${fmtV(k.fmt, b.r[k.key])}</div><div class="meter"><i style="width:${clamp(effPct, 0, 100)}%"></i></div></div></div></div>`;
  html += `<div class="ai-section"><h4>Decision tracking</h4><div class="log">${run.n === 1 ? `<div>First run, compared with the default baseline.</div>` : ''}${changes.length ? changes.map(c => `<div>${c.role === 'scenario' ? '⚑ Scenario: ' : 'You changed '}${esc(c.text)}</div>`).join('') : run.n > 1 ? '<div>No inputs changed since the last run (same result: the engine is deterministic).</div>' : ''}<div>${esc(k.label)}: ${fmtV(k.fmt, prevK)} → <b>${fmtV(k.fmt, run.r[k.key])}</b> ${deltaHTML(k, run.r[k.key], prevK)}</div></div></div>`;
  html += `<div class="ai-section"><h4>Diagnosis</h4>${a.issues.map(i => `<div class="issue ${i.sev}"><span class="ic">${i.sev === 'high' ? '!' : i.sev === 'med' ? '▲' : '✓'}</span><div><b>${esc(i.title)}</b>${esc(i.text)}</div></div>`).join('')}</div>`;
  if (a.isOptimal) {
    html += `<div class="ai-section"><div class="issue ok"><span class="ic">✓</span><div><b>Your decision is the best option I found.</b>I tested ${F.int(a.evaluated)} alternatives and none did better on ${esc(k.label.toLowerCase())}. Try a scenario change to stress-test it.</div></div></div>`;
  } else {
    html += `<div class="ai-section"><h4>Recommendation</h4><div class="rec"><div class="name">${esc(b.name)}</div><div class="small">${esc(t.describe(b.p))}</div><div class="small" style="margin-top:6px">${esc(k.label)}: <b>${fmtV(k.fmt, b.r[k.key])}</b> vs your ${fmtV(k.fmt, run.r[k.key])}</div>
      ${a.gains.length ? `<div class="small" style="margin-top:6px"><b class="up">Gains</b><ul class="clean">${a.gains.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>` : ''}
      ${a.costs.length ? `<div class="small" style="margin-top:4px"><b class="down">Gives up</b><ul class="clean">${a.costs.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>` : ''}
    </div></div>`;
  }
  html += `<div class="ai-section" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ${state.adviceOpen[t.id] ? '' : 'primary'}" id="adviceBtn">${state.adviceOpen[t.id] ? 'Hide AI advice' : '✦ Get AI advice'}</button>${!a.isOptimal ? '<button class="btn" id="applyBtn" title="Copy the recommended decisions into your inputs. You still press Run.">Apply recommendation</button>' : ''}</div>`;
  if (state.adviceOpen[t.id]) {
    html += `<div class="ai-section"><h4>Alternatives I tested</h4><p class="small muted" style="margin:0 0 6px">${F.int(a.evaluated)} options evaluated in ${a.ms.toFixed(0)} ms with the same engine${t.feasible ? '. Options that miss the service target are ranked last' : ''}.</p><div class="scroll-x"><table class="tbl"><thead><tr><th>#</th><th>Option</th>${t.kpis.filter(x => x.better).slice(0, 3).map(x => `<th class="n">${esc(x.label)}</th>`).join('')}</tr></thead><tbody>
      ${a.ranked.map(c => `<tr class="${c === b ? 'best' : c.isUser ? 'user' : ''}"><td>${c.rank}</td><td><b>${esc(c.isUser ? 'Your decision' : c.name)}</b>${c.alsoName ? ` <span class="muted">(= ${esc(c.alsoName)})</span>` : ''}<div class="small muted">${esc(t.describe(c.p))}${c.why && !c.isUser ? ' · ' + esc(c.why) : ''}${t.feasible && !c.feasible ? ' · <b class="down">misses target</b>' : ''}</div></td>${t.kpis.filter(x => x.better).slice(0, 3).map(x => `<td class="n">${fmtV(x.fmt, c.r[x.key])}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div>
    <div class="ai-section"><h4>Trade-offs explained</h4><p class="small" style="margin:0">${t.explain(run.p, run.r, b)}</p></div>
    <div class="ai-section"><h4>Lessons from this run</h4><ul class="clean small">${uniqueLessons(t, a.issues).map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
  }
  html += '</div>' + chatHTML(t) + activityCard();
  side.innerHTML = html;
  bindChat(t);
  $('#adviceBtn').onclick = () => { state.adviceOpen[t.id] = !state.adviceOpen[t.id]; logActivity(t, state.adviceOpen[t.id] ? 'Advice requested' : 'Advice hidden'); renderAI(t); };
  const ap = $('#applyBtn');
  if (ap) ap.onclick = () => {
    const bp = b.p, p = state.inputs[t.id];
    t.params.filter(x => x.role === 'decision').forEach(x => { p[x.id] = JSON.parse(JSON.stringify(bp[x.id])); });
    if (bp.rule === 'SEQ') { p.rule = 'CUSTOM'; p.custom = bp.seq.join(','); }
    logActivity(t, 'Recommendation applied to inputs: ' + t.describe(bp));
    renderMain(); renderAI(t);
    const rb = $('#runBtn'); if (rb) { rb.focus(); rb.scrollIntoView({block: 'center', behavior: 'smooth'}); }
  };
}
function uniqueLessons(t, issues) {
  const L = []; issues.forEach(i => { const l = t.lessons[i.code]; if (l && !L.includes(l)) L.push(l); });
  return L.length ? L : ['Compare your result with the alternatives: the best decision balances every cost involved.'];
}
function logActivity(t, text) { state.history.push({time: new Date(), topic: t ? t.short : '', text}); if (state.history.length > 200) state.history.shift(); }
function activityCard() {
  const items = state.history.slice(-8).reverse();
  return `<div class="card"><h3>Agent activity log<span class="sub">all topics</span></h3>${items.length ? `<div class="log">${items.map(h => `<div><span class="mono">${h.time.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'})}</span> · <b>${esc(h.topic)}</b> ${esc(h.text)}</div>`).join('')}</div>` : '<p class="small muted" style="margin:0">Nothing logged yet.</p>'}</div>`;
}

function runSimulation(t) {
  const p = readInputs(t);
  const err = t.validate ? t.validate(p) : null;
  state.errors[t.id] = err || '';
  if (err) { $('#err').textContent = err; return null; }
  const snap = JSON.parse(JSON.stringify(p));
  const r = t.simulate(snap);
  const runs = state.runs[t.id];
  const prevRun = runs[runs.length - 1];
  const base = defaults(t);
  const prev = prevRun ? {label: 'previous run (#' + prevRun.n + ')', p: prevRun.p, r: prevRun.r} : {label: 'default baseline', p: base, r: t.simulate(base)};
  const analysis = Agent.analyze(t, snap, r);
  const run = {n: runs.length + 1, p: snap, r, prev, analysis, changes: changesText(t, prev.p, snap), time: new Date()};
  runs.push(run);
  const k = t.kpis.find(k => k.key === t.objective.key);
  logActivity(t, `Run #${run.n}: ${t.describe(snap)} → ${k.label} ${fmtV(k.fmt, r[k.key])}; tested ${analysis.evaluated} alternatives (${F.pct(analysis.eff)} of best)`);
  return run;
}

function bindInputs(t) {
  const p = state.inputs[t.id];
  $$('#inputs input[type=range]').forEach(rg => rg.addEventListener('input', () => { const n = $('#in-' + rg.dataset.id); n.value = rg.value; }));
  $$('#inputs input[type=number][data-id]').forEach(n => n.addEventListener('change', () => readInputs(t)));
  $$('#inputs select, #inputs input[type=checkbox]').forEach(el => el.addEventListener('change', () => { readInputs(t); if (t.params.some(x => x.showIf)) { renderMain(); } }));
  $$('#inputs input[type=range]').forEach(rg => rg.addEventListener('change', () => readInputs(t)));
  $('#runBtn').onclick = () => { const run = runSimulation(t); if (run) { render(); } };
  $('#resetBtn').onclick = () => { state.inputs[t.id] = defaults(t); state.runs[t.id] = []; state.adviceOpen[t.id] = false; state.errors[t.id] = ''; logActivity(t, 'Topic reset to defaults'); render(); };
}

function renderMain() {
  const main = $('#main');
  if (state.view === 'report') { main.innerHTML = reportHTML(); $('#printBtn').onclick = () => window.print(); return; }
  if (state.view === 'guide') { main.innerHTML = guideHTML(); return; }
  const t = TOPIC[state.view];
  main.innerHTML = renderTopic(t);
  bindInputs(t);
}
function render() {
  renderNav(); renderMain();
  renderAI(TOPIC[state.view] || null);
}

/* ---------------- 6. Session report & instructor guide ---------------- */
function reportHTML() {
  const used = TOPICS.filter(t => state.runs[t.id].length);
  let html = `<section class="card doc"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1"><h2>End-of-run report</h2><p class="muted" style="margin:0">Prepared by the rule-based AI Operations Agent from your logged runs · ${new Date().toLocaleString()}</p></div><button class="btn primary noprint" id="printBtn">Print / save as PDF</button></div>`;
  if (!used.length) return html + `<div class="empty" style="margin-top:14px">No runs yet. Run at least one simulation and the report fills in automatically.</div></section>`;
  const overall = sum(used.map(t => bestRun(t).analysis.eff)) / used.length;
  html += `<div class="callout"><b>Summary:</b> ${used.length} of 6 topics attempted, ${sum(used.map(t => state.runs[t.id].length))} runs in total. Averaging your best run per topic, you reached <b>${F.pct(overall)}</b> of the agent's best option.</div>`;
  used.forEach(t => {
    const runs = state.runs[t.id], k = t.kpis.find(k => k.key === t.objective.key);
    const first = runs[0], best = bestRun(t), last = runs[runs.length - 1];
    const mistakes = new Map();
    runs.forEach(r => r.analysis.issues.filter(i => i.sev !== 'ok').forEach(i => { if (!mistakes.has(i.code)) mistakes.set(i.code, {title: i.title, runs: []}); mistakes.get(i.code).runs.push(r.n); }));
    const improvements = [], setbacks = [];
    runs.slice(1).forEach((r, i) => {
      const pr = runs[i]; const dchg = r.changes.filter(c => c.role === 'decision').map(c => c.text).join('; ') || 'no decision change';
      if (Agent.better(t, r.r, pr.r, r.p, pr.p)) improvements.push(`Run ${r.n}: ${dchg} → ${k.label.toLowerCase()} ${fmtV(k.fmt, pr.r[k.key])} → ${fmtV(k.fmt, r.r[k.key])}`);
      else if (Agent.better(t, pr.r, r.r, pr.p, r.p)) setbacks.push(`Run ${r.n}: ${dchg} → ${k.label.toLowerCase()} worsened to ${fmtV(k.fmt, r.r[k.key])}`);
    });
    const lessons = new Set(); runs.forEach(r => uniqueLessons(t, r.analysis.issues).forEach(l => lessons.add(l)));
    html += `<div class="rep-topic"><h3>${t.num}. ${esc(t.name)}</h3>
      <div class="two"><div><table class="tbl"><tbody>
        <tr><td>Runs</td><td class="n">${runs.length}</td></tr>

        <tr><td>Agent's best option</td><td class="n">${esc(t.describe(best.analysis.best.p))}: ${fmtV(k.fmt, best.analysis.best.r[k.key])}</td></tr>
        <tr><td>Share of best achieved</td><td class="n"><b>${F.pct(best.analysis.eff)}</b> (first run ${F.pct(first.analysis.eff)})</td></tr>
      </tbody></table></div>
      <div><b class="small">Decisions made</b><ul class="clean small">${runs.map(r => `<li>Run ${r.n}: ${esc(t.describe(r.p))} → ${fmtV(k.fmt, r.r[k.key])}</li>`).join('')}</ul></div></div>
      <div class="two" style="margin-top:8px"><div><b class="small">Mistakes &amp; inefficiencies found</b><ul class="clean small">${mistakes.size ? [...mistakes.values()].map(m => `<li>${esc(m.title)} <span class="muted">(run${m.runs.length > 1 ? 's' : ''} ${m.runs.join(', ')})</span></li>`).join('') : '<li>None flagged.</li>'}</ul>
        ${setbacks.length ? `<b class="small">Setbacks</b><ul class="clean small">${setbacks.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}</div>

      <div style="margin-top:8px"><b class="small">Lessons learned</b><ul class="clean small">${[...lessons].map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>

/* ---------------- 7. Live AI agent (optional, Claude API) ----------------
   A tool-using LLM agent. Every number it quotes must come from the tools below,
   which call the same deterministic engine as the rest of the app.
   Without an API key the chat answers with the rule-based agent instead. */
const LLM = {
  models: [['claude-opus-5-5', 'Claude Opus 5.5 (best)'], ['claude-sonnet-5-5', 'Claude Sonnet 5.5 (faster)'], ['claude-haiku-5-5', 'Claude Haiku 5.5 (cheapest)']],
  model: 'claude-opus-5-5', key: '', remember: false, busy: false, chats: {}, drafts: {}, maxSteps: 8
};
try { const k = localStorage.getItem('opslab-key'); if (k) { LLM.key = k; LLM.remember = true; } const m = localStorage.getItem('opslab-model'); if (m && LLM.models.some(x => x[0] === m)) LLM.model = m; } catch (e) {}
const getChat = id => (LLM.chats[id] = LLM.chats[id] || {view: [], api: []});

const LLM_SYSTEM = `You are the OpsLab Operations Coach, a live AI agent inside a classroom simulator for an MBA Operations Management course. The student plays an operations manager. Six topics exist: bottleneck & capacity, inventory management, production scheduling, quality management, queue management, supply chain disruption. Each user message says which topic the student is on.

How to work:
- Call get_current_state first to see the inputs, the student's latest run and the rule-based agent's best alternative.
- Test ideas with run_simulation (several calls in parallel are fine) or optimize. These run the app's deterministic engine.
- Every number you state must come from a tool result in this conversation. Never estimate, round up from memory or invent KPIs. If you have not run something, run it or say you have not tested it.
- When you recommend specific decision values you have tested, call propose_settings once so the student can apply them. Never claim you changed their inputs.

How to answer:
- Teach, don't just prescribe: name the operations concept (bottleneck, EOQ, safety stock, dispatching rules, cost of quality, Erlang C, Little's Law, resilience trade-offs) and explain the trade-off in plain language.
- Lead with the answer. Keep it under about 180 words. Use short paragraphs or "- " bullets and **bold** for key numbers. No tables or headings.
- Suggest one thing the student could try next.
- Stay on operations management and this simulator. Politely steer other requests back.`;

const LLM_TOOLS = [
  {name: 'get_current_state', description: "Returns the current topic, every input (id, label, unit, role 'decision' or 'scenario', allowed range or options, current value), the objective, the KPIs and diagnosis of the student's latest run (null if none yet), and the rule-based agent's best alternative.",
    input_schema: {type: 'object', properties: {}, additionalProperties: false}},
  {name: 'run_simulation', description: "Runs the deterministic simulation for the current topic with the student's current inputs plus the given changes. Sandbox only: it does not change the student's inputs or history. Use it for every what-if before quoting numbers. Returns all KPIs, the objective value, whether constraints are met, and the diagnosis.",
    input_schema: {type: 'object', properties: {
      changes: {type: 'object', description: 'Map of input id to new value, e.g. {"mB": 2}, {"rule": "EDD"}, {"cont": true, "R": 2}. Use ids from get_current_state. Scenario inputs may be changed too, for what-if questions. Use {} to run the current inputs.'},
      label: {type: 'string', description: 'Short name for this test, shown to the student.'}}, required: ['changes']}},
  {name: 'optimize', description: 'Runs the rule-based optimizer (exhaustive or grid search over the decision inputs) for the current topic, optionally after applying scenario changes. Returns the top-ranked options with KPIs. Useful to check robustness when the scenario changes.',
    input_schema: {type: 'object', properties: {scenario_changes: {type: 'object', description: 'Optional map of scenario input id to value, e.g. {"demand": 130}.'}}}},
  {name: 'propose_settings', description: 'Shows the student an "Apply suggested settings" button in the chat for decision inputs you recommend. The student decides whether to apply and run. Only include decision inputs whose values you have tested with run_simulation.',
    input_schema: {type: 'object', properties: {changes: {type: 'object', description: 'Map of decision input id to value.'}, summary: {type: 'string', description: 'One short line describing the proposal.'}}, required: ['changes', 'summary']}}
];

function applyChanges(t, base, changes, onlyRole) {
  const p = JSON.parse(JSON.stringify(base)), errors = [];
  Object.entries(changes || {}).forEach(([id, v]) => {
    const x = t.params.find(q => q.id === id);
    if (!x) { errors.push(`Unknown input "${id}". Valid ids: ${t.params.map(q => q.id).join(', ')}`); return; }
    if (onlyRole && x.role !== onlyRole) { errors.push(`"${id}" is a ${x.role} input, not a ${onlyRole}`); return; }
    if (x.type === 'checkbox') p[id] = v === true || v === 'true' || v === 1;
    else if (x.type === 'text') p[id] = String(v);
    else if (x.type === 'select') { const o = x.options.find(o => String(o[0]).toUpperCase() === String(v).toUpperCase()); if (!o) errors.push(`"${id}" must be one of ${x.options.map(o => o[0]).join(', ')}`); else p[id] = o[0]; }
    else if (x.type === 'jobs') {
      if (!Array.isArray(v) || v.some(j => !p.jobs.find(k => k.id === j.id))) errors.push('jobs must be an array of {id, p, d} using existing job ids');
      else v.forEach(j => { const k = p.jobs.find(k => k.id === j.id); if (j.p != null) k.p = clamp(Math.round(+j.p), 1, 30); if (j.d != null) k.d = clamp(Math.round(+j.d), 1, 120); });
    } else {
      const n = +v; if (!isFinite(n)) { errors.push(`"${id}" must be a number`); return; }
      const c = round(clamp(Math.round(n / x.step) * x.step, x.min, x.max), 4);
      if (Math.abs(c - n) > 1e-9) errors.push(`Note: ${id}=${n} adjusted to ${c} (allowed ${x.min}–${x.max}, step ${x.step})`);
      p[id] = c;
    }
  });
  if (!errors.some(e => !e.startsWith('Note')) && t.validate) { const e = t.validate(p); if (e) errors.push(e); }
  return {p, errors};
}
function kpiDump(t, r, p) {
  const o = {};
  t.kpis.forEach(k => { o[k.label] = fmtV(k.fmt, r[k.key]).replace(/&[a-z]+;/g, ''); });
  if (t.feasible) o['Meets service target'] = t.feasible(r, p);
  return o;
}
function paramDump(t, p) {
  return t.params.map(x => {
    const d = {id: x.id, label: x.label, role: x.role, value: p[x.id]};
    if (x.unit) d.unit = x.unit;
    if (x.type === 'select') d.options = x.options.map(o => o[0]);
    else if (x.type === 'checkbox') d.type = 'boolean';
    else if (x.type === 'text') d.type = 'text (used when rule = CUSTOM)';
    else if (x.type !== 'jobs') Object.assign(d, {min: x.min, max: x.max, step: x.step});
    if (x.help) d.note = x.help;
    return d;
  });
}
function runTool(t, name, input) {
  const cur = state.inputs[t.id], obj = t.kpis.find(k => k.key === t.objective.key);
  const objText = `${t.objective.dir === 'max' ? 'maximize' : 'minimize'} ${obj.label}`;
  if (name === 'get_current_state') {
    const run = lastRun(t.id);
    return {note: 'Read the current state', out: {topic: t.name, role: t.role, objective: objText, inputs: paramDump(t, cur),
      runs_so_far: state.runs[t.id].length,
      latest_run: run ? {decisions: t.describe(run.p), kpis: kpiDump(t, run.r, run.p), diagnosis: run.analysis.issues.map(i => `${i.title}: ${i.text}`),
        share_of_best_option: F.pct(run.analysis.eff),
        rule_based_best: {option: run.analysis.best.name, decisions: t.describe(run.analysis.best.p), kpis: kpiDump(t, run.analysis.best.r, run.analysis.best.p)}} : null,
      inputs_differ_from_latest_run: run ? JSON.stringify(run.p) !== JSON.stringify(cur) : null}};
  }
  if (name === 'run_simulation') {
    const {p, errors} = applyChanges(t, cur, input.changes);
    const hard = errors.filter(e => !e.startsWith('Note'));
    if (hard.length) return {error: hard.join('; '), note: 'Simulation input rejected'};
    const r = t.simulate(p);
    const label = input.label || t.describe(p);
    return {note: `Ran simulation: ${label} → ${obj.label} ${fmtV(obj.fmt, r[obj.key])}`,
      out: {tested: label, decisions: t.describe(p), objective: objText, kpis: kpiDump(t, r, p), diagnosis: t.diagnose(p, r).map(i => i.title), notes: errors}};
  }
  if (name === 'optimize') {
    const {p, errors} = applyChanges(t, cur, input.scenario_changes || {}, 'scenario');
    const hard = errors.filter(e => !e.startsWith('Note'));
    if (hard.length) return {error: hard.join('; '), note: 'Optimizer input rejected'};
    const a = Agent.analyze(t, p, t.simulate(p));
    return {note: `Ran optimizer: ${F.int(a.evaluated)} options tested → best ${t.describe(a.best.p)}`,
      out: {objective: objText, options_evaluated: a.evaluated, ranked: a.ranked.slice(0, 5).map(c => ({rank: c.rank, option: c.isUser ? 'Student\'s current inputs' : c.name, decisions: t.describe(c.p), kpis: kpiDump(t, c.r, c.p)}))}};
  }
  if (name === 'propose_settings') {
    const {p, errors} = applyChanges(t, cur, input.changes, 'decision');
    const hard = errors.filter(e => !e.startsWith('Note'));
    if (hard.length) return {error: hard.join('; '), note: 'Proposal rejected'};
    return {note: null, proposal: {p, summary: input.summary || t.describe(p)}, out: {shown_to_student: true, decisions: t.describe(p)}};
  }
  return {error: `Unknown tool ${name}`};
}

async function callClaude(messages) {
  const body = {model: LLM.model, max_tokens: 16000, system: LLM_SYSTEM, tools: LLM_TOOLS, messages,
    output_config: {effort: 'medium'}, cache_control: {type: 'ephemeral'}};
  const headers = {'content-type': 'application/json', 'x-api-key': LLM.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'};
  if (LLM.model !== 'claude-haiku-5-5') { body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }
  let res;
  try { res = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST', headers, body: JSON.stringify(body)}); }
  catch (e) { throw new Error('Could not reach the Claude API. Check the internet connection (the rest of OpsLab works offline).'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error && data.error.message ? data.error.message : res.statusText;
    if (res.status === 401) throw new Error('The API key was rejected (401). Check it in Live LLM settings.');
    if (res.status === 429) throw new Error('Rate limit reached (429). Wait a moment and ask again.');
    if (res.status === 529 || res.status >= 500) throw new Error(`The Claude API is busy or unavailable (${res.status}). Try again shortly.`);
    throw new Error(`Claude API error ${res.status}: ${msg}`);
  }
  return data;
}

function refreshAI(t) { if (state.view === t.id) renderAI(t); }
async function askLLM(t, question) {
  const chat = getChat(t.id);
  chat.view.push({role: 'user', text: question});
  logActivity(t, 'Student asked: ' + question.slice(0, 60));
  if (!LLM.key) { chat.view.push({role: 'assistant', text: ruleBasedReply(t), offline: true}); refreshAI(t); return; }
  LLM.busy = true; refreshAI(t);
  const startLen = chat.api.length;
  chat.api.push({role: 'user', content: [{type: 'text', text: `[Topic: ${t.name}]\n${question}`}]});
  try {
    for (let step = 0; step < LLM.maxSteps; step++) {
      const res = await callClaude(chat.api);
      if (res.stop_reason === 'refusal') { chat.view.push({role: 'error', text: 'The model declined this request. Try rephrasing it as an operations question.'}); break; }
      chat.api.push({role: 'assistant', content: res.content});
      const text = res.content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
      if (text) chat.view.push({role: 'assistant', text});
      const uses = res.content.filter(b => b.type === 'tool_use');
      if (!uses.length) { if (res.stop_reason === 'max_tokens') chat.view.push({role: 'error', text: 'The answer was cut off (length limit).'}); break; }
      const results = uses.map(u => {
        let r;
        try { r = runTool(t, u.name, u.input || {}); } catch (e) { r = {error: 'Tool failed: ' + e.message}; }
        if (r.note) chat.view.push({role: 'tool', text: r.note});
        if (r.proposal) chat.view.push({role: 'proposal', text: r.proposal.summary, p: r.proposal.p});
        return r.error ? {type: 'tool_result', tool_use_id: u.id, content: r.error, is_error: true}
                       : {type: 'tool_result', tool_use_id: u.id, content: JSON.stringify(r.out)};
      });
      chat.api.push({role: 'user', content: results});
      refreshAI(t);
      if (step === LLM.maxSteps - 1) chat.view.push({role: 'error', text: 'The agent used its step limit for this question. Ask a narrower follow-up.'});
    }
    logActivity(t, 'Live agent answered (' + LLM.model + ')');
  } catch (e) {
    if (chat.api.length === startLen + 1) chat.api.length = startLen; // the question never reached the model
    chat.view.push({role: 'error', text: e.message});
  } finally { LLM.busy = false; refreshAI(t); }
}

function ruleBasedReply(t) {
  const run = lastRun(t.id);
  if (!run) return `**Rule-based reply** (no API key, so no live LLM).\n\nRun the simulation first. I can then diagnose your decisions and compare them with tested alternatives. Add an API key under *Live LLM settings* to chat with a live agent.`;
  const a = run.analysis, k = t.kpis.find(k => k.key === t.objective.key), top = a.issues[0];
  const lines = [`**Rule-based reply** (no API key, so no live LLM).`, ''];
  if (a.isOptimal) lines.push(`Your latest run (${t.describe(run.p)}) is the best of the ${F.int(a.evaluated)} options I tested: **${fmtV(k.fmt, run.r[k.key])}**.`);
  else lines.push(`Try **${t.describe(a.best.p)}**: ${k.label.toLowerCase()} **${fmtV(k.fmt, a.best.r[k.key])}** vs your ${fmtV(k.fmt, run.r[k.key])} (best of ${F.int(a.evaluated)} tested options).`);
  if (top) lines.push('', `Main finding: **${top.title}**. ${top.text}`);
  const l = uniqueLessons(t, a.issues)[0]; if (l) lines.push('', `Lesson: ${l}`);
  lines.push('', 'Add an API key under *Live LLM settings* to ask free-form questions and what-ifs.');
  return lines.join('\n');
}

function mdLite(s) {
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let list = null;
  s.split('\n').forEach(line => {
    const m = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (m) { if (!list) { list = []; out.push(list); } list.push(inline(m[1])); return; }
    list = null;
    if (line.trim()) out.push('<p>' + inline(line.replace(/^#+\s*/, '')) + '</p>');
  });
  return out.map(x => Array.isArray(x) ? '<ul>' + x.map(i => `<li>${i}</li>`).join('') + '</ul>' : x).join('');
}

function chatHTML(t) {
  const chat = getChat(t.id), live = !!LLM.key;
  const chips = ['How can I improve my last run?', 'Explain the trade-off in the recommendation', 'Stress-test my plan: what if conditions get worse?', 'Which concept should I learn from this?'];
  const log = chat.view.map((m, i) => {
    if (m.role === 'user') return `<div class="msg user">${esc(m.text)}</div>`;
    if (m.role === 'tool') return `<div class="msg tool">⚙ ${esc(m.text)}</div>`;
    if (m.role === 'error') return `<div class="msg error">${esc(m.text)}</div>`;
    if (m.role === 'proposal') return `<div class="msg assistant"><span class="who">Suggested settings</span>${esc(m.text)}<div style="margin-top:6px"><button class="btn small primary" data-apply="${i}">Apply suggested settings</button></div></div>`;
    return `<div class="msg assistant"><span class="who">${m.offline ? 'Rule-based agent' : 'Live AI agent'}</span>${mdLite(m.text)}</div>`;
  }).join('');
  return `<div class="card" id="chatCard"><h3>Ask the AI agent <span class="live ${live ? 'on' : 'off'}">${live ? '● Live LLM' : '○ Offline (rule-based)'}</span></h3>
    <p class="small muted" style="margin:0">${live ? `Uses ${esc((LLM.models.find(m => m[0] === LLM.model) || [0, LLM.model])[1])}. It tests ideas by running this simulator, so every number it quotes is computed, not guessed.` : 'Add your Claude API key below to chat with a live LLM agent. Without one, the rule-based agent answers.'}</p>
    ${log ? `<div class="chat-log" id="chatLog">${log}${LLM.busy ? '<div class="msg tool dots">Agent is thinking and running simulations</div>' : ''}</div>` : `<div class="chips">${chips.map(c => `<button class="chip" data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}
    <div class="chat-in" style="margin-top:8px"><textarea id="chatInput" rows="2" placeholder="Ask for a suggestion, e.g. “Should I add a machine at B?”" ${LLM.busy ? 'disabled' : ''}>${esc(LLM.drafts[t.id] || '')}</textarea><button class="btn primary" id="chatSend" ${LLM.busy ? 'disabled' : ''}>Ask</button></div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:4px">${chat.view.length ? '<button class="btn ghost small" id="chatClear">Clear chat</button>' : ''}<span class="small muted" style="margin-left:auto">Enter to send · Shift+Enter for a new line</span></div>
    <details class="llm-set" ${live ? '' : ''}><summary>Live LLM settings</summary>
      <div class="row2"><input type="password" id="llmKey" placeholder="sk-ant-… (your Claude API key)" value="${esc(LLM.key)}" autocomplete="off"><select id="llmModel">${LLM.models.map(([v, l]) => `<option value="${v}" ${v === LLM.model ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="row2"><label class="small"><input type="checkbox" id="llmRemember" ${LLM.remember ? 'checked' : ''}> Remember on this device</label><button class="btn small" id="llmSave">Save</button>${LLM.key ? '<button class="btn small ghost" id="llmForget">Forget key</button>' : ''}</div>
      <p class="small muted" style="margin:6px 0 0">The key stays in this browser and is sent only to api.anthropic.com. Use a key with a spending limit, and don't tick “Remember” on shared classroom computers.</p>
    </details></div>`;
}
function bindChat(t) {
  const input = $('#chatInput'); if (!input) return;
  const log = $('#chatLog'); if (log) log.scrollTop = log.scrollHeight;
  const send = () => { const q = input.value.trim(); if (!q || LLM.busy) return; LLM.drafts[t.id] = ''; askLLM(t, q); };
  input.addEventListener('input', () => { LLM.drafts[t.id] = input.value; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('#chatSend').onclick = send;
  $$('#chatCard .chip').forEach(c => c.onclick = () => { if (!LLM.busy) askLLM(t, c.dataset.q); });
  const clr = $('#chatClear'); if (clr) clr.onclick = () => { LLM.chats[t.id] = {view: [], api: []}; renderAI(t); };
  $$('#chatCard [data-apply]').forEach(b => b.onclick = () => {
    const m = getChat(t.id).view[+b.dataset.apply], p = state.inputs[t.id];
    t.params.filter(x => x.role === 'decision').forEach(x => { p[x.id] = JSON.parse(JSON.stringify(m.p[x.id])); });
    logActivity(t, 'Live agent suggestion applied: ' + t.describe(p));
    renderMain(); renderAI(t);
    const rb = $('#runBtn'); if (rb) { rb.focus(); rb.scrollIntoView({block: 'center', behavior: 'smooth'}); }
  });
  $('#llmSave').onclick = () => {
    LLM.key = $('#llmKey').value.trim(); LLM.model = $('#llmModel').value; LLM.remember = $('#llmRemember').checked;
    try { if (LLM.remember && LLM.key) localStorage.setItem('opslab-key', LLM.key); else localStorage.removeItem('opslab-key'); localStorage.setItem('opslab-model', LLM.model); } catch (e) {}
    logActivity(t, LLM.key ? 'Live LLM enabled (' + LLM.model + ')' : 'Live LLM disabled');
    renderAI(t);
  };
  const fg = $('#llmForget'); if (fg) fg.onclick = () => { LLM.key = ''; LLM.remember = false; try { localStorage.removeItem('opslab-key'); } catch (e) {} logActivity(t, 'API key removed'); renderAI(t); };
}

/* ---------------- boot ---------------- */
$('#resetAllBtn').onclick = () => { resetState(); state.errors = {}; logActivity(null, 'Session reset'); render(); };
$('#themeBtn').onclick = () => {
  const root = document.documentElement, cur = root.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem('opslab-theme', dark ? 'light' : 'dark'); } catch (e) {}
};
try { const th = localStorage.getItem('opslab-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
// shared tooltip for charts
(() => {
  const tip = $('#tip');
  document.addEventListener('mousemove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { tip.style.opacity = 0; return; }
    tip.textContent = el.getAttribute('data-tip'); tip.style.opacity = 1;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 14) + 'px';
    tip.style.top = Math.max(8, e.clientY - h - 10) + 'px';
  });
})();
render();
// Exposed for automated testing
window.OpsLab = {TOPICS, TOPIC, Agent, state, defaults, render, LLM, runTool};
</script>
</body>
